name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every cargo call here is `--locked` bar one — `cargo hack --no-dev-deps`
# rewrites the manifests it checks — so the tree that is checked is the one in
# `Cargo.lock` and nothing else, and a red run can be reproduced by whoever
# reads it. A pull request that changes a dependency fails here until the
# **Lockfile** workflow has resolved the tree again — which is the point, and
# is the only place that command runs. See CLAUDE.md.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything: it checks out, compiles and reads. Every other
# workflow scopes its token and this one ran on every push to main with
# whatever the repository default is.
permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@68250fb3d551d72befef105162372ebb3e8016e0 # nextest
        with:
          tool: nextest
      - run: cargo nextest run --locked --workspace --all-features --profile ci
      # nextest does not run doctests, and the crate-level examples are docs.
      - run: cargo test --locked --workspace --all-features --doc

  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # rust-toolchain.toml pins stable for developers; this job is the one
      # place the MSRV claim in Cargo.toml is actually checked.
      - run: rm rust-toolchain.toml
      - run: cargo check --locked --workspace --all-features

  specs:
    name: specs are valid OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml openapi-spec-validator
      # TEMPORARY, for one run: the exact closure to write into
      # scripts/requirements.txt. Removed in the next commit on this branch.
      - name: What that resolved to
        run: |
          python3 -m venv /tmp/pin
          /tmp/pin/bin/pip install --quiet pyyaml openapi-spec-validator
          echo "----- BEGIN CLOSURE -----"
          /tmp/pin/bin/pip freeze
          echo "----- END CLOSURE -----"
      - run: python3 scripts/validate_specs.py --strict
      # A field this branch stopped documenting, said out loud. Not a failure:
      # upstream is allowed to withdraw a field, and only a person can tell that
      # from the script having dropped one.
      - name: What this branch changed about the fields the specs carry
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/compare_specs.py --against-git "origin/${{ github.base_ref }}" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

  # A tolerated list nothing enforces is a list that rots: this script measured
  # itself against a closed issue's number for weeks before anybody looked. So
  # the accounting in `NOT_REACHED_ON_PURPOSE` is checked on every push, and it
  # is the two lists rather than the total that fail the job — an operation
  # nothing calls and nothing explains, or an explanation that no longer
  # describes anything.
  coverage:
    name: every documented operation is reached or explained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      # The detector before what it detects: a check nobody has seen fail is a
      # check nobody knows works.
      - run: python3 scripts/coverage.py --self-test
      - run: python3 scripts/coverage.py

  dependencies:
    name: dependencies are sound and permissively licensed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  features:
    name: every feature combination compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@68250fb3d551d72befef105162372ebb3e8016e0 # cargo-hack
        with:
          tool: cargo-hack
      # The one job without `--locked`, and it cannot have it: `--no-dev-deps`
      # rewrites every manifest to drop dev-dependencies, which changes what
      # resolves, which is exactly what `--locked` refuses. The lockfile is
      # still what the other five check.
      - run: cargo hack check --each-feature --no-dev-deps --workspace
