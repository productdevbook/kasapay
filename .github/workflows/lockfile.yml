name: Lockfile

# Writes `Cargo.lock` and opens a pull request with it.
#
# Nothing is ever built on the machine this project is developed on — CLAUDE.md
# says why, and holds the same rule for the agents that work here — so this is
# the only place a lockfile can be produced at all. `cargo generate-lockfile`
# resolves dependencies and compiles nothing, which is cheap, but the rule is
# "cargo fmt only" rather than "only what is cheap".
#
# Run it by hand after changing a dependency, and monthly on its own so the
# pinned tree does not quietly fall a year behind. Either way the pull request's
# own CI run is what says whether the resolution is any good; nothing here is
# applied automatically.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "resolve: the whole tree, every pin moves. workspace: only this workspace's own entries."
        type: choice
        options: [resolve, workspace]
        default: resolve
  schedule:
    # The 1st, early, well away from the weekly spec refetch.
    - cron: "23 5 1 * *"

# `contents: write` and nothing else. This pushes a branch; it does not open a
# pull request, and the permission that would let it also lets a workflow
# approve one.
permissions:
  contents: write

jobs:
  regenerate:
    name: resolve the dependency tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # Both compile nothing, which is why this is one step and not a build.
      #
      # `resolve` is the monthly sweep: every dependency moves to the newest
      # version its requirement allows, and the pull request's own CI run says
      # whether that tree is any good.
      #
      # `workspace` is for a change that only moved this workspace's own
      # entries — a crate added, a dependency dropped from one of them. It is
      # what `cut-release.yml` already runs after a version bump, for the same
      # reason: a two-line edit should not have to drag every third-party pin
      # forward with it, and until this input existed there was no way to say
      # so.
      - name: Write the lockfile
        run: |
          if [ "${{ inputs.scope }}" = "workspace" ]; then
            cargo update --workspace
          else
            cargo generate-lockfile
          fi
      # It pushes a branch and hands back a link, rather than opening the
      # pull request itself.
      #
      # `peter-evans/create-pull-request` did open one, and failed every time:
      # "GitHub Actions is not permitted to create or approve pull requests."
      # The setting that would allow it also allows a workflow to **approve**
      # one, and this repository pins every `uses:` to a commit and keeps the
      # crates.io token in `release.yml` — granting that to fix a convenience
      # is the wrong trade. So the branch is the deliverable and a person opens
      # the pull request, which is one click and no new permission.
      #
      # What does not change is the part that matters: the resolution is not
      # trusted until CI has run on it, and CI runs when the pull request is
      # opened.
      - name: Push the branch and say where to open the pull request
        env:
          SCOPE: ${{ inputs.scope || 'resolve' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "The lockfile did not move at scope \`$SCOPE\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="lockfile/$SCOPE-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.lock
          git commit -m "build: resolve the dependency tree at scope $SCOPE"
          git push origin "$branch"

          {
            echo "## The lockfile moved"
            echo
            echo "Scope: \`$SCOPE\`. Branch: \`$branch\`."
            echo
            echo "**[Open the pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$branch?expand=1)**"
            echo
            echo "Nothing here is trusted until CI has run on it, and CI runs when that"
            echo "pull request is opened. A red run there is the point of this job rather"
            echo "than a fault in it."
            echo
            echo "**What this is for.** Nobody working on this project can build it — CI is"
            echo "the only place the code is ever compiled — so an unpinned tree means a"
            echo "pull request that touched nothing related can go red because a dependency"
            echo "published that morning, and its author has no way to reproduce it."
            echo
            echo "**Read the diff before merging.** At \`resolve\` this starts from scratch,"
            echo "so every dependency moves to the newest version its requirement allows. At"
            echo "\`workspace\` only this workspace's own entries move and every third-party"
            echo "pin stays where it was."
            echo
            echo '```'
            git diff --stat -- Cargo.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
