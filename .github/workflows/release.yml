name: Release

# Publishes to crates.io from CI, never from a developer's machine. Runs for a
# tag, so a release is always a deliberate act — either the tag push itself, or
# Cut a release dispatching this at the tag it has just pushed, which is what
# actually happens: a tag pushed by a workflow's own GITHUB_TOKEN starts no
# other workflow, by design.
#
# Needs a CARGO_REGISTRY_TOKEN repository secret with publish-new-crates and
# publish-update scopes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without publishing"
        type: boolean
        default: true

permissions:
  # The release note is written here, from CHANGELOG.md's own section.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # Restore, never save. Saving runs a prune of `target/` first, and that
      # prune walks into `target/package/<crate>-<version>/tests/target` and
      # `tests/trybuild` for every crate `cargo package` just wrote — paths
      # that do not exist, each annotated `##[error]`. Nothing fails, and a
      # release that published all seven crates reads as a release that broke,
      # which is worse than no cache at all. Nothing restores this cache
      # either: a release runs once per tag.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      # --workspace resolves the crates against each other rather than against
      # crates.io, which is the only way to package a crate whose dependency
      # has not been published yet, and publishes them in dependency order.
      # --locked publishes the tree CI checked rather than whatever resolves
      # this morning, which is the whole point of committing the lockfile.
      - name: Package every crate
        run: cargo package --locked --workspace --all-features

      # What a half-finished publish leaves, because a second run does not
      # repair it. crates.io's index is append-only: a version that went up
      # cannot be replaced, only yanked, and `cargo publish --workspace` that
      # fails on the fourth crate leaves the first three published. Re-running
      # this job then fails on the first of them rather than resuming.
      #
      # The way out is by hand, in this order: publish the remaining crates
      # individually with `cargo publish -p <crate> --locked`, in dependency
      # order, from the tag; then `gh release create` for the note, which is
      # its own step below and also refuses to run twice.
      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --workspace --all-features

      # The release note is the changelog's own section rather than a second
      # telling of it, because two accounts of one release drift and the
      # changelog is the one that says what an upgrade costs. No section for
      # this tag fails the step rather than publishing an empty note.
      #
      # The condition is "something was published", not "this was a tag push".
      # Cut a release dispatches this workflow rather than relying on its own
      # tag push to start it — a tag pushed with GITHUB_TOKEN starts nothing —
      # so keying the note on the event name published 0.0.3 to crates.io and
      # left GitHub with no release at all.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: github.event_name == 'push' || inputs.dry_run == false
        with:
          python-version: "3.13"
      - name: Write the release note from the changelog
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
