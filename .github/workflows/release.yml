name: Release

# Publishes to crates.io from CI, never from a developer's machine. Runs only
# when a tag is pushed, so a release is always a deliberate act.
#
# Needs a CARGO_REGISTRY_TOKEN repository secret with publish-new-crates and
# publish-update scopes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without publishing"
        type: boolean
        default: true

permissions:
  # The release note is written here, from CHANGELOG.md's own section.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # --workspace resolves the crates against each other rather than against
      # crates.io, which is the only way to package a crate whose dependency
      # has not been published yet, and publishes them in dependency order.
      - name: Package every crate
        run: cargo package --workspace --all-features

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --all-features

      # The release note is the changelog's own section rather than a second
      # telling of it, because two accounts of one release drift and the
      # changelog is the one that says what an upgrade costs. No section for
      # this tag fails the step rather than publishing an empty note.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: github.event_name == 'push'
        with:
          python-version: "3.13"
      - name: Write the release note from the changelog
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
