name: Spec drift

# Refetches each provider's API description and opens a pull request when it
# has moved. A red diff here is the early warning that an adapter is about to
# be wrong; nothing is applied automatically.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml openapi-spec-validator
      - name: Refetch the specs under today's date
        run: |
          set -euo pipefail
          python3 scripts/merge_iyzico.py
          python3 scripts/fetch_stripe.py
      - name: The refetched specs must still be valid
        run: python3 scripts/validate_specs.py --strict
      - name: Open a pull request if anything moved
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: spec-drift
          title: "specs: upstream API descriptions moved"
          commit-message: "specs: refetch provider API descriptions"
          body: |
            The scheduled refetch found a change in at least one provider's API
            description. Read the diff under `specs/` before merging: a changed
            operation or schema is a change the adapters may need.
          labels: specs
          delete-branch: true
