name: Spec drift

# Refetches each provider's API description and opens a pull request when it
# has moved. A red diff here is the early warning that an adapter is about to
# be wrong; nothing is applied automatically.
#
# A week where nothing moved leaves no diff and opens no pull request: the
# fetchers write a dated record on the day it says something new rather than on
# the day they ran. specs/README.md says why, and what was measured first.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml openapi-spec-validator
      - name: Refetch the specs under today's date
        run: |
          set -euo pipefail
          python3 scripts/merge_iyzico.py
          python3 scripts/fetch_stripe.py
          python3 scripts/fetch_paytr.py
          python3 scripts/fetch_paypal.py
      # Its own step, and allowed to fail on its own. Nothing of Mollie's is
      # committed, so this script is the only thing that validates their
      # document — and a document that does not validate must not become a meta
      # claiming it did. Failing here leaves specs/mollie/ untouched and still
      # opens the pull request for the other three, which is better than three
      # providers' drift going unreported because a fourth moved.
      - name: Refetch Mollie, which checks what it fetched
        id: mollie
        continue-on-error: true
        run: python3 scripts/fetch_mollie.py
      - name: The refetched specs must still be valid
        run: python3 scripts/validate_specs.py --strict
      - name: What the refetch changed about the fields the specs carry
        id: moved
        run: |
          {
            echo 'report<<REPORT'
            python3 scripts/compare_specs.py --against-git HEAD || true
            echo REPORT
          } >> "$GITHUB_OUTPUT"
      # It pushes a branch and hands back a link, rather than opening the
      # pull request itself.
      #
      # `peter-evans/create-pull-request` did open one, and failed every time
      # it ran: "GitHub Actions is not permitted to create or approve pull
      # requests." `lockfile.yml` met the same wall and says why the setting
      # that would allow it is the wrong trade — it also lets a workflow
      # **approve** one, in a repository that pins every `uses:` to a commit
      # and keeps the crates.io token in `release.yml`.
      #
      # The branch is dated rather than fixed. The old one was called
      # `spec-drift` and was force-pushed on every run, so a week's detection
      # that nobody had opened was overwritten by the next week's — and the
      # change was then re-dated to the day it was overwritten, which is the
      # one thing specs/README.md's dates are supposed to mean.
      - name: Push the branch and say where to open the pull request
        env:
          MOLLIE: ${{ steps.mollie.outcome }}
          REPORT: ${{ steps.moved.outputs.report }}
        run: |
          set -euo pipefail
          if git diff --quiet -- specs; then
            echo "No provider's description moved this week." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="spec-drift/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add specs
          git commit -m "specs: refetch provider API descriptions"
          git push origin "$branch"

          {
            echo "## Something moved"
            echo
            echo "Branch: \`$branch\`."
            echo
            echo "**[Open the pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$branch?expand=1)**"
            echo "— label it \`specs\`, and read the diff under \`specs/\` before merging."
            echo "A changed operation or schema is a change the adapters may need."
            echo
            echo "A **lost** field is the line to read first. It means either that the"
            echo "provider withdrew it, or that a fetcher dropped it — those look"
            echo "identical in the diff and only one of them is fine."
            echo
            echo "**Mollie's diff is one JSON file and no fields**, by design: their"
            echo "document is licensed so that no copy of it is kept here, so what moved"
            echo "is a version string or a hash. \`subset_sha256\` is the one to read — it"
            echo "moves only for the eight paths kasapay maps, where \`upstream_sha256\`"
            echo "moves for any of theirs. Fetch the document with"
            echo "\`python3 scripts/fetch_mollie.py --write-document\` to see what actually"
            echo "changed, to a path this repository does not track. \`specs/README.md\`"
            echo "says why."
            echo
            echo "Mollie's own check: **$MOLLIE**. A failure there means their document"
            echo "did not validate, \`specs/mollie/\` is unchanged on this branch, and the"
            echo "job log is where the reason is."
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
