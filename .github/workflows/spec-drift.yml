name: Spec drift

# Refetches each provider's API description and opens a pull request when it
# has moved. A red diff here is the early warning that an adapter is about to
# be wrong; nothing is applied automatically.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml openapi-spec-validator
      - name: Refetch the specs under today's date
        run: |
          set -euo pipefail
          python3 scripts/merge_iyzico.py
          python3 scripts/fetch_stripe.py
          python3 scripts/fetch_paytr.py
      # Its own step, and allowed to fail on its own. Nothing of Mollie's is
      # committed, so this script is the only thing that validates their
      # document — and a document that does not validate must not become a meta
      # claiming it did. Failing here leaves specs/mollie/ untouched and still
      # opens the pull request for the other three, which is better than three
      # providers' drift going unreported because a fourth moved.
      - name: Refetch Mollie, which checks what it fetched
        id: mollie
        continue-on-error: true
        run: python3 scripts/fetch_mollie.py
      - name: The refetched specs must still be valid
        run: python3 scripts/validate_specs.py --strict
      - name: What the refetch changed about the fields the specs carry
        id: moved
        run: |
          {
            echo 'report<<REPORT'
            python3 scripts/compare_specs.py --against-git HEAD || true
            echo REPORT
          } >> "$GITHUB_OUTPUT"
      - name: Open a pull request if anything moved
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: spec-drift
          title: "specs: upstream API descriptions moved"
          commit-message: "specs: refetch provider API descriptions"
          body: |
            The scheduled refetch found a change in at least one provider's API
            description. Read the diff under `specs/` before merging: a changed
            operation or schema is a change the adapters may need.

            A **lost** field is the line to read first. It means either that the
            provider withdrew it, or that `merge_iyzico.py` dropped it — those
            look identical in the diff and only one of them is fine.

            **Mollie's diff is one JSON file and no fields**, by design: their
            document is licensed so that no copy of it is kept here, so what
            moved is a version string or a hash. `subset_sha256` is the one to
            read — it moves only for the five paths kasapay maps, where
            `upstream_sha256` moves for any of their eighty-seven. Fetch the
            document with `python3 scripts/fetch_mollie.py --write-document` to
            see what actually changed. `specs/README.md` says why.

            Mollie's own check: **${{ steps.mollie.outcome }}**. A failure there
            means their document did not validate, `specs/mollie/` is unchanged
            in this pull request, and the job log is where the reason is.

            ```
            ${{ steps.moved.outputs.report }}
            ```
          labels: specs
          delete-branch: true
