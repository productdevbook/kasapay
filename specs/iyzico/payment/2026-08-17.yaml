              schema:
                $ref: '#/components/schemas/ItemActionResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse6'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/marketplace/approve.md
  /payment/iyzipos/item/disapprove:
    post:
      summary: Dissapprove
      description: To disapprove a product, the related paymentTransactionId must be provided in the request.
        The id (paymentTransactionId) of the disapproved payment transaction will be returned in the response.
      tags:
      - Marketplace
      parameters:
      - $ref: '#/components/parameters/AuthHeader2'
      - $ref: '#/components/parameters/ContentTypeHeader5'
