      - $ref: '#/components/parameters/ContentTypeHeader7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CFInitializeRequest'
      responses:
        '200':
          description: Başarılı yanıt (CF başlatıldı)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CFInitializeResponse'
        '400':
          description: Hatalı istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse12'
      x-iyzico-source: https://docs.iyzico.com/odeme-metotlari/odeme-formu/cf-entegrasyonu/cf-baslatma.md
  /payment/iyzipos/checkoutform/initialize/preauth/ecom:
    post:
      summary: Ödeme Formu (CF) Başlatma
      description: Ödeme formu (Checkout Form) oturumu başlatır ve ödeme sayfasını göstermek için `checkoutFormContent`
        / `paymentPageUrl` ve işleme ait `token` döner.
      tags:
