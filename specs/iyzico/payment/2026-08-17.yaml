      parameters:
      - $ref: '#/components/parameters/AuthHeader3'
      - $ref: '#/components/parameters/ContentTypeHeader3'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse3'
      x-iyzico-source: https://docs.iyzico.com/en/advanced/installment-and-bin-service.md
  /payment/iyzipos/item/approve:
    post:
      summary: Approve Item
      description: To approve an item, provide the split id (**paymentTransactionId**). The id is returned
        by the payment service.
      tags:
      - Marketplace
      parameters:
      - $ref: '#/components/parameters/AuthHeader2'
      - $ref: '#/components/parameters/ContentTypeHeader5'
      requestBody:
        required: true
        content:
          application/json:
            schema:
