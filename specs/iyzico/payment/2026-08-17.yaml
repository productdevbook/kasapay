  /payment/iyzipos/installment:
    post:
      summary: Installment Service Request
      description: The API provides installment counts, rates and amounts, as well as attributes such
        as issuing bank, card family and card scheme. It lists available installment options based on
        the given BIN and amount. You can also query installment rates with only the BIN or only the amount.
      tags:
