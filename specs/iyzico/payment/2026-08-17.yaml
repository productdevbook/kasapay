          description: Currency. Default; TRY (must match the value sent in INIT 3DS).
    ThreeDSV2PaymentResponse:
      type: object
      properties:
        status:
          type: string
          description: It reports the result of the transaction. If the response returns success, it means
            the payment has been completed successfully.
          enum:
          - success
          - failure
        locale:
          type: string
          enum:
          - tr
          - en
          description: Response language.
        systemTime:
          type: integer
          description: Timestamp (epoch ms).
        conversationId:
          type: string
          description: ID matching the request.
        price:
          type: string
          description: Basket total amount.
          format: decimal
        paidPrice:
          type: string
          description: Total charged amount.
          format: decimal
        installment:
          type: integer
          description: Installment count.
        paymentId:
          type: string
          description: Payment ID.
        fraudStatus:
          type: integer
          description: 'Payment status according to fraud filters.

            - 1: Approved

            - 0: Under review

            - -1: Declined

            '
          enum:
          - 0
          - -1
          - 1
        merchantCommissionRate:
          type: string
          description: Merchant’s installment/commission rate (informational).
          format: decimal
        merchantCommissionRateAmount:
          type: string
          description: Merchant’s installment/commission amount (informational).
          format: decimal
        iyziCommissionRateAmount:
          type: string
          description: iyzico commission amount.
          format: decimal
        iyziCommissionFee:
          type: string
          description: iyzico transaction fee.
          format: decimal
        cardType:
          type: string
          description: Card type.
        cardAssociation:
          type: string
          description: Card scheme/brand.
          enum:
          - VISA
          - MASTER_CARD
          - AMERICAN_EXPRESS
          - TROY
        cardFamily:
          type: string
          description: Card product/family.
        binNumber:
          type: string
          description: BIN (first 8 digits).
        lastFourDigits:
          type: string
          description: Last 4 digits of the card.
        basketId:
          type: string
          description: Basket ID.
        currency:
          type: string
          description: Currency of the payment.
        itemTransactions:
          type: array
          description: Line items per basket item.
          items:
            type: object
            properties:
              paymentTransactionId:
                type: string
                description: Line-item ID; must be stored by the merchant (used for refund/approve operations).
              itemId:
                type: string
                description: Merchant-defined item ID in the basket.
              price:
                type: string
                description: Item price on merchant side.
                format: decimal
              paidPrice:
                type: string
                description: Collected amount allocated to this line item.
                format: decimal
              transactionStatus:
                type: integer
                description: 'Line item status.

                  - 0: In fraud check

                  - -1: Declined after fraud check

                  - 1: Approved (Marketplace: Waiting for Merchant Approval)

                  - 2: Approved (Marketplace approval given)

                  '
                enum:
                - 0
                - -1
                - 1
                - 2
              blockageRate:
                type: string
                description: Merchant blockage rate at line level.
                format: decimal
              blockageRateAmountMerchant:
                type: string
                description: Blockage amount reflected to the merchant.
                format: decimal
              blockageResolvedDate:
                type: string
                description: Blockage release date (yyyy-MM-dd HH:mm:ss).
              iyziCommissionFee:
                type: string
                description: iyzico fee allocated to the line item.
                format: decimal
              iyziCommissionRateAmount:
                type: string
                description: iyzico commission allocated to the line item.
                format: decimal
              merchantCommissionRate:
                type: string
                description: Merchant’s commission rate allocated to the line item.
                format: decimal
              merchantCommissionRateAmount:
                type: string
                description: Merchant’s commission amount allocated to the line item.
                format: decimal
              merchantPayoutAmount:
                type: string
                description: Amount to be paid to the merchant after fees/blocks.
                format: decimal
              convertedPayout:
                type: object
                description: Post-conversion calculations per line item.
                properties:
                  paidPrice:
                    type: string
                    description: Collected amount allocated to this line item.
                    format: decimal
                  iyziCommissionFee:
                    type: string
                    description: iyzico fee allocated to the line item.
                    format: decimal
                  iyziCommissionRateAmount:
                    type: string
                    description: iyzico commission allocated to the line item.
                    format: decimal
                  blockageRateAmountMerchant:
                    type: string
                    description: Merchant-side blockage amount.
                    format: decimal
                  merchantPayoutAmount:
                    type: string
                    description: Amount to be paid to the merchant after fees/blocks.
                    format: decimal
                  iyziConversationRate:
                    type: string
                    description: Conversion rate.
                    format: decimal
                  iyziConversationRateAmount:
                    type: string
                    description: Converted amount produced by the rate.
                    format: decimal
        authCode:
          type: string
          description: Authorization code returned by the bank.
        phase:
          type: string
          description: Payment phase.
        mdStatus:
          type: integer
          description: '3DS authentication result.

            - 1: Successful

            - 0,2-8: Failed

            '
          enum:
          - -1
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
        hostReference:
          type: string
          description: Host reference returned by the bank/acquirer.
        signature:
          type: string
          description: Signature value that can be used for verification.
