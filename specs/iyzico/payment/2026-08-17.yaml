          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/ek-servisler/iptal-ve-iade.md
  /payment/detail:
    post:
      summary: Retrieve Payment Result
      description: Retrieves the result of a payment.
      tags:
      - Non3D Payment
      parameters:
      - $ref: '#/components/parameters/AuthHeader4'
      - $ref: '#/components/parameters/ContentTypeHeader3'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentId
              properties:
                locale:
                  type: string
                  description: Language code. Allowed values; tr, en. Default; tr
                  enum:
                  - tr
                  - en
                paymentId:
                  type: string
                  description: Payment transaction ID.
                paymentConversationId:
                  type: string
                  description: ConversationId of the payment transaction. Required if paymentId is not
                    sent.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseTwo'
        '400':
          description: Invalid request / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse5'
      x-iyzico-source: https://docs.iyzico.com/en/advanced/retrieve-payment.md
  /payment/item:
    put:
      summary: Submerchant Item/Price Update
      description: 'This service is used to modify the payout amount of the submerchant or update the
        submerchant information based on a single paymentTransaction

        '
      tags:
      - Marketplace
      parameters:
      - $ref: '#/components/parameters/AuthHeader2'
      - $ref: '#/components/parameters/ContentTypeHeader5'
      requestBody:
        required: true
