  /payment/postauth:
    post:
      tags:
      - Ön Provizyon
      summary: Provizyon Kapama (PostAuth)
      description: 'Başarılı şekilde ön provizyonu alınmış bir ödemeyi **satışa çevirir**.

        '
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader8'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAuthRequest'
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAuthResponse'
      x-iyzico-source: https://docs.iyzico.com/odeme-metotlari/on-provizyon/on-provizyon-entegrasyonu/provizyon-kapama.md
  /payment/preauth:
    post:
      summary: Create Non3D Payment
      description: 3D Secure olmadan ödeme başlatır.
      tags:
      - Non3D Payment
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paidPrice
              - price
              - currency
              - paymentCard
              - buyer
              - shippingAddress
              - billingAddress
              - basketItems
              properties:
                conversationId:
                  type: string
                  description: İstek/yanıt eşleştirmesi için benzersiz ID.
                locale:
                  type: string
                  description: Dil kodu. Alabileceği değerler; tr, en. Default; tr
                  enum:
                  - tr
                  - en
                paidPrice:
                  type: string
                  description: Kullanıcıdan tahsil edilecek toplam tutar.
                  format: decimal
                price:
                  type: string
                  description: Sepet toplam tutarı.
                  format: decimal
                paymentGroup:
                  type: string
                  description: Ödeme grubu. Default; PRODUCT.
                  enum:
                  - PRODUCT
                  - LISTING
                  - SUBSCRIPTION
                currency:
                  type: string
                  description: Para birimi. Default; TRY.
                  enum:
                  - TRY
                  - USD
                  - EUR
                  - GBP
                  - NOK
                  - CHF
                installment:
                  type: integer
                  description: Taksit sayısı. Gönderilmezse tek çekim (1) olarak işlem sağlanılabilir.
                  enum:
                  - 1
                  - 2
                  - 3
                  - 6
                  - 9
                  - 12
                basketId:
                  type: string
                  description: Sepet ID’si.
                paymentChannel:
                  type: string
                  description: Ödeme kanalı.
                  enum:
                  - WEB
                  - MOBILE
                  - MOBILE_WEB
                  - MOBILE_IOS
                  - MOBILE_ANDROID
                  - MOBILE_WINDOWS
                  - MOBILE_TABLET
                  - MOBILE_PHONE
                paymentCard:
                  description: Kart Bilgileri.
                  $ref: '#/components/schemas/PaymentCard'
                buyer:
                  description: Alıcı Bilgileri.
                  $ref: '#/components/schemas/Buyer2'
                shippingAddress:
                  description: Kargo Adresi. Sepetteki ürünlerden en az bir tanesinin, itemType "PHYSICAL"
                    olması durumunda gönderilmesi zorunludur. Tüm ürünler "VIRTUAL" olduğu taktirde gönderilmesi
                    gerekmez.
                  $ref: '#/components/schemas/Address3'
                billingAddress:
                  description: Fatura Adresi.
                  $ref: '#/components/schemas/Address3'
                basketItems:
                  type: array
                  description: Sepetteki ürünler.
                  items:
                    $ref: '#/components/schemas/BasketItem2'
                paymentSource:
                  type: string
                  description: Bu alan, partner firmalar tarafından iletilen ödeme kaynağı bilgisidir.
                    Eğer bir altyapı sağlayıcısıysanız ve iyzico ile entegrasyon/iş birliğiniz bulunuyorsa
                    bu parametreyi gönderebilirsiniz.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse2'
        '400':
          description: Hatalı istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse13'
      x-iyzico-source: https://docs.iyzico.com/odeme-metotlari/on-provizyon/on-provizyon-entegrasyonu/provizyon-baslatma/non3d.md
  /payment/refund:
    post:
      summary: İade
      description: 'Ödeme işleminin iadesi için kullanılır. İade işlemi **paymentTransactionId** üzerinden,
        ödeme kırılımı baz alınarak yapılır. Ödeme tutarı için **tamamen** ya da **kısmi** iade yapılabilir.

        '
      tags:
      - Ödeme
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPaymentResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/ek-servisler/iptal-ve-iade.md
  /payment/v2/3dsecure/auth:
    post:
      summary: Create 3DS v2 Payment
      description: After the verification step, both the v1 and the new-generation v2 endpoints can be
        used to finalize the payment. However, to align with more advanced and secure technologies, the
        use of the v2 endpoint is recommended.
      tags:
      - 3DS Payment
      parameters:
      - $ref: '#/components/parameters/AuthHeader5'
      - $ref: '#/components/parameters/ContentTypeHeader3'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDSV2AuthRequest'
      responses:
        '200':
          description: Successful response (payment completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDSV2PaymentResponse'
        '400':
          description: Invalid request / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse8'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/payment-methods/api-3ds.md
  /v2/payment/refund:
    post:
      summary: Refund V2
      description: 'Enables refunds over **paymentId**. No item breakdown is required; the system determines
        the basket item to refund. You can perform a **full** or **partial** refund for the payment amount.

        '
      tags:
      - Payment
      parameters:
      - $ref: '#/components/parameters/AuthHeader2'
      - $ref: '#/components/parameters/ContentTypeHeader4'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentV2Request'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPaymentV2Response'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/en/advanced/refund-and-cancel.md
components:
  parameters:
    AuthHeader:
      name: Authorization
      in: header
      required: true
      description: Authorization header, IYZWSv2 ile başlayan ve base64 formatında üretilmiş imzalı hash
        değeridir.
      schema:
        type: string
    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
      description: İstek içeriğinin formatı.
    AuthHeader2:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Authorization header; a signed hash value that starts with **IYZWSv2** and is generated
        in Base64 format.
    ContentTypeHeader2:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
      description: Media type of the request body.
    AuthHeader3:
      name: Authorization
      in: header
      required: true
      description: Authorization header that starts with IYZWSv2 and contains a Base64-encoded signed
        hash.
      schema:
        type: string
    ContentTypeHeader3:
      name: Content-Type
      in: header
      required: true
      description: Content-Type value.
      schema:
        type: string
    ContentTypeHeader4:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
      description: Content type of the request body.
    AuthHeader4:
      name: Authorization
      in: header
      required: true
      description: Authorization header starting with IYZWSv2 and a signed hash value encoded in base64.
