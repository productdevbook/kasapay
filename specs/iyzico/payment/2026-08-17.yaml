            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse11'
      x-iyzico-source: https://docs.iyzico.com/odeme-metotlari/on-provizyon/on-provizyon-entegrasyonu/provizyon-baslatma/3ds.md
  /payment/auth:
    post:
      summary: Crate Payment with Stored Card (NON3D)
      description: After card storage, you can send a “NON3D or 3DS” payment request using the returned
        `cardUserKey` and `cardToken`. Unlike a standard payment request, card details are sent via `cardUserKey`
        and `cardToken`. Suitable for one-click payments or subscription cycles. Example below shows NON3D.
      tags:
      - Card Storage
      parameters:
      - $ref: '#/components/parameters/AuthHeader2'
      - $ref: '#/components/parameters/ContentTypeHeader2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAuthSavedCardRequest'
      responses:
        '200':
          description: Successful response — payment captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAuthSuccessResponse'
        '400':
          description: Invalid request / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/en/advanced/card-storage.md
  /payment/bin/check:
    post:
      summary: BIN Service Request
      description: Retrieves card attributes in BIN inquiries such as issuing bank, card family, and card
        scheme. To obtain the desired information, simply include the required parameters in your request.
        The API will respond with comprehensive details.
      tags:
      - BIN
      parameters:
      - $ref: '#/components/parameters/AuthHeader3'
      - $ref: '#/components/parameters/ContentTypeHeader3'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BINCheckRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BINCheckResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse3'
      x-iyzico-source: https://docs.iyzico.com/en/advanced/installment-and-bin-service.md
  /payment/cancel:
    post:
      summary: İptal
      description: Ödeme işlemini iptal etmek için kullanılır.
      tags:
      - Ödeme
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
