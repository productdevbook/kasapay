              type: integer
              description: Trial start time (epoch ms).
            trialEndDate:
              type: integer
              description: Trial end time (epoch ms).
            createdDate:
              type: integer
              description: Creation time (epoch ms).
            startDate:
              type: integer
              description: Start time (epoch ms).
            endDate:
              type: integer
              description: End time (epoch ms).
    SubscriptionBillingAddress:
      type: object
