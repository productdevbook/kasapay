      type: object
      properties:
        subscriptionReferenceCode:
          type: string
          description: Reference code of the subscription that was started as pending.
    ActivateSubscriptionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - failure
          description: Indicates the result of the request. Returns `success` if the operation succeeds.
        systemTime:
          type: integer
          description: Unix timestamp (milliseconds) of the response.
    CancelSubscriptionRequest:
