openapi: 3.0.3
info:
  title: iyzico — subscription
  version: unversioned
  description: Reassembled from the per-endpoint fragments embedded in https://docs.iyzico.com/. iyzico
    publishes no OpenAPI file; this is a record of what was documented, not a contract they offer.
servers:
- url: https://api.iyzipay.com
  description: Production
- url: https://sandbox-api.iyzipay.com
  description: Sandbox
tags:
- name: Subscription
  description: Subscription operations
- name: Subscription Product
  description: Subscription product management services.
paths:
  /v2/subscription/card-update/checkoutform/initialize:
    post:
      summary: Subscription Card Update (Checkout Form)
      description: 'Updates the credit card used in a subscription. In cases like payment failure or card
        expiry, merchants can prompt customers to update their card. **The update can only be performed
        through the iyzico Checkout Form.**

        A **₺1** validation charge is taken and immediately refunded to validate the updated card.

        '
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeCardUpdateCheckoutFormRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeCardUpdateCheckoutFormResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse6'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/subscription-transactions.md
  /v2/subscription/checkoutform/initialize:
    post:
      summary: Initialize Subscription (iyzico Checkout Form)
      description: Used to start a subscription with iyzico Checkout Form. Returns the form content and
        token.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSubscriptionCheckoutFormInitializeRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSubscriptionCheckoutFormInitializeResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/initialize-subscription.md
  /v2/subscription/checkoutform/{token}:
    get:
      summary: Retrieve Checkout Form Result
      description: After the checkout form flow completes, query the subscription creation result with
        the returned token.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Token returned by checkout form initialize for this operation.
      - name: conversationId
        in: query
        required: false
        schema:
          type: string
        description: Optional correlation value you send in the request to match with the response.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSubscriptionCheckoutFormResultResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/initialize-subscription.md
  /v2/subscription/customers:
    get:
      summary: List Subscribers
      description: List all subscribers with basic details.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number to fetch.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        description: Number of subscribers per page.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse3'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscriber-transactions.md
  /v2/subscription/customers/{customerReferenceCode}:
    post:
      summary: Update Subscriber
      description: 'Update all details of a subscriber via API. Provide the subscriber''s **customerReferenceCode**
        as a path parameter and include the fields to be updated in the request body. At least **one field**
        in the body is required; only the provided fields will be updated.

        '
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: customerReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Subscriber reference code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUpdateResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse3'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscriber-transactions.md
    get:
      summary: Subscriber Detail
      description: Retrieve all details of a subscriber by its reference code.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: customerReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Subscriber reference code.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse3'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscriber-transactions.md
  /v2/subscription/initialize:
    post:
      summary: Initialize Subscription (NON3D)
      description: Start a subscription without the hosted checkout form, using your own payment form
        via NON3D service.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSubscriptionNon3DRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSubscriptionNon3DResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/initialize-subscription.md
  /v2/subscription/initialize/with-customer:
    post:
      summary: Initialize Subscription (Existing Customer)
      description: 'If the user already has an active subscription, you can start a new one with customerReferenceCode.
        If the user does not have an active subscription, no new subscription is started with customerReferenceCode.

        '
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSubscriptionWithCustomerRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSubscriptionWithCustomerResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/initialize-subscription.md
  /v2/subscription/operation/retry:
    post:
      summary: Retry Subscription Payment
      description: 'If a recurring payment fails for a subscription, use this service to retry the charge
        and collect the payment.

        '
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrySubscriptionPaymentRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrySubscriptionPaymentResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse6'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/subscription-transactions.md
  /v2/subscription/pricing-plans/{pricingPlanReferenceCode}:
    post:
      summary: Update Pricing Plan
      description: 'This method allows updating **only** the **name** and **trialPeriodDays** fields.   The
        plan''s reference code must be provided as a path parameter.   Updates can be performed via API
        or the iyzico merchant panel. Active subscriptions are not affected.

        '
      tags:
      - Pricing Plan
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: pricingPlanReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Reference code of the pricing plan to be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePricingPlanRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePricingPlanResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/pricing-plan.md
    delete:
      summary: Delete Pricing Plan
      description: Deletes the specified pricing plan by reference code. Plans with active subscriptions
        or pending updates cannot be deleted.
      tags:
      - Pricing Plan
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: pricingPlanReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Reference code of the pricing plan to delete.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePricingPlanResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/pricing-plan.md
    get:
      summary: Get Pricing Plan Detail
      description: Returns details of a pricing plan. Merchants can see all details both in the merchant
        panel and via API.
      tags:
      - Pricing Plan
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: pricingPlanReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Pricing plan reference code.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingPlanDetailResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/pricing-plan.md
  /v2/subscription/products:
    post:
      summary: Create Product
      operationId: createSubscriptionProduct
      description: Creates a new subscription product. The Subscription API charges on a recurring basis
        according to pricing plans, and each plan is linked to at least one product. There is no limit
        on the number of products; a product can be created by providing only a name.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionProductCreateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductCreateSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/product.md
    get:
      summary: List Products
      operationId: listSubscriptionProducts
      description: Lists subscription products. Use this to fetch all products and their linked plans.
        To reduce latency and payload size, pagination is used so you can retrieve the product list page
        by page.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionProductListRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductListSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/product.md
  /v2/subscription/products/{productReferenceCode}:
    post:
      summary: Update Product
      operationId: updateSubscriptionProduct
      description: Updates a subscription product. Product name and description can be edited via API
        or the iyzico merchant panel. Use the product’s unique reference code for API updates.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Unique reference code of the product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionProductUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductGetSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/product.md
    delete:
      summary: Delete Product
      operationId: deleteSubscriptionProduct
      description: Deletes a subscription product. Products can be deleted via API or the iyzico merchant
        panel only when there are no plans linked to the product.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Unique reference code of the product.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductDeleteSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/product.md
    get:
      summary: Get Product
      operationId: getSubscriptionProduct
      description: Retrieves details of a single product. Provide the product reference code in the request.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Unique reference code of the product.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductGetSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/product.md
  /v2/subscription/products/{productReferenceCode}/pricing-plans:
    post:
      summary: Create Pricing Plan
      description: Creates a new pricing plan for a specific product.
      tags:
      - Pricing Plan
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Reference code of the product the plan will be attached to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePricingPlanRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePricingPlanResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/pricing-plan.md
    get:
      summary: List Pricing Plans
      description: Lists all pricing plans for a given product. The response is paginated.
      tags:
      - Pricing Plan
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Product reference code.
      - name: page
        in: query
        schema:
          type: integer
        description: Page number to list.
      - name: count
        in: query
        schema:
          type: integer
        description: Number of records per page.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPricingPlanResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/pricing-plan.md
  /v2/subscription/subscriptions:
    get:
      summary: Search Subscriptions
      description: 'Retrieve subscription and payment details by filtering with various parameters, or
        without any parameters. For example, by sending only **subscriptionStatus**, you can list subscriptions
        with that status.

        '
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: subscriptionReferenceCode
        in: path
        required: false
        schema:
          type: string
        description: Reference code of the subscription to query.
      - name: customerReferenceCode
        in: path
        required: false
        schema:
          type: string
        description: Customer reference code.
      - name: pricingPlanReferenceCode
        in: path
        required: false
        schema:
          type: string
        description: Reference code of the pricing plan used in the subscription.
      - name: parent
        in: path
        required: false
        schema:
          type: string
        description: Parent reference code used for matching in subscription updates.
      - name: subscriptionStatus
        in: path
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - UNPAID
          - UPGRADED
          - CANCELED
          - EXPIRED
        description: Subscription status filter.
      - name: startDate
        in: path
        required: false
        schema:
          type: integer
        description: Subscription start date.
      - name: endDate
        in: path
        required: false
        schema:
          type: integer
        description: Subscription end date (epoch ms).
      - name: page
        in: path
        required: false
        schema:
          type: integer
        description: Page number.
      - name: count
        in: path
        required: false
        schema:
          type: integer
        description: Number of records per page.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSubscriptionsResponse'
        '404':
          description: Example response for a wrong endpoint (e.g., typo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/subscription-transactions.md
  /v2/subscription/subscriptions/{subscriptionReferenceCode}:
    get:
      summary: Get Subscription Detail
      description: Returns full details of a subscription by its reference code.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: subscriptionReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Reference code of the subscription to query.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSubscriptionDetailOptionalRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionDetailResponse'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/subscription-transactions.md
  /v2/subscription/subscriptions/{subscriptionReferenceCode}/activate:
    post:
      summary: Activate Subscription
      description: A subscription that was started as pending can be activated via this service.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: subscriptionReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Reference code of the subscription that was started as pending.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateSubscriptionRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateSubscriptionResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse5'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/subscription-transactions.md
  /v2/subscription/subscriptions/{subscriptionReferenceCode}/cancel:
    post:
      summary: Cancel Subscription
      description: Cancels an active subscription.
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: subscriptionReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Reference code of the subscription to cancel.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse6'
      x-iyzico-source: https://docs.iyzico.com/en/getting-started/preliminaries/api-reference-beta/subscription/subscription/subscription-transactions.md
  /v2/subscription/subscriptions/{subscriptionReferenceCode}/upgrade:
    post:
      summary: Upgrade Subscription
      description: 'You can change or upgrade the plan during the subscription, provided that the **new
        plan belongs to the same product** and the billing interval (**paymentInterval** and **paymentIntervalCount**)
        remains the same. Use this service for price changes.

        '
      tags:
      - Subscription
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: subscriptionReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Reference code of the subscription to upgrade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeSubscriptionRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeSubscriptionResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse6'
