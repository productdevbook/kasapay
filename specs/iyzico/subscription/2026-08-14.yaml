        zipCode:
          type: string
          description: ZIP/Postal code.
        contactName:
          type: string
          description: Contact person.
        city:
          type: string
          description: City.
        country:
          type: string
          description: Country.
    SubscriptionCustomer:
      description: Buyer information.
      type: object
      required:
      - name
      - surname
      - email
      - gsmNumber
      - identityNumber
      - billingAddress
      properties:
        name:
          type: string
          description: First name.
        surname:
          type: string
          description: Last name.
        email:
          type: string
          description: Email address.
        gsmNumber:
          type: string
          description: GSM number. Prefer E.164 when possible (e.g., +905555555555).
        identityNumber:
          type: string
          description: National ID (string).
        billingAddress:
          $ref: '#/components/schemas/SubscriptionBillingAddress'
        shippingAddress:
          $ref: '#/components/schemas/SubscriptionShippingAddress'
    SubscriptionDetailItem:
      type: object
      properties:
        referenceCode:
          type: string
          description: Subscription reference code.
        parentReferenceCode:
          type: string
          description: Reference used by the merchant to correlate subscription updates.
        pricingPlanName:
          type: string
          description: Name of the pricing plan linked to the subscription.
        pricingPlanReferenceCode:
          type: string
          description: Reference code of the pricing plan linked to the subscription.
        productName:
          type: string
          description: Product name.
        productReferenceCode:
          type: string
          description: Product reference code.
        customerEmail:
          type: string
          description: Customer email address.
        customerGsmNumber:
          type: string
          description: Customer GSM number.
        customerReferenceCode:
          type: string
          description: Customer reference code.
        subscriptionStatus:
          type: string
          description: 'Subscription status.


            Values:

            - **ACTIVE**: Subscription is active and payments are being collected regularly.

            - **PENDING**: Subscription is paused.

            - **UNPAID**: Payment could not be collected during the subscription.

            - **UPGRADED**: Subscription has been updated to another plan.

            - **CANCELED**: Subscription is canceled.

            - **EXPIRED**: Subscription period ended; no further charges are attempted.

            '
          enum:
          - ACTIVE
          - PENDING
          - UNPAID
          - UPGRADED
          - CANCELED
          - EXPIRED
        trialDays:
          type: integer
          description: Trial period (days) of the pricing plan.
        trialStartDate:
          type: integer
          description: Trial start time (epoch ms).
        trialEndDate:
          type: integer
          description: Trial end time (epoch ms).
        createdDate:
          type: integer
          description: Subscription creation time (epoch ms).
        startDate:
          type: integer
          description: Subscription start time (epoch ms).
        endDate:
          type: integer
          description: Subscription end time (epoch ms).
        orders:
          type: array
          description: List of periods (orders) within the subscription.
          items:
            $ref: '#/components/schemas/SubscriptionOrder'
    SubscriptionOrder:
      type: object
      properties:
        referenceCode:
          type: string
