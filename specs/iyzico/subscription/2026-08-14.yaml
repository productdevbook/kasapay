              - USD
              - EUR
              description: Currency code.
            paymentInterval:
              type: string
              enum:
              - DAILY
              - WEEKLY
              - MONTHLY
              - YEARLY
              description: Billing interval.
            paymentIntervalCount:
              type: integer
              description: Interval multiplier.
            planPaymentType:
              type: string
              enum:
              - RECURRING
              description: Subscription type.
            recurrenceCount:
              type: integer
              description: Number of repeats.
            trialPeriodDays:
              type: integer
              description: Trial period (days).
            status:
              type: string
              enum:
              - ACTIVE
              description: Plan status.
