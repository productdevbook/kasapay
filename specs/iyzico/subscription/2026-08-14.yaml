      properties:
        upgradePeriod:
          type: string
          enum:
          - NOW
          - NEXT_PERIOD
          description: 'When the upgrade will take effect.

            Values:

            - **NOW**: Apply the change immediately.

            - **NEXT_PERIOD**: Apply the change at the next billing period.

            '
        newPricingPlanReferenceCode:
          type: string
