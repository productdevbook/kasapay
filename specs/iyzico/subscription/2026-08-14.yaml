        useTrial:
          type: boolean
          description: If **true**, includes the trial period of the upgraded plan.
        resetRecurrenceCount:
          type: boolean
          description: "- **true**: Recalculates the subscription end date according to the new plan’s\
            \ **recurrenceCount**.  \n- **false**: Keeps the current plan’s end date and transfers it\
            \ to the new plan.\n"
