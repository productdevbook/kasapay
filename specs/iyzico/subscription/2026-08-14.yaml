          - success
          - failure
          description: Result of the request. Returns **success** if the operation is successful.
        systemTime:
          type: integer
          description: Server time of the response (epoch ms).
    CreatePricingPlanRequest:
      type: object
      required:
      - name
      - price
      - currencyCode
      - paymentInterval
      - planPaymentType
      properties:
        name:
          type: string
          description: Pricing plan name.
        price:
          type: string
          description: Amount to charge on each billing period.
          format: decimal
        currencyCode:
          type: string
          enum:
          - TRY
          - USD
          - EUR
          description: Currency. (For foreign currency, only non-TRY cards are allowed.)
        paymentInterval:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
          description: Recurrence interval for the subscription charge.
        planPaymentType:
          type: string
          enum:
          - RECURRING
          description: Subscription type.
        paymentIntervalCount:
          type: integer
          description: Frequency multiplier for the interval. For example, if you set a weekly plan and
            send **2**, the charge occurs every 2 weeks.
        recurrenceCount:
          type: integer
          description: Total number of repeats (e.g., **12** → 12 months). If omitted, it continues until
            the subscription is canceled.
        trialPeriodDays:
          type: integer
          description: Free trial length in days. If provided, the first charge happens after this period.
        locale:
          type: string
          enum:
          - tr
          - en
          description: Language of the response and error messages.
        conversationId:
          type: string
          description: Custom identifier for request tracking.
    CreatePricingPlanResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - failure
          description: Result of the operation.
        systemTime:
          type: integer
          description: Operation time (epoch ms).
        data:
          type: object
          properties:
            referenceCode:
              type: string
              description: Reference code of the created plan.
            createdDate:
              type: integer
              description: Plan creation time (epoch ms).
            name:
              type: string
              description: Plan name.
            productReferenceCode:
              type: string
              description: Product reference code.
            price:
              type: string
              description: Subscription price.
              format: decimal
            currencyCode:
              type: string
              enum:
