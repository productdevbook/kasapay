                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/urunler/paypos-app2app/app2app-entegrasyonu/iptal-iade.md
  /v1/softpos/init_sale_transaction:
    post:
      summary: Satış Başlatma – init_sale_transaction
      tags:
      - SoftPOS
      parameters:
      - name: Session-Key
        in: header
        required: true
        description: Mobil oturum anahtarı
        schema:
          type: string
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitSaleRequest'
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitSaleResponse'
        '400':
