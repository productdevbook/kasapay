components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    SecretKeyAuth:
      type: apiKey
      in: header
      name: x-secret-key
    MerchantIdAuth:
      type: apiKey
      in: header
      name: x-merchant-id
  schemas:
    AuthRequest:
      type: object
      required:
      - agent_id
      - user_id
      properties:
        agent_id:
          type: string
          description: Bayi Id.
        user_id:
          type: string
          description: Kullanıcı Id.
    AuthResponse:
      type: object
      properties:
        session_key:
          type: string
          description: Mobil oturum anahtarı.
        expired_date:
          type: string
          description: Geçerlilik tarihi.
        agent_id:
          type: string
          description: Bayi Id.
        company_code:
          type: string
          description: Ana firma Id.
        user_id:
          type: string
          description: Kullanıcı Id.
        user_unique_id:
          type: string
          description: Kullanıcı unique Id.
        is_okc_inquiry:
          type: boolean
          description: ÖKC muafiyet sonucu.
        object_name:
          type: string
          description: Obje türü.
        code:
          type: integer
          description: Sonuç kodu.
        message:
          type: string
          description: Sonuç mesajı.
    CheckTransactionRequest:
      type: object
      required:
      - payment_session_id
      properties:
        payment_session_id:
          type: string
    CheckTransactionResponse:
      type: object
      properties:
        Data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        object_name:
          type: string
        code:
          type: integer
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        object_name:
          type: string
          description: Obje türü.
        code:
          type: integer
          description: Sonuç kodu.
        message:
          type: string
          description: Sonuç mesajı.
    InitReversalRequest:
      type: object
      required:
      - xact_id
      properties:
        xact_id:
          type: string
          description: İşlemin Id'sinin şifrelenmiş hali.
        reference_no:
          type: string
          description: Referans numarası.
        callback_url:
          type: string
          description: Deeplink ile mobil uygulamaya geri dönülecek adres.
          nullable: true
    InitReversalResponse:
      type: object
      properties:
        payment_session_id:
          type: string
          description: Payment Session Id.
        deeplink_url:
          type: string
          description: Deeplink adresi.
        encryption_key:
          type: string
          description: Şifreleme anahtarı.
        object_name:
          type: string
          description: Obje türü.
        code:
          type: integer
          description: Sonuç kodu.
        message:
          type: string
          description: Sonuç mesajı.
    InitSaleRequest:
      type: object
      properties:
        amount:
          type: number
          description: Tutar.
        add_commission:
          type: boolean
          description: Komisyon eklensin mi?
        instalment:
          type: integer
          description: Taksit.
        card_holder_phone:
          type: string
          description: Kart sahibinin telefon numarası.
        card_holder_mail:
          type: string
          description: Kart sahibinin e-posta adresi.
        description:
          type: string
          description: Açıklama.
        reference_no:
          type: string
          description: Referans numarası.
        selected_agent_id:
          type: string
          description: Seçilen Bayi Id'si
        callback_url:
          type: string
          description: Deeplink ile mobil uygulamaya geri dönülecek adres.
    InitSaleResponse:
      type: object
      properties:
        payment_session_id:
          type: string
          description: Payment Session Id.
        deeplink_url:
          type: string
          description: Deeplink adresi.
        encryption_key:
          type: string
          description: Şifreleme anahtarı.
        object_name:
          type: string
          description: Obje türü.
        code:
          type: integer
          description: Sonuç kodu.
        message:
          type: string
          description: Sonuç mesajı.
    Transaction:
      type: object
      properties:
        xact_id:
          type: string
          description: İşlemin Id'sinin şifrelenmiş hali.
        xact_date:
          type: string
          description: İşlem tarihi.
        transaction_type:
          type: integer
          description: İşlem tipi.
        pos_type:
          type: integer
          description: POS tipi.
        agent_id:
          type: string
          description: Bayi Id.
        is_tds:
          type: boolean
          description: TDS uygulanıyor mu?
        bank_id:
          type: string
          description: Banka kodu.
        instalment:
          type: integer
          description: Taksit sayısı.
        card_no:
          type: string
          description: Kart numarası.
        card_holder:
          type: string
          description: Kart sahibi adı.
        card_type:
          type: string
          description: Kart türü.
        ratio:
          type: number
          description: Komisyon oranı.
        amount:
          type: number
          description: İşlem tutarı.
        netAmount:
          type: number
          description: Net tutar.
        comission:
          type: number
          description: Komisyon tutarı.
        comission_tax:
          type: number
          description: Komisyon vergisi.
        currency:
          type: string
          description: Para birimi.
        authorization_code:
          type: string
          description: Onay kodu.
        reference_code:
          type: string
          description: Referans kodu.
        order_id:
          type: string
          description: Sipariş numarası.
        is_succeed:
          type: boolean
          description: İşlem başarılı mı?.
        xact_transaction_id:
          type: string
          description: İşlem (transaction) ID’si.
        email:
          type: string
          description: E-posta.
        phone:
          type: string
          description: Telefon Numarası.
        note:
          type: string
          description: Not.
        agent_reference:
          type: string
          description: Bayi referans kodu.
        object_name:
          type: string
          description: Obje türü.
        code:
          type: integer
          description: Sonuç kodu.
        message:
          type: string
          description: Sonuç mesajı.
