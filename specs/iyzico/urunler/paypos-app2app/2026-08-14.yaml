        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/urunler/paypos-app2app/app2app-entegrasyonu/odeme-sorgulama.md
  /v1/softpos/init_reversal_transaction:
    post:
      summary: İptal / İade Başlatma
      tags:
      - SoftPOS
      parameters:
      - name: Session-Key
        in: header
        required: true
        description: Mobil oturum anahtarı.
        schema:
          type: string
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitReversalRequest'
      responses:
        '200':
          content:
            application/json:
