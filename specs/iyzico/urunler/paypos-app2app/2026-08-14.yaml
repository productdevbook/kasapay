- name: SoftPOS
paths:
  /v1/agent/get_auth_key:
    post:
      summary: Authorize – get_auth_key
      description: 'Mobil oturum anahtarı (session_key) üretir.

        Sadece Paynet tarafından IP tanımı yapılmış sunucular bu servisi çağırabilir.

        '
      tags:
      - Authorize
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/PaynetMobileHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Hatalı istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/urunler/paypos-app2app/app2app-entegrasyonu/session-olusturma.md
  /v1/agent/logout:
    post:
      summary: Logout
      tags:
      - Agent
      parameters:
      - $ref: '#/components/parameters/AuthorizationHeader'
      - $ref: '#/components/parameters/PaynetMobileHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_key:
                  type: string
                  description: Oturum anahtarı.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  object_name:
                    type: string
                    description: Obje türü.
                  code:
                    type: integer
                    description: Sonuç kodu.
                  message:
                    type: string
                    description: Sonuç mesajı.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/urunler/paypos-app2app/app2app-entegrasyonu/session-iptali.md
  /v1/softpos/check_transaction:
    post:
      summary: Durum Sorgulama – check_transaction
      tags:
      - SoftPOS
      parameters:
      - name: Session-Key
        in: header
        required: true
        description: Mobil oturum anahtarı
        schema:
          type: string
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
