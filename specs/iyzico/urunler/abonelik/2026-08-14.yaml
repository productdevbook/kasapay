              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-islemleri.md
  /v2/subscription/initialize/with-customer:
    post:
      summary: Abonelik Başlatma (Existing Customer)
      description: 'Abonelik başlatılmak istenen kullanıcının hali hazırda aktif bir aboneliği bulunuyorsa,
        customerReferenceCode ile yeni bir abonelik başlatılabilir. Eğer kullanıcının aktif bir aboneliği
        bulunmuyorsa custormerReferenceCode ile yeni bir abonelik başlatılmamaktadır.

        '
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSubscriptionWithCustomerRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSubscriptionWithCustomerResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-islemleri.md
  /v2/subscription/operation/retry:
    post:
      summary: Abonelik Ödeme Tekrarlama
      description: 'Eğer bir abonelikte, tekrarlayan ödemeler sırasında bir ödeme başarısız olduysa, işlemi
        tekrar denemek ve ödemeyi almak için retry servisi kullanılır.

