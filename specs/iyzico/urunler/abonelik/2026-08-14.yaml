      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrySubscriptionPaymentRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrySubscriptionPaymentResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse3'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-islemleri.md
  /v2/subscription/pricing-plans/{pricingPlanReferenceCode}:
    post:
      summary: Ödeme Planı Güncelleme
      description: 'Bu metod sadece **name** ve **trialPeriodDays** parametrelerinin güncellenmesine izin
        verir. Güncelleme için planın referans kodu path parametresi olarak gönderilmelidir. Güncellemenin
        hem API hem de iyzico merchant paneli üzerinden yapılması mümkündür. Aktif abonelikler ektilenmez.

        '
      tags:
      - Ödeme Planı
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: pricingPlanReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Güncellenecek ödeme planının referans kodu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePricingPlanRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePricingPlanResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse5'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/odeme-plani.md
    get:
      summary: Ödeme Planı Detayı Alma
      description: Bir ödeme planının detaylarını getirir. Üye işyerleri bir planın tüm detaylarını hem
        merchant panelinden hem de API istekleri üzerinden görebilir.
      tags:
      - Ödeme Planı
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: pricingPlanReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Ödeme planının referans kodu.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingPlanDetailResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse5'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/odeme-plani.md
    delete:
      summary: Ödeme Planı Silme
      description: Ödeme planı referans kodu kullanılarak, belirtilen ödeme planını siler. Üzerinde aktif
        abonelik bulunan veya güncelleme (update) kaydı olan ödeme planları silinemez.
      tags:
      - Ödeme Planı
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: pricingPlanReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Silinecek ödeme planının referans kodu.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePricingPlanResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse5'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/odeme-plani.md
  /v2/subscription/products:
    post:
      summary: Ürün Oluşturma
      operationId: createSubscriptionProduct
      description: Yeni bir abonelik ürünü oluşturur. Subscription API ödeme planlarına göre tekrarlı
        ödeme alır ve her ödeme planı en az bir ürüne bağlıdır. Ürün sayısında herhangi bir sınırlama
        yoktur ve sadece isim bilgisi gönderilerek bir ürün oluşturulabilir.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionProductCreateRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductCreateSuccess'
        '400':
          description: Hatalı istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-urunu.md
    get:
      summary: Ürün Listeleme
      operationId: listSubscriptionProducts
      description: Abonelik ürünlerini listeler. Ürün listeleme tüm ürünlere ve ürünlere bağlı planlara
        ulaşmak için kullanılır. Cevap süresini kısaltmak ve cevap boyutunu kısaltmak için sayfalama metodu
        kullanulmıştır. Bu sayede ürün listesini sayfa sayfa hızlıca alabilirsiniz.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionProductListRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductListSuccess'
        '400':
          description: Hatalı istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-urunu.md
  /v2/subscription/products/{productReferenceCode}:
    post:
      summary: Ürün Güncelleme
      operationId: updateSubscriptionProduct
      description: Abonelik ürününü günceller. Bir ürünün isim ve açıklama bilgileri hem API hem de iyzico
        merchant paneli üzerinden düzenlenebilir. API üzerinden bu işlemi yapabilmek için, ürüne ait eşsiz
        referans kodu kullanılmalıdır.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Ürüne ait eşsiz referans kodu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionProductUpdateRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductGetSuccess'
        '400':
          description: Hatalı istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-urunu.md
    delete:
      summary: Ürün Silme
      operationId: deleteSubscriptionProduct
      description: Abonelik ürününü siler. Ürünler kendilerine bağlı herhangi bir plan olmadıkça hem API
        hem de iyzico merchant panel üzerinden silinebilir.
      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Ürüne ait eşsiz referans kodu.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductDeleteSuccess'
        '400':
          description: Hatalı istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-urunu.md
    get:
      summary: Ürün Detayı
      operationId: getSubscriptionProduct
      description: Bir ürünün detaylarına API isteği ile ulaşılabilir. Bunun için gönderilen istekte ürün
