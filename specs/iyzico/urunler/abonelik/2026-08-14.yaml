      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - failure
          description: Yapılan isteğin sonucunu belirtir. İşlem başarılı ise success değeri döner.
        systemTime:
          type: integer
          description: Dönen sonucun o anki unix timestamp değeridir.
    CancelSubscriptionRequest:
      type: object
      properties:
        subscriptionReferenceCode:
          type: string
          description: Abonelik referans kodu. Opsiyonel olarak body de gönderilebilir.
