  /v2/subscription/subscriptions:
    get:
      summary: Abonelik Arama
      description: 'Farklı parametrelerle filtreleme yaparak veya herhangi bir parametre kullanmadan sorgulama
        yaparak abonelik ve ödeme bilgilerinin detaylarına ulaşmayı sağlar. Örneğin sadece **subscriptionStatus**
        göndererek, belirtilen statüdeki abonelikleri listeleyebilirsiniz.

        '
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: subscriptionReferenceCode
        in: path
        required: false
        schema:
          type: string
        description: Sorgulanacak aboneliğe ait referans kodu.
      - name: customerReferenceCode
        in: path
        required: false
        schema:
          type: string
        description: Müşteri referans kodu.
      - name: pricingPlanReferenceCode
        in: path
        required: false
        schema:
          type: string
        description: Abonelikte kullanılan ödeme planına ait referans kodu.
      - name: parent
        in: path
        required: false
        schema:
          type: string
        description: Abonelik güncellemelerinde eşleştirme için kullanılan üst (parent) referans kodu.
      - name: subscriptionStatus
        in: path
        required: false
        schema:
          type: string
          enum:
