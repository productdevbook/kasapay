      tags:
      - Subscription Product
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: productReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Ürüne ait eşsiz referans kodu.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionProductGetSuccess'
        '400':
          description: Hatalı istek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse4'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-urunu.md
