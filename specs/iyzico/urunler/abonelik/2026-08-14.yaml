      type: object
      required:
      - name
      - price
      - currencyCode
      - paymentInterval
      - planPaymentType
      properties:
        name:
          type: string
          description: Plan adı.
        price:
          type: decimal
          description: Ödeme periyotlarında karttan çekilecek tutar.
        currencyCode:
          type: string
          enum:
          - TRY
          - USD
          - EUR
          description: Para birimi. (Yabancı para biriminde sadece yabancı kart kullanılabilir.)
        paymentInterval:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
          description: Tekrarlı ödemenin alınacağı periyot.
        planPaymentType:
          type: string
          enum:
          - RECURRING
          description: Abonelik tipi.
        paymentIntervalCount:
          type: integer
          description: Ödeme periodunun hangi sıklıkta olacağını belirler. Örneğin haftalık bir ödeme
            planı için 2 gönderilirse, ödemeler 2 haftada bir alınır.
        recurrenceCount:
          type: integer
          description: Kaç kez tekrarlanacağını belirtir (ör. 12 => 12 ay). Gönderilmezse abonelik iptal
            edilene kadar devam eder.
        trialPeriodDays:
          type: integer
          description: Gün bazında deneme/ücretsiz kullanım süresi. Gönderilirse ilk ödeme bu sürenin
            sonunda alınır.
