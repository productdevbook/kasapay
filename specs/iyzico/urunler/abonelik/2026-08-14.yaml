tags:
- name: Subscription Product
  description: Abonelik ürün yönetimi servisleri.
paths:
  /v2/subscription/card-update/checkoutform/initialize:
    post:
      summary: Abonelik Kart Güncelleme (Checkout Form)
      description: 'Bu istek ile bir abonelikte kullanılan kredi kartı güncellenebilir. Ödeme hatası,
        kart son kullanma tarihinin geçmesi gibi durumlarda üye iş yerleri kart bilgisini kolayca güncelleyebilir.
        **Güncelleme işlemi yalnızca iyzico ödeme formu üzerinden gerçekleştirilir.**

        Güncellenen kredi kartının validasyonu için **1 TL**’lik ödeme alınır ve hemen iadesi gerçekleşir.

        '
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeCardUpdateCheckoutFormRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeCardUpdateCheckoutFormResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse3'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-islemleri.md
  /v2/subscription/checkoutform/initialize:
    post:
      summary: Abonelik Başlatma (iyzico Ödeme Formu)
      description: iyzico Ödeme formu (Checkout Form) ile abonelik başlatmak için kullanılır. Ödeme formuna
        ait content ve token değeri döner.
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSubscriptionCheckoutFormInitializeRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSubscriptionCheckoutFormInitializeResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-islemleri.md
  /v2/subscription/checkoutform/{token}:
    get:
      summary: Ödeme Formu Sonucunu Alma
      description: Checkout form akışı tamamlandıktan sonra ödeme formuna token ile abonelik başlatma
        sonucunu sorgulanır.
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Checkout form initialize ile dönen, ilgili işleme ait token.
      - name: conversationId
        in: query
        required: false
        schema:
          type: string
        description: İstek esnasında gönderip, sonuçta alabileceğiniz bir değer, request/response eşleşmesi
          yapmak için kullanılabilir.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSubscriptionCheckoutFormResultResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse2'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abonelik-islemleri.md
  /v2/subscription/customers:
    get:
      summary: Abone Listeleme
      description: Tüm aboneleri ve temel detaylarını listeler.
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Belirtilen sayfa için aboneleri getirir.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        description: Sayfa başına kaç abone listeleneceğini belirtir.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abone-islemleri.md
  /v2/subscription/customers/{customerReferenceCode}:
    post:
      summary: Abone Güncelleme
      description: 'Bir abonenin tüm detayları API isteği ile güncellenebilir. Bunun için aboneye ait
        **customerReferenceCode** path parametresi ve güncellenecek alanlar request body içinde gönderilmelidir.
        Gönderilen parametreler üzerinden güncelleme yapılır; **en az bir alan** gönderilmesi zorunludur.

        '
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: customerReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Müşteri referans kodu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUpdateResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abone-islemleri.md
    get:
      summary: Abone Detayı
      description: Bir abonenin tüm detayları, aboneye ait referans kodu ile çağrılabilir.
      tags:
      - Abonelik
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      - name: customerReferenceCode
        in: path
        required: true
        schema:
          type: string
        description: Müşteri referans kodu.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-iyzico-source: https://docs.iyzico.com/urunler/abonelik/abonelik-entegrasyonu/abone-islemleri.md
  /v2/subscription/initialize:
    post:
      summary: Abonelik Başlatma (NON3D)
      description: Hazır ödeme formu olmadan, Tarafınıza ait ödeme formu ile NON3D servisi üzerinden abonelik
