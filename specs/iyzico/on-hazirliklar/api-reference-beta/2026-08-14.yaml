      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/odeme-metotlari/iyzico-odeme-formu-cf.md
  /payment/iyzipos/installment:
    post:
      summary: Taksit Sorgulama
      description: API, taksit sayısı, oranları ve tutarlarının yanı sıra; kartın bankası, kart ailesi
        ve kart şeması gibi özelliklerini sağlar. Belirtilen BIN ve tutar bilgisine göre uygun taksit
        seçeneklerini listeler. Ayrıca yalnızca BIN veya yalnızca tutar bilgisiyle de taksit oranları
        sorgulanabilir.
      tags:
      - Installment
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse12'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/taksit-ve-bin-sorgulama.md
  /payment/iyzipos/item/approve:
    post:
      summary: Onay Verme
      description: Ürüne onay vermek için ödeme kırılımına ait id (paymentTransactionId) iletilmesi gerekmektedir.
        Onay verilen ödeme kırılımı id’si (paymentTransactionId), ödeme servisinden dönmektedir.
      tags:
      - Pazaryeri
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemApproveRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemActionResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse13'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/pazaryeri/onay.md
  /payment/iyzipos/item/disapprove:
    post:
      summary: Onay Kaldırma
      description: Ürüne verilen onayı geri çekmek için ödeme kırılımına ait id (paymentTransactionId)
        iletilmesi gerekmektedir. Onayı geri çekilen ödeme kırılımı id’si (paymentTransactionId) servisten
        döner.
      tags:
