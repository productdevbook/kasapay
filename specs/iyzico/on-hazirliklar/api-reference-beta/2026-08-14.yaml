openapi: 3.0.3
info:
  title: iyzico — on-hazirliklar/api-reference-beta
  version: unversioned
  description: Reassembled from the per-endpoint fragments embedded in https://docs.iyzico.com/. iyzico
    publishes no OpenAPI file; this is a record of what was documented, not a contract they offer.
servers:
- url: https://api.iyzipay.com
  description: Production
- url: https://sandbox-api.iyzipay.com
  description: Sandbox
security:
- ApiKeyAuth: []
  SecretKeyAuth: []
  MerchantIdAuth: []
tags:
- name: Reporting
  description: Raporlama uçları
- name: Subscription Product
  description: Abonelik ürün yönetimi servisleri.
- name: iyzilink
  description: Link ile ödeme (iyzilink)
paths:
  /cardstorage/card:
    post:
      summary: Kullanıcı ve Kart Oluşturma
      description: Ödeme oluşturmadan, iyzico'da bir **kullanıcı** ve bu kullanıcıya bağlı bir **kart**
        kaydı oluşturabilirsiniz. Veya aynı endpoint üzerinden mevcut kullanıcıya **yeni bir kart** ekleyebilirsiniz.
        Bu noktada, istek parametreleri değişir. Her iki isteğin, request body ve json verilerine ulaşabilirsiniz;
      tags:
      - Kart Saklama
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CardCreateRequest'
              - $ref: '#/components/schemas/CardCreateWithUserKeyRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardCreateSuccessResponse'
        '400':
          description: Geçersiz istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse7'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/kart-saklama.md
    delete:
      summary: Saklı Kart Silme
      description: iyzico'da oluşturulan bir kullanıcıya ait bir kartı siler.
      tags:
      - Kart Saklama
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardDeleteRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Geçersiz istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse7'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/kart-saklama.md
  /cardstorage/cards:
    post:
      summary: Saklı Kartları Sorgulama
      description: iyzico'da bir kullanıcıya ait kartları sorgulayabilirsiniz.
      tags:
      - Kart Saklama
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardListRequest'
      responses:
        '200':
          description: Başarılı yanıt — Kart listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardListSuccessResponse'
        '400':
          description: Geçersiz istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse7'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/kart-saklama.md
  /onboarding/submerchant:
    post:
      summary: Alt Üye Oluşturma
      description: 'Pazaryeri (marketplace) modelinde alt üye işyerini oluşturur. **Bireysel**, **Şahıs
        Şirketi** ve **Limited/Anonim** tipleri desteklenir. Oluşturulacak alt üye işyeri tipi, **subMerchantType**
        parametresine göre belirlenir.

        '
      tags:
      - Pazaryeri
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmerchantCreateRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmerchantCreateResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse13'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/pazaryeri/alt-uye-isyeri.md
    put:
      summary: Alt Üye Güncelleme
      description: 'Mevcut alt üye işyerinin bilgilerinin güncellenmesi. Gövde şeması alt üye tipine göre
        değişir; **üç varyanttan biri** gönderilmelidir. Güncelleme gövdesinde **subMerchantType alanı
        bulunmaz**.

        '
      tags:
      - Pazaryeri
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmerchantUpdateRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmerchantUpdateResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse13'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/pazaryeri/alt-uye-isyeri.md
  /onboarding/submerchant/detail:
    post:
      summary: Alt Üye Sorgulama
      description: Dış ID (subMerchantExternalId) ile alt üye işyeri detaylarını döner.
      tags:
      - Pazaryeri
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmerchantDetailRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmerchantDetailResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse13'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/pazaryeri/alt-uye-isyeri.md
  /payment/3dsecure/auth:
    post:
      summary: Create 3DS Payment
      description: 3DS doğrulaması sonrasında, ödeme işleminin sonlandırılması için bu endpoint’e istek
        yapılmalıdır. Bu servis, doğrulama adımından sonra alınan bilgilerle çalıştırılır ve işlemi başarılı
        ya da başarısız olarak sonuçlandırır.
      tags:
      - 3DS Payment
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDSAuthRequest'
      responses:
        '200':
          description: Başarılı yanıt (ödeme tamamlandı)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Hatalı istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse8'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/odeme-metotlari/api-3ds.md
  /payment/3dsecure/initialize:
    post:
      summary: Initialize 3DS Payment
      description: 3D Secure oturumu başlatır ve 3DS doğrulama için htmlContent değeri döner.
      tags:
      - 3DS Payment
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDSInitializeRequest'
      responses:
        '200':
          description: Başarılı yanıt (3DS başlatıldı)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDSInitializeResponse'
        '400':
          description: Hatalı istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse8'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/odeme-metotlari/api-3ds.md
  /payment/auth:
    post:
      summary: Saklı Kart ile Ödeme Alma (NON3D)
      description: Kart saklama işlemi sonrasında tarafınıza dönen cardUserKey ve cardToken bilgisini
        kullanarak “NON3D veya 3DS” ödeme isteği gönderebilirsiniz. Standart ödeme isteğinden farklı olarak
        kart bilgileri yine cardUserKey ve cardToken değeri gönderilmektedir. Tek tık ile ödeme kolaylığı
        sağlamak isteyen veya abonelik döngüsü oluşturmak isteyen üye işyerleri tarafında kullanılabilir.
        Aşağıda NON3D örneği paylaşılmaktadır.
      tags:
      - Kart Saklama
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAuthSavedCardRequest'
      responses:
        '200':
          description: Başarılı yanıt — ödeme alındı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAuthSuccessResponse'
        '400':
          description: Geçersiz istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse7'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/kart-saklama.md
  /payment/bin/check:
    post:
      summary: BIN Sorgulama
      description: BIN sorgulamada kartın bankası, kart ailesi, kart şeması gibi kart özelliklerini sağlar.
        İstenen bilgileri elde etmek için, talebinize gerekli parametreleri eklemeniz yeterlidir. API,
        kapsamlı ayrıntılarla yanıt verecektir.
      tags:
      - BIN
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BINCheckRequest'
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BINCheckResponse'
        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse12'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/taksit-ve-bin-sorgulama.md
  /payment/cancel:
    post:
      summary: İptal
      description: Ödeme işlemini iptal etmek için kullanılır.
      tags:
      - Ödeme
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
