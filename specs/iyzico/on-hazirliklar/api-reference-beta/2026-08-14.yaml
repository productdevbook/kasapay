components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    SecretKeyAuth:
      type: apiKey
      in: header
      name: x-secret-key
    MerchantIdAuth:
      type: apiKey
      in: header
      name: x-merchant-id
  schemas:
    ActivateSubscriptionRequest:
      type: object
      properties:
        subscriptionReferenceCode:
          type: string
          description: Pending oalrak başlatılan aboneliğe ait referans kodu.
    ActivateSubscriptionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - failure
          description: Yapılan isteğin sonucunu belirtir. İşlem başarılı ise success değeri döner.
        systemTime:
          type: integer
          description: Dönen sonucun o anki unix timestamp değeridir.
    Address:
      type: object
      required:
      - address
      - contactName
      - city
      - country
      properties:
        address:
          type: string
          description: Tam adres.
        zipCode:
          type: string
          description: Posta kodu.
        contactName:
          type: string
          description: İlgili kişi.
        city:
          type: string
          description: Şehir.
        country:
          type: string
          description: Ülke.
    Address2:
      type: object
      required:
      - address
      - contactName
      - city
      - country
      properties:
        address:
          type: string
          description: Tam adres.
        zipCode:
          type: string
          description: Posta kodu.
        contactName:
          type: string
          description: İletişim adı.
        city:
          type: string
          description: Şehir.
        country:
          type: string
          description: Ülke.
    Address3:
      type: object
      description: 'Kargo Adresi. Sepetteki ürünlerden en az bir tanesinin, itemType "PHYSICAL" olması
        durumunda gönderilmesi zorunludur. Tüm ürünler "VIRTUAL" olduğu takdirde gönderilmesi gerekmez.

        '
      required:
      - address
      - contactName
      - city
      - country
      properties:
        address:
          type: string
          description: Tam adres.
        zipCode:
          type: string
          description: Posta/ZIP kodu.
        contactName:
          type: string
          description: İrtibat adı.
        city:
          type: string
          description: Şehir.
        country:
          type: string
          description: Ülke.
    BINCheckRequest:
      type: object
      required:
      - binNumber
      properties:
        locale:
          type: string
          description: İstek ve dönüş mesajlarında kullanılacak dil bilgisi.
          enum:
          - tr
          - en
        binNumber:
          type: string
          description: Sorgulanacak BIN (8 hane).
        conversationId:
          type: string
          description: İstek/yanıt eşleştirme ID’si. İstekte gönderilen değer, response'da aynen geri
            döner.
    BINCheckResponse:
      type: object
      properties:
        binNumber:
          type: string
          description: Sorgulanan BIN.
        cardType:
          type: string
          description: Kart tipi.
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - PREPAID_CARD
        cardAssociation:
          type: string
          description: Kart kuruluşu.
          enum:
          - VISA
          - MASTER_CARD
          - AMERICAN_EXPRESS
          - TROY
        cardFamily:
          type: string
          description: Kart ailesi.
          enum:
          - Bonus
          - Axess
          - World
          - Maximum
          - Paraf
          - CardFinans
          - Advantage
        bankName:
          type: string
          description: Banka adı.
        bankCode:
          type: integer
          description: Banka kodu.
        commercial:
          type: integer
          description: Ticari kart bilgisi (0; Bireysel, 1; Ticari).
          enum:
          - 0
          - 1
        status:
          type: string
          description: Gönderilen isteğin sonucu.
          enum:
          - success
          - failure
        locale:
          type: string
          description: Yanıt dili.
        systemTime:
          type: integer
          description: İşlem zamanı (epoch ms).
        conversationId:
          type: string
          description: İstek ile eşleşen ID.
    BaseResponse:
      type: object
      description: Standart yanıt alanları.
      properties:
        status:
          type: string
          description: Yapılan isteğin sonucunu bildirir.
          enum:
          - success
          - failure
        locale:
          type: string
          description: Yanıt dili (tr/en).
        systemTime:
          type: integer
          description: İşlem zamanı (epoch ms).
        conversationId:
          type: string
          description: İstek esnasında gönderilmişse, yanıtta aynen geri iletilir.
        price:
          type: decimal
          description: Sepet toplam tutarı.
        paidPrice:
          type: decimal
          description: Tahsil edilen toplam tutar.
        installment:
          type: integer
          description: Taksit sayısı.
        paymentId:
          type: string
          description: Ödeme ID’si.
        fraudStatus:
          type: integer
          description: "Fraud filtrelerine göre ödeme durumu. Eğer ödemenin fraud risk skoru düşük ise\
            \ ödemeye anında onay verilir, eğer fraud risk skoru yüksek ise ödeme işlemi reddedilir. Üye\
            \ işyeri sadece 1 olan işlemlerde ürünü kargoya vermelidir, 0 olan işlemler için bilgilendirme\
            \ beklemelidir.\n - 1: Onaylandı\n - 0: İncelemede\n - -1: Reddedildi\n"
          enum:
          - 0
          - -1
          - 1
        merchantCommissionRate:
          type: decimal
          description: Üye işyerinin uyguladığı vade/komisyon oranı. Örneğin price=100, paidPrice=110
            ise üye işyeri vade/komisyon oranı %10’dur. Bilgi amaçlıdır.
        merchantCommissionRateAmount:
          type: decimal
          description: Üye işyerinin uyguladığı vade/komisyon tutarı. Örneğin price=100, paidPrice=110
            ise üye işyeri vade/komisyon tutarı 10’dur. Bilgi amaçlıdır.
        iyziCommissionRateAmount:
          type: decimal
          description: iyzico komisyon oran tutarı.
        iyziCommissionFee:
          type: decimal
          description: Ödemeye ait iyzico işlem ücreti.
        cardType:
          type: string
          description: Kart tipi.
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - PREPAID_CARD
        cardAssociation:
          type: string
          description: Kart kuruluşu.
          enum:
          - VISA
          - MASTER_CARD
          - AMERICAN_EXPRESS
        cardFamily:
          type: string
          description: Kart ailesi.
          enum:
          - Bonus
          - Axess
          - World
          - Maximum
          - Paraf
          - CardFinans
        binNumber:
          type: string
          description: BIN (ilk 8 hane).
        lastFourDigits:
          type: string
          description: Kartın son 4 hanesi.
        basketId:
          type: string
          description: Sepet ID.
        currency:
          type: string
          enum:
          - TRY
          - USD
          - EUR
          - NOK
          - CHF
          - GBP
        itemTransactions:
          type: array
          items:
            $ref: '#/components/schemas/ItemTransaction'
        authCode:
          type: string
          description: Ödeme Fazı.
        phase:
          type: string
        hostReference:
          type: string
          description: Ödemeye ilişkin banka tarafından verilen hostReference değeri.
        signature:
          type: string
          description: İmza doğrulaması için kullanılabilecek signature değeri.
    BaseResponse2:
      type: object
      properties:
        status:
          type: string
          description: Yapılan isteğin sonucunu bildirir.
          enum:
          - success
          - failure
        locale:
          type: string
          description: Yanıt dili (tr/en).
        systemTime:
          type: integer
          description: İşlem zamanı (epoch ms).
        conversationId:
          type: string
          description: İstek ile eşleşen ID (varsa).
    BasicStatusResponse:
      type: object
      properties:
        status:
          type: string
          description: İstek sonucu (success/failure).
        locale:
          type: string
          description: Yanıt dili.
        systemTime:
          type: integer
          description: Unix zaman damgası (ms).
        conversationId:
          type: string
          description: İstekle gönderildiyse aynen geri döner.
    BasketItem:
      type: object
      required:
      - id
      - price
      - name
      - category1
      - itemType
      properties:
        id:
          type: string
          description: Ürün ID.
        price:
