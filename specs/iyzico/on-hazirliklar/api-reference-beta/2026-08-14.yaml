        '400':
          description: Hatalı istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse11'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/odeme-metotlari/iyzico-ile-ode.md
  /payment/iyzipos/checkoutform/initialize/auth/ecom:
    post:
      summary: Ödeme Formu (CF) Başlatma
      description: Ödeme formu (Checkout Form) oturumu başlatır ve ödeme sayfasını göstermek için `checkoutFormContent`
        / `paymentPageUrl` ve işleme ait `token` döner.
      tags:
      - CheckoutForm
      parameters:
