        '400':
          description: Başarısız yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse6'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/iptal-ve-iade.md
  /payment/detail:
    post:
      summary: Retrieve Payment Result
      description: Ödeme sonucunu sorgular.
      tags:
      - Non3D Payment
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentId
              properties:
                locale:
                  type: string
                  description: Dil kodu. Alabileceği değerler; tr, en. Default; tr
                  enum:
                  - tr
                  - en
                paymentId:
                  type: string
                  description: Ödeme işlem ID’si.
                paymentConversationId:
                  type: string
                  description: Ödeme işlemine ait conversationId. paymentId gönderilmezse zorunludur.
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseTwo'
        '400':
          description: Hatalı istek / doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse10'
      x-iyzico-source: https://docs.iyzico.com/on-hazirliklar/api-reference-beta/odeme-metotlari/api-non3d.md
  /payment/item:
    put:
      summary: Alt Üye / Hak Ediş Güncelleme
      description: 'Bu servis, tekil bir paymentTransaction üzerinden alt üye işyerine ait hak ediş tutarını
        değiştirmek veya alt üye işyerine ait bilgileri güncellemek için kullanılır.

        '
      tags:
      - Pazaryeri
      parameters:
      - $ref: '#/components/parameters/AuthHeader'
      - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPayoutUpdateRequest'
      responses:
