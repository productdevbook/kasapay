    refund:
      title: refund
      description: The refund information.
      type: object
      allOf:
      - allOf:
        - $ref: '#/components/schemas/refund_status'
      - title: Refund Properties
        description: The detailed properties of the refund transaction, including identifiers, amounts,
          breakdowns, and associated metadata.
        type: object
        properties:
          id:
            description: The PayPal-generated ID for the refund.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          amount:
            allOf:
            - $ref: '#/components/schemas/money'
            - description: The amount that the payee refunded to the payer.
              readOnly: true
          invoice_id:
            description: The API caller-provided external invoice number for this order. Appears in both
              the payer's transaction history and the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          custom_id:
            description: The API caller-provided external ID. Used to reconcile API caller-initiated transactions
              with PayPal transactions. Appears in transaction and settlement reports.
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[A-Za-z0-9-_.,]*$
          acquirer_reference_number:
            description: Reference ID issued for the card transaction. This ID can be used to track the
              transaction across processors, card brands and issuing banks.
            type: string
            minLength: 1
            maxLength: 36
            pattern: ^[a-zA-Z0-9]+$
          note_to_payer:
            description: The reason for the refund. Appears in both the payer's transaction history and
              the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          seller_payable_breakdown:
            title: Seller Payable Breakdown
            description: The breakdown of the refund.
            type: object
            readOnly: true
            properties:
              gross_amount:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The amount that the payee refunded to the payer.
                  readOnly: true
              paypal_fee:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The PayPal fee that was refunded to the payer in the currency of the transaction.
                    This fee might not match the PayPal fee that the payee paid when the payment was captured.
                  readOnly: true
              paypal_fee_in_receivable_currency:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The PayPal fee that was refunded to the payer in the receivable currency.
                    Returned only in cases when the receivable currency is different from transaction
                    currency. Example 'CNY'.
                  readOnly: true
              net_amount:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The net amount that the payee's account is debited in the transaction currency.
                    The net amount is calculated as <code>gross_amount</code> minus <code>paypal_fee</code>
                    minus <code>platform_fees</code>.
                  readOnly: true
              net_amount_in_receivable_currency:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The net amount that the payee's account is debited in the receivable currency.
                    Returned only in cases when the receivable currency is different from transaction
                    currency. Example 'CNY'.
                  readOnly: true
              platform_fees:
                description: An array of platform or partner fees, commissions, or brokerage fees for
                  the refund.
                type: array
                minItems: 0
                maxItems: 1
                items:
                  allOf:
                  - $ref: '#/components/schemas/platform_fee'
                  - title: platform_fee
              net_amount_breakdown:
                description: An array of breakdown values for the net amount. Returned when the currency
                  of the refund is different from the currency of the PayPal account where the payee holds
                  their funds.
                type: array
                minItems: 0
                maxItems: 32767
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/net_amount_breakdown_item'
                  - title: net_amount_breakdown_item
              total_refunded_amount:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The total amount refunded from the original capture to date. For example,
                    if a payer makes a $100 purchase and was refunded $20 a week ago and was refunded
                    $30 in this refund, the `gross_amount` is $30 for this refund and the `total_refunded_amount`
                    is $50.
          payer:
            allOf:
            - $ref: '#/components/schemas/payee_base'
            - description: The details associated with the merchant for this transaction.
              readOnly: true
          links:
            description: An array of related [HATEOAS links](/docs/api/reference/api-responses/#hateoas-links).
            type: array
            minItems: 0
            maxItems: 32767
            readOnly: true
            items:
              allOf:
              - $ref: '#/components/schemas/link_description-2'
              - title: link_description
      - allOf:
        - $ref: '#/components/schemas/activity_timestamps'
    refund_request:
      title: Refund Request
      description: Refunds a captured payment, by ID. For a full refund, include an empty request body.
        For a partial refund, include an <code>amount</code> object in the request body.
      type: object
      properties:
        amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The amount to refund. To refund a portion of the captured amount, specify an
              amount. If amount is not specified, an amount equal to <code>captured amount - previous
              refunds</code> is refunded. The amount must be a positive number and in the same currency
              as the one in which the payment was captured.
        custom_id:
          description: The API caller-provided external ID. Used to reconcile API caller-initiated transactions
            with PayPal transactions. Appears in transaction and settlement reports. The pattern is defined
            by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^.*$
        invoice_id:
          description: The API caller-provided external invoice ID for this order. The pattern is defined
            by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^.*$
        note_to_payer:
          description: The reason for the refund. Appears in both the payer's transaction history and
            the emails that the payer receives. The pattern is defined by an external party and supports
            Unicode.
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^.*$
        payment_instruction:
          allOf:
          - $ref: '#/components/schemas/payment_instruction-2'
          - description: Any additional refund instructions to be set during refund payment processing.
              This object is only applicable to merchants that have been enabled for PayPal Commerce Platform
              for Marketplaces and Platforms capability. Please speak to your account manager if you want
              to use this capability.
    refund_status:
      title: refund_status
      description: The refund status with details.
      type: object
      properties:
        status:
          title: Refund Status With Details
          description: The status of the refund.
          type: string
          enum:
          - CANCELLED
          - FAILED
          - PENDING
          - COMPLETED
          readOnly: true
        status_details:
          allOf:
          - $ref: '#/components/schemas/refund_status_details'
          - description: The details of the refund status.
            readOnly: true
    refund_status_details:
      title: refund_status_details
      description: The details of the refund status.
      type: object
      properties:
        reason:
          title: Refund Incomplete Reason
          description: The reason why the refund has the `PENDING` or `FAILED` status.
          type: string
          enum:
          - ECHECK
    related_ids:
      title: Related Identifiers
      description: Identifiers related to a specific resource.
      type: object
      properties:
        order_id:
          description: Order ID related to the resource.
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[A-Z0-9]+$
        authorization_id:
          description: Authorization ID related to the resource.
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[A-Z0-9]+$
        capture_id:
          description: Capture ID related to the resource.
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[A-Z0-9]+$
    seller_protection:
      title: seller_protection
      description: The level of protection offered as defined by [PayPal Seller Protection for Merchants](https://www.paypal.com/us/webapps/mpp/security/seller-protection).
      type: object
      properties:
        status:
          title: Seller Protection Status
          description: Indicates whether the transaction is eligible for seller protection. For information,
            see [PayPal Seller Protection for Merchants](https://www.paypal.com/us/webapps/mpp/security/seller-protection).
          type: string
          enum:
          - ELIGIBLE
          - PARTIALLY_ELIGIBLE
          - NOT_ELIGIBLE
          readOnly: true
        dispute_categories:
          description: An array of conditions that are covered for the transaction.
          type: array
          minItems: 0
          maxItems: 32767
          readOnly: true
          items:
            title: dispute_category
            description: The condition that is covered for the transaction.
            type: string
            enum:
            - ITEM_NOT_RECEIVED
            - UNAUTHORIZED_TRANSACTION
    seller_receivable_breakdown:
      title: Seller Receivable Breakdown
      description: The detailed breakdown of the capture activity. This is not available for transactions
        that are in pending state.
      type: object
      required:
      - gross_amount
      properties:
        gross_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The amount for this captured payment in the currency of the transaction.
        paypal_fee:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The applicable fee for this captured payment in the currency of the transaction.
        paypal_fee_in_receivable_currency:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The applicable fee for this captured payment in the receivable currency. Returned
              only in cases the fee is charged in the receivable currency. Example 'CNY'.
        net_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The net amount that the payee receives for this captured payment in their PayPal
              account. The net amount is computed as <code>gross_amount</code> minus the <code>paypal_fee</code>
              minus the <code>platform_fees</code>.
        receivable_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The net amount that is credited to the payee's PayPal account. Returned only
              when the currency of the captured payment is different from the currency of the PayPal account
              where the payee wants to credit the funds. The amount is computed as <code>net_amount</code>
              times <code>exchange_rate</code>.
        exchange_rate:
          allOf:
          - $ref: '#/components/schemas/exchange_rate'
          - description: The exchange rate that determines the amount that is credited to the payee's
              PayPal account. Returned when the currency of the captured payment is different from the
              currency of the PayPal account where the payee wants to credit the funds.
        platform_fees:
          description: An array of platform or partner fees, commissions, or brokerage fees that associated
            with the captured payment.
          type: array
          minItems: 0
          maxItems: 1
          items:
            allOf:
            - $ref: '#/components/schemas/platform_fee'
            - title: platform_fee
    standard_header_schema:
      title: Schema Object for standard headers
      description: Standard headers are generally less restrictive in structure due to historical precedent
        across browsers, etc. This is a common schema for use in defining most standard headers.
      type: string
      minLength: 1
      maxLength: 16000
      pattern: ^.*$
    supplementary_data:
      title: Payment Supplementary Data
      description: The supplementary data.
      type: object
      properties:
        related_ids:
          allOf:
          - $ref: '#/components/schemas/related_ids'
          - readOnly: true
    supplementary_purchase_data:
      title: Capture Identifier
      description: The capture identification-related fields. Includes the invoice ID, custom ID, note
        to payer, and soft descriptor.
      type: object
      properties:
        invoice_id:
          description: The API caller-provided external invoice number for this order. Appears in both
            the payer's transaction history and the emails that the payer receives.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^.{1,127}$
        note_to_payer:
          description: An informational note about this settlement. Appears in both the payer's transaction
            history and the emails that the payer receives.
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^.{1,255}$
