    money:
      title: Money
      description: The currency and amount for a financial transaction, such as a balance or payment due.
      type: object
      required:
      - currency_code
      - value
      properties:
        currency_code:
          $ref: '#/components/schemas/currency_code'
        value:
          description: The value, which might be:<ul><li>An integer for currencies like `JPY` that are
            not typically fractional.</li><li>A decimal fraction for currencies like `TND` that are subdivided
            into thousandths.</li></ul>For the required number of decimal places for a currency code,
            see [Currency Codes](/api/rest/reference/currency-codes/).
          type: string
          minLength: 0
          maxLength: 32
          pattern: ^((-?[0-9]+)|(-?([0-9]+)?[.][0-9]+))$
    net_amount_breakdown_item:
      title: net_amount_breakdown
      description: The net amount. Returned when the currency of the refund is different from the currency
        of the PayPal account where the merchant holds their funds.
      type: object
      properties:
        payable_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The net amount debited from the merchant's PayPal account.
            readOnly: true
        converted_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The converted payable amount.
            readOnly: true
        exchange_rate:
          allOf:
          - $ref: '#/components/schemas/exchange_rate'
          - description: The exchange rate that determines the amount that was debited from the merchant's
              PayPal account.
            readOnly: true
    network_transaction:
      title: network_transaction
      description: Reference values used by the card network to identify a transaction.
      type: object
      properties:
        id:
          description: Transaction reference id returned by the scheme. For Visa and Amex, this is the
            "Tran id" field in response. For MasterCard, this is the "BankNet reference id" field in response.
            For Discover, this is the "NRID" field in response. The pattern we expect for this field from
            Visa/Amex/CB/Discover is numeric, Mastercard/BNPP is alphanumeric and Paysecure is alphanumeric
            with special character -.
          type: string
          minLength: 9
          maxLength: 36
          pattern: ^[a-zA-Z0-9-_@.:&+=*^'~#!$%()]+$
        date:
          description: The date that the transaction was authorized by the scheme. This field may not
            be returned for all networks. MasterCard refers to this field as "BankNet reference date".
            For some specific networks, such as MasterCard and Discover, this date field is mandatory
            when the `previous_network_transaction_reference_id` is passed.
          type: string
          minLength: 4
          maxLength: 4
          pattern: ^[0-9]+$
        network:
          allOf:
          - $ref: '#/components/schemas/card_brand'
          - description: Name of the card network through which the transaction was routed.
        acquirer_reference_number:
          description: Reference ID issued for the card transaction. This ID can be used to track the
            transaction across processors, card brands and issuing banks.
          type: string
          minLength: 1
          maxLength: 36
          pattern: ^[a-zA-Z0-9]+$
    payee_base:
      title: payee_base
      description: The details for the merchant who receives the funds and fulfills the order. The merchant
        is also known as the payee.
      type: object
      properties:
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: The email address of merchant.
        merchant_id:
          allOf:
          - $ref: '#/components/schemas/account_id-2'
          - description: The encrypted PayPal account ID of the merchant.
    payment_instruction:
      title: payment_instruction
      description: Any additional payment instructions to be consider during payment processing. This
        processing instruction is applicable for Capturing an order or Authorizing an Order.
      type: object
      properties:
        platform_fees:
          description: An array of various fees, commissions, tips, or donations. This field is only applicable
            to merchants that been enabled for PayPal Complete Payments Platform for Marketplaces and
            Platforms capability.
          type: array
          minItems: 0
          maxItems: 1
          items:
            allOf:
            - $ref: '#/components/schemas/platform_fee'
            - title: platform_fee
        disbursement_mode:
          allOf:
          - $ref: '#/components/schemas/disbursement_mode'
          - description: The funds that are held payee by the marketplace/platform. This field is only
              applicable to merchants that been enabled for PayPal Complete Payments Platform for Marketplaces
              and Platforms capability.
        payee_pricing_tier_id:
          description: This field is only enabled for selected merchants/partners to use and provides
            the ability to trigger a specific pricing rate/plan for a payment transaction. The list of
            eligible 'payee_pricing_tier_id' would be provided to you by your Account Manager. Specifying
            values other than the one provided to you by your account manager would result in an error.
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^.*$
        payee_receivable_fx_rate_id:
          description: FX identifier generated returned by PayPal to be used for payment processing in
            order to honor FX rate (for eligible integrations) to be used when amount is settled/received
            into the payee account.
          type: string
          minLength: 1
          maxLength: 4000
          pattern: ^.*$
    payment_instruction-2:
      title: payment_instruction
      description: Any additional payments instructions during refund payment processing. This object
        is only applicable to merchants that have been enabled for PayPal Commerce Platform for Marketplaces
        and Platforms capability. Please speak to your account manager if you want to use this capability.
      type: object
      properties:
        platform_fees:
          description: Specifies the amount that the API caller will contribute to the refund being processed.
            The amount needs to be lower than platform_fees amount originally captured or the amount that
            is remaining if multiple refunds have been processed. This field is only applicable to merchants
            that have been enabled for PayPal Commerce Platform for Marketplaces and Platforms capability.
            Please speak to your account manager if you want to use this capability.
          type: array
          minItems: 0
          maxItems: 1
          items:
            allOf:
            - $ref: '#/components/schemas/platform_fee'
            - title: platform_fee
              not:
                required:
                - payee
    platform_fee:
      title: platform_fee
      description: The platform or partner fee, commission, or brokerage fee that is associated with the
        transaction. Not a separate or isolated transaction leg from the external perspective. The platform
        fee is limited in scope and is always associated with the original payment for the purchase unit.
      type: object
      required:
      - amount
      properties:
        amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - title: amount
            description: The fee for this transaction.
        payee:
          allOf:
          - $ref: '#/components/schemas/payee_base'
          - title: payee
            description: The recipient of the fee for this transaction.
    processor_response:
