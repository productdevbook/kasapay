      name: Authorization
      in: header
      description: Holds authorization information for external API calls.
      required: false
      schema:
        $ref: '#/components/schemas/standard_header_schema'
      examples:
        bearer:
          summary: Bearer authorization.
          description: An authorization header with information for the Bearer authorization scheme. The
            authorization parameter value is randomized for this example.
          value: Bearer A21AAGHr9qtiRRXH4oYcQokQgV99rGqEIfgrr8xHCclP0OzmD9KVgg5ppIIg1jzJgQkV4wd02svIvBJyg6cLFJjFow_SjBhxQ
    paypal_auth_assertion:
      name: PayPal-Auth-Assertion
      in: header
      description: Header for an API client-provided JWT assertion that identifies the merchant. Establishing
        the consent to act-on-behalf of a merchant is a prerequisite for using this header.
      required: false
      schema:
        description: Header for an API client-provided JWT assertion that identifies the merchant. Establishing
          the consent to act-on-behalf of a merchant is a prerequisite for using this header.
        type: string
        minLength: 1
        maxLength: 10000
        pattern: ^.*$
      examples:
        auth_assertion:
          summary: An auth assertion.
          description: A paypal-auth-assertion header with a randomized value.
          value: eyJhbGciOiJub25lIn0.eyJlbWFpbCI6Im15QGVtYWlsLmNvbSJ9
    paypal_request_id:
      name: PayPal-Request-Id
      in: header
