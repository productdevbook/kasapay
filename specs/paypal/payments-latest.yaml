openapi: 3.0.4
info:
  title: Payments
  description: Subset of https://raw.githubusercontent.com/paypal/paypal-rest-api-specifications/main/openapi/payments_payment_v2.json,
    limited to the operations kasapay-paypal maps. PayPal's own document, under PayPal's own Apache-2.0
    licence, cut down and otherwise unaltered.
  version: '2.12'
servers:
- url: https://api-m.paypal.com
  description: Server for https scheme.
paths:
  /v2/payments/captures/{capture_id}/refund:
    post:
      operationId: captures.refund
      summary: Refund captured payment
      description: Refunds a captured payment, by ID. For a full refund, include an empty payload in the
        JSON request body. For a partial refund, include an <code>amount</code> object in the JSON request
        body.
      tags:
      - captures
      security:
      - Oauth2:
        - https://uri.paypal.com/services/payments/refund
      parameters:
      - name: capture_id
        description: The PayPal-generated ID for the captured payment to refund.
        in: path
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
        examples:
          captures_refund_200_idempotent_response:
            summary: Refund Captured Payment - 200 idempotent response
            description: Refunds a captured payment, by ID. For a full refund, include an empty payload
              in the request body. For a partial refund, include an `amount` object.
            value: 2GG279541U471931P
          captures_refund_empty_request:
            summary: Refund Captured Payment with an empty request
            description: Refunds a captured payment, by ID. For a full refund, include an empty payload
              in the request body. For a partial refund, include an `amount` object.
            value: 7TK53561YB803214S
          captures_refund_with_prefer_header:
            summary: Refund Captured Payment
            description: Refunds a captured payment, by ID. For a full refund, include an empty payload
              in the request body. For a partial refund, include an `amount` object.
            value: 2GG279541U471931P
      - $ref: '#/components/parameters/paypal_request_id'
      - name: Prefer
        description: The preferred server response upon successful completion of the request. Value is:<ul><li><code>return=minimal</code>.
          The server returns a minimal response to optimize communication between the API caller and the
          server. A minimal response includes the <code>id</code>, <code>status</code> and HATEOAS links.</li><li><code>return=representation</code>.
          The server returns a complete resource representation, including the current state of the resource.</li></ul>
        in: header
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
          default: return=minimal
        examples:
          captures_refund_200_idempotent_response:
            summary: Refund Captured Payment - 200 idempotent response
            description: Refunds a captured payment, by ID. For a full refund, include an empty payload
              in the request body. For a partial refund, include an `amount` object.
            value: return=representation
          captures_refund_with_prefer_header:
            summary: Refund Captured Payment
            description: Refunds a captured payment, by ID. For a full refund, include an empty payload
              in the request body. For a partial refund, include an `amount` object.
            value: return=representation
          captures_refund_empty_request:
            summary: Refund Captured Payment with an empty request
            description: Refunds a captured payment, by ID. For a full refund, include an empty payload
              in the request body. For a partial refund, include an `amount` object.
            value: return=representation
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/paypal_auth_assertion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/refund_request'
            examples:
              captures_refund_200_idempotent_response:
                summary: Refund Captured Payment - 200 idempotent response
                description: Refunds a captured payment, by ID. For a full refund, include an empty payload
                  in the request body. For a partial refund, include an `amount` object.
                value:
                  amount:
                    value: '1.00'
                    currency_code: USD
                  invoice_id: RefundInvoice-123
                  custom_id: RefundCustom-123
              captures_refund_empty_request:
                summary: Refund Captured Payment with an empty request
                description: Refunds a captured payment, by ID. For a full refund, include an empty payload
                  in the request body. For a partial refund, include an `amount` object.
                value: {}
              captures_refund_with_prefer_header:
                summary: Refund Captured Payment
                description: Refunds a captured payment, by ID. For a full refund, include an empty payload
                  in the request body. For a partial refund, include an `amount` object.
                value:
                  amount:
                    value: '10.99'
                    currency_code: USD
                  invoice_id: INVOICE-123
                  note: Defective product
      x-exampleFlows:
      - title: Partial refund of a captured payment
        description: Refunds a portion of a captured payment by ID. Includes an amount object in the request
          body specifying the partial refund amount.
        parameter_examples:
        - parameters/@name=='capture_id'/examples/captures_refund
        request_example: requestBody/content/application~1json/examples/captures_refund
        response_example: responses/201/content/application~1json/examples/captures_refund
      - title: Full refund with empty request body
        description: Refunds the full amount of a captured payment by ID. Includes an empty payload in
          the request body.
        parameter_examples:
        - parameters/@name=='capture_id'/examples/captures_refund_empty_request
        - parameters/@name=='Prefer'/examples/captures_refund_empty_request
        request_example: requestBody/content/application~1json/examples/captures_refund_empty_request
        response_example: responses/201/content/application~1json/examples/captures_refund_empty_request
      - title: Refund with Prefer header for full representation
        description: Refunds a captured payment by ID with the Prefer header set to return=representation
          to get the complete refund details in the response.
        parameter_examples:
        - parameters/@name=='capture_id'/examples/captures_refund_with_prefer_header
        - parameters/@name=='Prefer'/examples/captures_refund_with_prefer_header
        request_example: requestBody/content/application~1json/examples/captures_refund_with_prefer_header
        response_example: responses/201/content/application~1json/examples/captures_refund_with_prefer_header
      - title: Idempotent refund request (200 response)
        description: Demonstrates an idempotent refund request where the same PayPal-Request-Id is used,
          resulting in a 200 OK response with the existing refund details.
        parameter_examples:
        - parameters/@name=='capture_id'/examples/captures_refund_200_idempotent_response
        - parameters/@name=='Prefer'/examples/captures_refund_200_idempotent_response
        request_example: requestBody/content/application~1json/examples/captures_refund_200_idempotent_response
        response_example: responses/200/content/application~1json/examples/captures_refund_200_idempotent_response
      responses:
        '200':
          description: A successful request returns the HTTP <code>200 OK</code> status code and a JSON
            response body that shows refund details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/refund'
              examples:
                captures_refund_200_idempotent_response:
                  summary: Refund Captured Payment - 200 idempotent response
                  description: Refunds a captured payment, by ID. For a full refund, include an empty
                    payload in the request body. For a partial refund, include an `amount` object.
                  value:
                    id: 0K35355239430361V
                    amount:
                      currency_code: USD
                      value: '1.00'
                    seller_payable_breakdown:
                      gross_amount:
                        currency_code: USD
                        value: '1.00'
                      paypal_fee:
                        currency_code: USD
                        value: '0.00'
                      net_amount:
                        currency_code: USD
                        value: '1.00'
                      total_refunded_amount:
                        currency_code: USD
                        value: '11.00'
                    invoice_id: RefundInvoice-14_10_2024_4_58_32_pm
                    custom_id: RefundCustom-14_10_2024_4_58_32_pm
                    status: COMPLETED
                    create_time: '2024-10-14T14:58:34-07:00'
                    update_time: '2024-10-14T14:58:34-07:00'
                    links:
                    - href: https://api.paypal.com/v2/payments/refunds/0K35355239430361V
                      rel: self
                      method: GET
                    - href: https://api.paypal.com/v2/payments/captures/7TK53561YB803214S
                      rel: up
                      method: GET
        '201':
          description: A successful request returns the HTTP <code>201 Created</code> status code and
            a JSON response body that shows refund details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/refund'
              examples:
                captures_refund_empty_request:
                  summary: Refund Captured Payment with an empty request
                  description: Refunds a captured payment, by ID. For a full refund, include an empty
                    payload in the request body. For a partial refund, include an `amount` object.
                  value:
                    id: 58K15806CS993444T
                    amount:
                      currency_code: USD
                      value: '89.00'
                    seller_payable_breakdown:
                      gross_amount:
                        currency_code: USD
                        value: '89.00'
                      paypal_fee:
                        currency_code: USD
                        value: '0.00'
                      net_amount:
                        currency_code: USD
                        value: '89.00'
                      total_refunded_amount:
                        currency_code: USD
                        value: '100.00'
                    invoice_id: OrderInvoice-10_10_2024_12_58_20_pm
                    status: COMPLETED
                    create_time: '2024-10-14T15:03:29-07:00'
                    update_time: '2024-10-14T15:03:29-07:00'
                    links:
                    - href: https://api.msmaster.qa.paypal.com/v2/payments/refunds/58K15806CS993444T
                      rel: self
                      method: GET
                    - href: https://api.msmaster.qa.paypal.com/v2/payments/captures/7TK53561YB803214S
                      rel: up
                      method: GET
                captures_refund_with_prefer_header:
                  summary: Refund Captured Payment
                  description: Refunds a captured payment, by ID. For a full refund, include an empty
                    payload in the request body. For a partial refund, include an `amount` object.
                  value:
                    id: 1JU08902781691411
                    amount:
                      value: '10.99'
                      currency_code: USD
                    status: COMPLETED
                    note: Defective product
                    seller_payable_breakdown:
                      gross_amount:
                        value: '10.99'
                        currency_code: USD
                      paypal_fee:
                        value: '0'
                        currency_code: USD
                      net_amount:
                        value: '10.99'
                        currency_code: USD
                      total_refunded_amount:
                        value: '10.99'
                        currency_code: USD
                    invoice_id: INVOICE-123
                    create_time: '2018-09-11T23:24:19Z'
                    update_time: '2018-09-11T23:24:19Z'
                    links:
                    - rel: self
                      method: GET
                      href: https://api-m.paypal.com/v2/payments/refunds/1JU08902781691411
                    - rel: up
                      method: GET
                      href: https://api-m.paypal.com/v2/payments/captures/2GG279541U471931P
        '400':
          description: The request failed because it is not well-formed or is syntactically incorrect
            or violates schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                capture_refund_400_invalid_request:
                  summary: Refund Captured Payment - 400 Bad Request - Validation Error
                  description: This code sample attempts to refund a captured payment, but the request
                    fails because a validation error occurred.
                  value:
                    name: INVALID_REQUEST
                    message: Request is not well-formed, syntactically incorrect, or violates schema
                    debug_id: 78916e688cf7f
                    details:
                    - issue: INVALID_STRING_LENGTH
                      field: /invoice_id
                      value: Fm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinqFm67fYiinq
                      description: The value of a field is either too short or too long.
                      location: body
                    links:
                    - href: https://developer.paypal.com/docs/api/payments/v2/#error-INVALID_STRING_LENGTH
                      rel: information_link
        '401':
          $ref: '#/components/responses/401_error_response'
        '403':
          $ref: '#/components/responses/403_error_response'
        '404':
          $ref: '#/components/responses/404_error_response'
        '409':
          description: The request failed because a previous call for the given resource is in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                captures_refund_409_conflict:
                  summary: Refund Captured Payment - 409 Conflict - Operation in Progress Error
                  description: This code sample attempts to refund a captured payment but the request
                    fails because a previous call for the given resource is in progress.
                  value:
                    name: RESOURCE_CONFLICT
                    debug_id: b1d1f06c7246c
                    message: The server has detected a conflict while processing this request.
                    details:
                    - issue: PREVIOUS_REQUEST_IN_PROGRESS
                      description: A previous request on this resource is currently in progress. Please
                        wait for some time and try again. It is best to space out the initial and the
                        subsequent request(s) to avoid receiving this error.
        '422':
          description: The request failed because it either is semantically incorrect or failed business
            validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                captures_refund_422_amount_exceeded:
                  summary: Refund Captured Payment - 422 Unprocessable Entity - Refund Amount Exceeded
                    Error
                  description: This code sample attempts to refund a captured payment, but the request
                    fails because the refund amount has exceeded the capture amount.
                  value:
                    name: UNPROCCESSABLE_ENTITY
                    message: The requested action could not be completed, is semantically incorrect, or
                      failed business validation.
                    debug_id: 90bff07028f7f
                    details:
                    - issue: REFUND_AMOUNT_EXCEEDED
                      description: The refund amount must be less than or equal to the capture amount
                        that has not yet been refunded.
                captures_refund_422_transaction_disputed:
                  summary: Refund Captured Payment - 422 Unprocessable Entity - Capture Disputed Partial
                    Refund Error
                  description: This code sample attempts to partially refund a captured payment, but the
                    request fails because the captured payment is currently under dispute.
                  value:
                    name: UNPROCESSABLE_ENTITY
                    message: The requested action could not be performed, semantically incorrect, or failed
                      business validation.
                    debug_id: 90bff07028f7f
                    details:
                    - issue: TRANSACTION_DISPUTED
                      description: Partial refunds cannot be offered at this time because there is an
                        open case on this transaction. Visit the PayPal Resolution Center to review this
                        case.
        '500':
          $ref: '#/components/responses/500_error_response'
        default:
          $ref: '#/components/responses/default_response'
      callbacks:
        capture_refunded:
          $ref: '#/components/callbacks/capture_refunded'
  /v2/payments/authorizations/{authorization_id}/capture:
