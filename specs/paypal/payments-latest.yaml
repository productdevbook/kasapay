            description: Indicates whether you can make additional captures against the authorized payment.
              Set to `true` if you do not intend to capture additional payments against the authorization.
              Set to `false` if you intend to capture additional payments against the authorization.
            type: boolean
            default: false
            readOnly: true
          seller_receivable_breakdown:
            allOf:
            - $ref: '#/components/schemas/seller_receivable_breakdown'
            - readOnly: true
          disbursement_mode:
            allOf:
            - $ref: '#/components/schemas/disbursement_mode'
          links:
            description: An array of related [HATEOAS links](/docs/api/reference/api-responses/#hateoas-links).
            type: array
            minItems: 0
            maxItems: 32767
            readOnly: true
            items:
              allOf:
              - $ref: '#/components/schemas/link_description-2'
              - title: link_description
          processor_response:
            allOf:
            - $ref: '#/components/schemas/processor_response'
            - description: An object that provides additional processor information for a direct credit
                card transaction.
      - allOf:
        - $ref: '#/components/schemas/activity_timestamps'
    capture-2:
      title: Captured Payment
      description: A captured payment.
      type: object
      allOf:
      - $ref: '#/components/schemas/capture'
      - type: object
        properties:
          supplementary_data:
            allOf:
            - $ref: '#/components/schemas/supplementary_data'
            - description: An object that provides supplementary/additional data related to a payment
                transaction.
              readOnly: true
          payee:
            allOf:
            - $ref: '#/components/schemas/payee_base'
            - readOnly: true
    capture_request:
      title: Capture Request
      description: Captures either a portion or the full authorized amount of an authorized payment.
      type: object
      allOf:
      - $ref: '#/components/schemas/supplementary_purchase_data'
      - type: object
        properties:
          amount:
            allOf:
            - $ref: '#/components/schemas/money'
            - description: The amount to capture. To capture a portion of the full authorized amount,
                specify an amount. If amount is not specified, the full authorized amount is captured.
                The amount must be a positive number and in the same currency as the authorization against
                which the payment is being captured.
          invoice_id:
            description: The API caller-provided external invoice number for this order. Appears in both
              the payer's transaction history and the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 127
            pattern: ^[\S\s]*$
          final_capture:
            description: Indicates whether you can make additional captures against the authorized payment.
              Set to `true` if you do not intend to capture additional payments against the authorization.
              Set to `false` if you intend to capture additional payments against the authorization.
            type: boolean
            default: false
          payment_instruction:
            allOf:
            - $ref: '#/components/schemas/payment_instruction'
            - not:
                required:
                - payee_pricing_tier_id
          note_to_payer:
            description: An informational note about this settlement. Appears in both the payer's transaction
              history and the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 255
            pattern: ^[\S\s]*$
          soft_descriptor:
            description: The payment descriptor on the payer's account statement.
            type: string
            minLength: 0
            maxLength: 22
            pattern: ^[\S\s]*$
    capture_status:
      title: capture_status
      description: The status and status details of a captured payment.
      type: object
      properties:
        status:
          title: Capture Status
          description: The status of the captured payment.
          type: string
          enum:
          - COMPLETED
          - DECLINED
          - PARTIALLY_REFUNDED
          - PENDING
          - REFUNDED
          - FAILED
          readOnly: true
        status_details:
          allOf:
          - $ref: '#/components/schemas/capture_status_details'
          - description: The details of the captured payment status.
            readOnly: true
    capture_status_details:
      title: capture_status_details
      description: The details of the captured payment status.
      type: object
      properties:
        reason:
          title: Capture Incomplete Reason
          description: The reason why the captured payment status is `PENDING` or `DENIED`.
          type: string
          enum:
          - BUYER_COMPLAINT
          - CHARGEBACK
          - ECHECK
          - INTERNATIONAL_WITHDRAWAL
          - OTHER
          - PENDING_REVIEW
          - RECEIVING_PREFERENCE_MANDATES_MANUAL_ACTION
          - REFUNDED
          - TRANSACTION_APPROVED_AWAITING_FUNDING
          - UNILATERAL
          - VERIFICATION_REQUIRED
          - DECLINED_BY_RISK_FRAUD_FILTERS
    card_brand:
      title: card_brand
      description: The card network or brand. Applies to credit, debit, gift, and payment cards.
      type: string
      enum:
      - VISA
      - MASTERCARD
      - DISCOVER
      - AMEX
      - SOLO
      - JCB
      - STAR
      - DELTA
      - SWITCH
      - MAESTRO
      - CB_NATIONALE
      - CONFIGOGA
      - CONFIDIS
      - ELECTRON
      - CETELEM
      - CHINA_UNION_PAY
      - DINERS
      - ELO
      - HIPER
      - HIPERCARD
      - RUPAY
      - GE
      - SYNCHRONY
      - EFTPOS
      - CARTE_BANCAIRE
      - STAR_ACCESS
      - PULSE
      - NYCE
      - ACCEL
      - UNKNOWN
    currency_code:
      description: The [three-character ISO-4217 currency code](/api/rest/reference/currency-codes/) that
        identifies the currency.
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[\S\s]*$
    date_time:
      description: The date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
        Seconds are required while fractional seconds are optional.<blockquote><strong>Note:</strong>
        The regular expression provides guidance but does not reject all invalid dates.</blockquote>
      type: string
      minLength: 20
      maxLength: 64
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
    disbursement_mode:
      title: disbursement_mode
      description: The funds that are held on behalf of the merchant.
      type: string
      enum:
      - INSTANT
      - DELAYED
      default: INSTANT
    discount_with_breakdown:
      title: discount_with_breakdown
      description: The discount amount and currency code. For list of supported currencies and decimal
        precision, see the PayPal REST APIs <a href="/docs/integration/direct/rest/currency-codes/">Currency
        Codes</a>.
      type: object
      allOf:
      - $ref: '#/components/schemas/money'
      - type: object
    email:
      title: email
      description: The internationalized email address.<blockquote><strong>Note:</strong> Up to 64 characters
        are allowed before and 255 characters are allowed after the <code>@</code> sign. However, the
        generally accepted maximum length for an email address is 254 characters. The pattern verifies
        that an unquoted <code>@</code> sign exists.</blockquote>
      type: string
      minLength: 3
      maxLength: 254
      pattern: ^.*(?:[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*|(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?|\[(?:(?:(2(5[0-5]|[0-4][0-9])|1[0-9][0-9]|[1-9]?[0-9]))\.){3}(?:(2(5[0-5]|[0-4][0-9])|1[0-9][0-9]|[1-9]?[0-9])|[a-zA-Z0-9-]*[a-zA-Z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\]).*$
    error:
