      description: The [two-character ISO 3166-1 code](/api/rest/reference/country-codes/) that identifies
        the country or region.<blockquote><strong>Note:</strong> The country code for Great Britain is
        <code>GB</code> and not <code>UK</code> as used in the top-level domain names for that country.
        Use the `C2` country code for China worldwide for comparable uncontrolled price (CUP) method,
        bank card, and cross-border transactions.</blockquote>
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^([A-Z]{2}|C2)$
    crypto:
      title: crypto
