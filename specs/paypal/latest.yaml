openapi: 3.0.4
info:
  title: Orders
  description: Subset of https://raw.githubusercontent.com/paypal/paypal-rest-api-specifications/main/openapi/checkout_orders_v2.json,
    limited to the operations kasapay-paypal maps. PayPal's own document, under PayPal's own Apache-2.0
    licence, cut down and otherwise unaltered.
  version: '2.32'
servers:
- url: https://api-m.paypal.com
  description: Server for https scheme.
paths:
  /v2/checkout/orders:
    post:
      operationId: orders.create
      summary: Create order
      description: Creates an order. Merchants and partners can add Level 2 and 3 data to payments to
        reduce risk and payment processing costs. For more information about processing payments, see
        <a href="https://developer.paypal.com/docs/checkout/advanced/processing/">checkout</a> or <a href="https://developer.paypal.com/docs/multiparty/checkout/advanced/processing/">multiparty
        checkout</a>.<blockquote><strong>Note:</strong> For error handling and troubleshooting, see <a
        href="https://developer.paypal.com/api/rest/reference/orders/v2/errors/#create-order">Orders v2
        errors</a>.</blockquote>
      tags:
      - orders
      security:
      - Oauth2:
        - https://uri.paypal.com/services/payments/payment
        - https://uri.paypal.com/services/payments/orders/deprecating-jssdk-migration-for-limited-merchants
      parameters:
      - name: PayPal-Request-Id
        description: The server stores keys for 6 hours. The API callers can request the times to up to
          72 hours by speaking to their Account Manager. It is mandatory for all single-step create order
          calls (E.g. Create Order Request with payment source information like Card, PayPal.vault_id,
          PayPal.billing_agreement_id, etc).
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 108
          pattern: ^[\S\s]*$
        examples:
          orders_create_authorize_single_step_paypal_with_vault_id_and_stored_credentials_usage_pattern:
            summary: Create and authorize an order for a PayPal wallet vaulted account holder passing
              a usage pattern indicator using stored credentials (Single Shot).
            description: Creates an order and authorizes payment with a PayPal wallet vault id as the
              payment source and a usage pattern (billing indicator) RECURRING_PREPAID passed using stored
              credentials.
            value: 7b92603e-77ed-4896-8e78-5dea2050476a
          00_orders_create:
            summary: Create Order - PayPal Wallet as Payment Source, Resulting in PAYER_ACTION_REQUIRED
              Response
            description: Creates a new order. API caller receives payer-action link.
            value: 7b92603e-77ed-4896-8e78-5dea2050476a
      - name: PayPal-Partner-Attribution-Id
        description: PayPal Partner can send a PayPal-Partner-Attribution-Id request header with the value
          that they have been assigned by the PayPal Partner program. This value is known as a BN Code.
          In order to reward such partners (through partner programs), all the activities (including API
          calls) that they are doing on behalf of the merchants need to be tracked.
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 36
          pattern: ^[\S\s]*$
      - $ref: '#/components/parameters/paypal_client_metadata_id'
      - name: Prefer
        description: The preferred server response upon successful completion of the request. Value is:<ul><li><code>return=minimal</code>.
          The server returns a minimal response to optimize communication between the API caller and the
          server. A minimal response includes the <code>id</code>, <code>status</code> and HATEOAS links.</li><li><code>return=representation</code>.
          The server returns a complete resource representation, including the current state of the resource.</li></ul>
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 25
          pattern: ^[a-zA-Z=,-]*$
          default: return=minimal
        examples:
          orders_create_create_orders_with_shipping_type_pickup_in_store:
            summary: Create Order - Buy Online Pickup In Store Shipping Type
            description: Creates an order with minimal parameters and contains the Buy Online Pickup in
              Store-related fields.
            value: return=representation
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/paypal_auth_assertion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/order_request'
            examples:
              00_orders_create:
                summary: Create Order - PayPal Wallet as Payment Source, Resulting in PAYER_ACTION_REQUIRED
                  Response
                description: Creates a new order. API caller receives payer-action link.
                value:
                  payment_source:
                    paypal:
                      experience_context:
                        payment_method_preference: IMMEDIATE_PAYMENT_REQUIRED
                        landing_page: LOGIN
                        shipping_preference: GET_FROM_FILE
                        user_action: PAY_NOW
                        return_url: https://example.com/returnUrl
                        cancel_url: https://example.com/cancelUrl
                  purchase_units:
                  - invoice_id: '90210'
                    amount:
                      currency_code: USD
                      value: '230.00'
                      breakdown:
                        item_total:
                          currency_code: USD
                          value: '220.00'
                        shipping:
                          currency_code: USD
                          value: '10.00'
                    items:
                    - name: T-Shirt
                      description: Super Fresh Shirt
                      unit_amount:
                        currency_code: USD
                        value: '20.00'
                      quantity: '1'
                      category: PHYSICAL_GOODS
                      sku: sku01
                      image_url: https://example.com/static/images/items/1/tshirt_green.jpg
                      url: https://example.com/url-to-the-item-being-purchased-1
                      upc:
                        type: UPC-A
                        code: '123456789012'
                    - name: Shoes
                      description: Running, Size 10.5
                      sku: sku02
                      unit_amount:
                        currency_code: USD
                        value: '100.00'
                      quantity: '2'
                      category: PHYSICAL_GOODS
                      image_url: https://example.com/static/images/items/1/shoes_running.jpg
                      url: https://example.com/url-to-the-item-being-purchased-2
                      upc:
                        type: UPC-A
                        code: '987654321012'
              create_422_unprocessable_entity_missing_pickup_address:
                summary: Create Order - 422 Unprocessable Entity Error - Missing Pickup Address
                description: 'This code sample attempts to create an order but the shipping address is
                  required and `shipping.type` is set to PICKUP_FROM_PERSON '
                value:
                  payment_source:
                    paypal:
                      experience_context:
                        return_url: https://www.example.com/returnURL
                        cancel_url: https://www.example.com/cancelURL
                        shipping_preference: SET_PROVIDED_ADDRESS
                  purchase_units:
                  - reference_id: PUHF
                    amount:
                      currency_code: USD
                      value: '100.00'
                    shipping:
                      type: PICKUP_FROM_PERSON
              orders_create_authorize_single_step_paypal_with_vault_id_and_stored_credentials_usage_pattern:
                summary: Create and authorize an order for a PayPal wallet vaulted account holder passing
                  a usage pattern indicator using stored credentials (Single Shot).
                description: Creates an order and authorizes payment with a PayPal wallet vault id as
                  the payment source and a usage pattern (billing indicator) RECURRING_PREPAID passed
                  using stored credentials.
                value:
                  purchase_units:
                  - amount:
                      currency_code: USD
                      value: '100.00'
                  payment_source:
                    paypal:
                      vault_id: 2w915838hr181240m
              orders_create_create_orders_with_shipping_type_pickup_in_store:
                summary: Create Order - Buy Online Pickup In Store Shipping Type
                description: Creates an order with minimal parameters and contains the Buy Online Pickup
                  in Store-related fields.
                value:
                  purchase_units:
                  - reference_id: PUHF
                    amount:
                      currency_code: USD
                      value: '50.00'
                    payee:
                      email_address: merchant@example.com
                    shipping:
                      address:
                        address_line_1: 123 Townsend St
                        address_line_2: Floor 6
                        admin_area_2: San Francisco
                        admin_area_1: CA
                        postal_code: '94107'
                        country_code: US
                      type: PICKUP_IN_STORE
              orders_create_simple:
                summary: Create Order - Minimal Request and Response
                description: Creates an order with only required parameters. By default, uses the minimal
                  representation.
                value:
                  purchase_units:
                  - amount:
                      currency_code: USD
                      value: '100.00'
      responses:
        '200':
          description: A successful response to an idempotent request returns the HTTP `200 OK` status
            code with a JSON response body that shows order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order'
              examples:
                00_orders_create:
                  summary: Create Order - PayPal Wallet as Payment Source, Resulting in PAYER_ACTION_REQUIRED
                    Response
                  description: Creates a new order. API caller receives payer-action link.
                  value:
                    id: 5O190127TN364715T
                    payment_source:
                      paypal: {}
                    links:
                    - href: https://api-m.paypal.com/v2/checkout/orders/5O190127TN364715T
                      rel: self
                      method: GET
                    - href: https://www.paypal.com/checkoutnow?token=5O190127TN364715T
                      rel: payer-action
                      method: GET
        '201':
          description: 'A successful request returns the HTTP `201 Created` status code and a JSON response
            body that includes by default a minimal response with the ID, status, and HATEOAS links. If
            you require the complete order resource representation, you must pass the <a href="https://developer.paypal.com/docs/api/orders/v2/#orders-create-header-parameters"><code>Prefer:
            return=representation</code> request header</a>. This header value is not the default.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order'
              examples:
                orders_create_authorize_single_step_paypal_with_vault_id_and_stored_credentials_usage_pattern:
                  summary: Create and authorize an order for a PayPal wallet vaulted account holder passing
                    a usage pattern indicator using stored credentials (Single Shot).
                  description: Creates an order and authorizes payment with a PayPal wallet vault id as
                    the payment source and a usage pattern (billing indicator) RECURRING_PREPAID passed
                    using stored credentials.
                  value:
                    id: 8K832279M55989614
                    payment_source:
                      paypal:
                        email_address: buyer@paypal.com
                        account_id: XQHSN372NGSP2
                        account_status: UNVERIFIED
                        name:
                          given_name: Tom
                          surname: Business
                        phone_number:
                          national_number: '8127081430'
                        address:
                          country_code: US
                    purchase_units:
                    - reference_id: default
                      amount:
                        currency_code: USD
                        value: '100.00'
                      payee:
                        email_address: seller@paypal.com
                        merchant_id: Q7C9N6S4YRQXG
                      shipping:
                        name:
                          full_name: Tom Business
                        address:
                          address_line_1: 123 Fake St.
                          admin_area_2: Baton Rouge
                          admin_area_1: LA
                          postal_code: '70802'
                          country_code: US
                      payments:
                        authorizations:
                        - status: CREATED
                          id: 7X550106NA4440028
                          amount:
                            currency_code: USD
                            value: '100.00'
                          seller_protection:
                            status: ELIGIBLE
                            dispute_categories:
                            - UNAUTHORIZED_TRANSACTION
                          expiration_time: '2024-06-05T18:46:54Z'
                          links:
                          - href: https://api-m.paypal.com/v2/payments/authorizations/7X550106NA4440028
                            rel: self
                            method: GET
                          - href: https://api-m.paypal.com/v2/payments/authorizations/7X550106NA4440028/capture
                            rel: capture
                            method: POST
                          - href: https://api-m.paypal.com/v2/payments/authorizations/7X550106NA4440028/void
                            rel: void
                            method: POST
                          - href: https://api-m.paypal.com/v2/checkout/orders/8K832279M55989614
                            rel: up
                            method: GET
                          create_time: '2024-05-07T18:46:54Z'
                          update_time: '2024-05-07T18:46:54Z'
                    payer:
                      name:
                        given_name: Tom
                        surname: Business
                      email_address: buyer@paypal.com
                      payer_id: XQHSN372NGSP2
                      phone:
                        phone_number:
                          national_number: '8127081430'
                      address:
                        country_code: US
                    create_time: '2024-05-07T18:46:15Z'
                    update_time: '2024-05-07T18:46:54Z'
                    links:
                    - href: https://api-m.paypal.com/v2/checkout/orders/8K832279M55989614
                      rel: self
                      method: GET
                orders_create_create_orders_with_shipping_type_pickup_in_store:
                  summary: Create Order - Buy Online Pickup In Store Shipping Type
                  description: Creates an order with minimal parameters and contains the Buy Online Pickup
                    in Store-related fields.
                  value:
                    id: 4SP74185RW2405200
                    purchase_units:
                    - reference_id: PUHF
                      amount:
                        currency_code: USD
                        value: '50.00'
                      payee:
                        email_address: merchant@example.com
                      shipping:
                        address:
                          address_line_1: 123 Townsend St
                          address_line_2: Floor 6
                          admin_area_2: San Francisco
                          admin_area_1: CA
                          postal_code: '94107'
                          country_code: US
                        type: PICKUP_IN_STORE
                    links:
                    - href: https://api-m.paypal.com/v2/checkout/orders/4SP74185RW2405200
                      rel: self
                      method: GET
                    - href: https://www.paypal.com/checkoutnow?token=4SP74185RW2405200
                      rel: approve
                      method: GET
                    - href: https://api-m.paypal.com/v2/checkout/orders/4SP74185RW2405200
                      rel: edit
                      method: PATCH
                    - href: https://api-m.paypal.com/v2/checkout/orders/4SP74185RW2405200/authorize
                      rel: authorize
                      method: POST
                orders_create_simple:
                  summary: Create Order - Minimal Request and Response
                  description: Creates an order with only required parameters. By default, uses the minimal
                    representation.
                  value:
                    id: 5O190127TN364715T
                    links:
                    - href: https://api-m.paypal.com/v2/checkout/orders/5O190127TN364715T
                      rel: self
                      method: GET
                    - href: https://www.paypal.com/checkoutnow?token=5O190127TN364715T
                      rel: approve
                      method: GET
                    - href: https://api-m.paypal.com/v2/checkout/orders/5O190127TN364715T
                      rel: edit
                      method: PATCH
                    - href: https://api-m.paypal.com/v2/checkout/orders/5O190127TN364715T/capture
                      rel: capture
                      method: POST
        '202':
          description: The request has been accepted for processing, but the processing has not been completed
            yet. The server returns the HTTP `202 Accepted` status code to indicate that the request is
            valid and will be handled asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order'
        '400':
          description: Request is not well-formed, syntactically incorrect, or violates schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                create_400_bad_request:
                  summary: Create Order - 400 Bad Request Error - Purchase Unit is Empty
                  description: This code sample attempts to create an order with empty purchase units.
                    The request fails.
                  value:
                    name: INVALID_REQUEST
                    message: Request is not well-formed, syntactically incorrect, or violates schema.
                    debug_id: 10398537340c8
                    details:
                    - field: /purchase_units
                      value: '[]'
                      location: body
                      issue: INVALID_ARRAY_MIN_ITEMS
                      description: The number of items in an array parameter is too small.
                    links:
                    - href: https://developer.paypal.com/api/orders/v2/#error-INVALID_ARRAY_MIN_ITEMS
                      rel: information_link
        '401':
          $ref: '#/components/responses/401_error_response'
        '403':
          $ref: '#/components/responses/403_error_response'
        '422':
          description: The requested action could not be performed, semantically incorrect, or failed
            business validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                create_422_unprocessable_entity_missing_pickup_address:
                  summary: Create Order - 422 Unprocessable Entity Error - Missing Pickup Address
                  description: 'This code sample attempts to create an order but the shipping address
                    is required and `shipping.type` is set to PICKUP_FROM_PERSON '
                  value:
                    name: UNPROCESSABLE_ENTITY
                    details:
                    - field: /purchase_units/@reference_id=='PUHF'/shipping/address
                      issue: MISSING_SHIPPING_ADDRESS
                      description: The shipping address is required when `shipping_preference=SET_PROVIDED_ADDRESS`.
                    message: The requested action could not be performed, semantically incorrect, or failed
                      business validation.
                    debug_id: f200264a4e02a
                    links:
                    - href: https://developer.paypal.com/api/rest/reference/orders/v2/errors/#MISSING_SHIPPING_ADDRESS
                      rel: information_link
                      method: GET
        '500':
          $ref: '#/components/responses/500_error_response'
        default:
          $ref: '#/components/responses/default_response'
      x-exampleFlows:
      - title: Create Order - PayPal Wallet as Payment Source, Resulting in PAYER_ACTION_REQUIRED Response
        description: Creates a new order. API caller receives payer-action link.
        parameter_examples:
        - parameters/@name=='PayPal-Request-Id'/examples/00_orders_create
        - parameters/@name=='Authorization'/examples/bearer
        request_body_example: requestBody/content/application~1json/examples/00_orders_create
        response_example: responses/200/content/application~1json/examples/00_orders_create
      - title: Create and authorize an order for a PayPal wallet vaulted account holder passing a usage
          pattern indicator using stored credentials (Single Shot).
        description: Creates an order and authorizes payment with a PayPal wallet vault id as the payment
          source and a usage pattern (billing indicator) RECURRING_PREPAID passed using stored credentials.
        parameter_examples:
        - parameters/@name=='PayPal-Request-Id'/examples/orders_create_authorize_single_step_paypal_with_vault_id_and_stored_credentials_usage_pattern
        - parameters/@name=='Authorization'/examples/bearer
        request_body_example: requestBody/content/application~1json/examples/orders_create_authorize_single_step_paypal_with_vault_id_and_stored_credentials_usage_pattern
        response_example: responses/201/content/application~1json/examples/orders_create_authorize_single_step_paypal_with_vault_id_and_stored_credentials_usage_pattern
      - title: Create Order - Minimal Request and Response
        description: Creates an order with only required parameters. By default, uses the minimal representation.
        parameter_examples:
        - parameters/@name=='Authorization'/examples/bearer
        request_body_example: requestBody/content/application~1json/examples/orders_create_simple
        response_example: responses/201/content/application~1json/examples/orders_create_simple
      - title: Create Order - Buy Online Pickup In Store Shipping Type
        description: Creates an order with minimal parameters and contains the Buy Online Pickup in Store-related
          fields.
        parameter_examples:
        - parameters/@name=='Authorization'/examples/bearer
        - parameters/@name=='Prefer'/examples/orders_create_create_orders_with_shipping_type_pickup_in_store
        request_body_example: requestBody/content/application~1json/examples/orders_create_create_orders_with_shipping_type_pickup_in_store
        response_example: responses/201/content/application~1json/examples/orders_create_create_orders_with_shipping_type_pickup_in_store
      - title: Create Order - 400 Bad Request Error - Purchase Unit is Empty
        description: This code sample attempts to create an order with empty purchase units. The request
          fails.
        parameter_examples:
        - parameters/@name=='Authorization'/examples/bearer
        - parameters/@name=='Prefer'/examples/orders_create_create_order_mixed_cart_with_shipping_options_bwp_unknown_status
        response_example: responses/400/content/application~1json/examples/create_400_bad_request
      - title: Create Order - 422 Unprocessable Entity Error - Missing Pickup Address
        description: 'This code sample attempts to create an order but the shipping address is required
          and `shipping.type` is set to PICKUP_FROM_PERSON '
        parameter_examples:
        - parameters/@name=='Authorization'/examples/bearer
        request_body_example: requestBody/content/application~1json/examples/create_422_unprocessable_entity_missing_pickup_address
        response_example: responses/422/content/application~1json/examples/create_422_unprocessable_entity_missing_pickup_address
  /v2/checkout/orders/{id}:
    get:
      operationId: orders.get
      summary: Show order details
      description: Shows details for an order, by ID.<blockquote><strong>Note:</strong> For error handling
        and troubleshooting, see <a href="https://developer.paypal.com/api/rest/reference/orders/v2/errors/#get-order">Orders
        v2 errors</a>.</blockquote>
      tags:
      - orders
      security:
      - Oauth2:
        - https://uri.paypal.com/services/payments/payment
        - https://uri.paypal.com/services/payments/orders/deprecating-jssdk-migration-for-limited-merchants
      parameters:
      - name: id
        description: The ID of the order for which to show details.
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 36
          pattern: ^[A-Z0-9]+$
        examples:
          00_orders_get:
            summary: Get Order - Show Order Details After Customer Approval
            description: Shows order details immediately after customer approval.
            value: 5O190127TN364715T
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/paypal_auth_assertion'
      - name: fields
        description: A comma-separated list of fields that should be returned for the order. Valid filter
          field is `payment_source`.
        in: query
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[a-z_]*$
      responses:
        '200':
          description: A successful request returns the HTTP `200 OK` status code and a JSON response
            body that shows order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order'
              examples:
                00_orders_get:
                  summary: Get Order - Show Order Details After Customer Approval
                  description: Shows order details immediately after customer approval.
                  value:
                    id: 5O190127TN364715T
                    payment_source:
                      paypal:
                        name:
                          given_name: John
                          surname: Doe
                        email_address: customer@example.com
                        account_id: QYR5Z8XDVJNXQ
                    purchase_units:
                    - reference_id: d9f80740-38f0-11e8-b467-0ed5f89f718b
                      amount:
                        currency_code: USD
                        value: '100.00'
                    payer:
                      name:
                        given_name: John
                        surname: Doe
                      email_address: customer@example.com
                      payer_id: QYR5Z8XDVJNXQ
                    create_time: '2018-04-01T21:18:49Z'
                    links:
                    - href: https://api-m.paypal.com/v2/checkout/orders/5O190127TN364715T
                      rel: self
                      method: GET
                    - href: https://www.paypal.com/checkoutnow?token=5O190127TN364715T
                      rel: approve
                      method: GET
                    - href: https://api-m.paypal.com/v2/checkout/orders/5O190127TN364715T
                      rel: edit
                      method: PATCH
                    - href: https://api-m.paypal.com/v2/checkout/orders/5O190127TN364715T/capture
                      rel: capture
                      method: POST
        '401':
          $ref: '#/components/responses/401_error_response'
        '403':
          $ref: '#/components/responses/403_error_response'
        '404':
          $ref: '#/components/responses/404_error_response'
        '500':
          $ref: '#/components/responses/500_error_response'
        default:
          $ref: '#/components/responses/default_response'
      x-exampleFlows:
      - title: Get Order - Show Order Details After Customer Approval
        description: Shows order details immediately after customer approval.
        parameter_examples:
        - parameters/@name=='id'/examples/00_orders_get
        - parameters/@name=='Authorization'/examples/bearer
        response_example: responses/200/content/application~1json/examples/00_orders_get
      - title: Get Order - 404 Not Found Error - Order Not Found
        description: This code sample attempts to show details for an order, by ID, but the request fails
          because the order is not found.
        parameter_examples:
        - parameters/@name=='id'/examples/00_orders_get
        response_example: responses/404/content/application~1json/examples/generic
  /v2/checkout/orders/{id}/capture:
    post:
      operationId: orders.capture
      summary: Capture payment for order
      description: Captures payment for an order. To successfully capture payment for an order, the buyer
        must first approve the order or a valid payment_source must be provided in the request. A buyer
        can approve the order upon being redirected to the rel:approve URL that was returned in the HATEOAS
        links in the create order response.<blockquote><strong>Note:</strong> For error handling and troubleshooting,
        see <a href="https://developer.paypal.com/api/rest/reference/orders/v2/errors/#capture-order">Orders
        v2 errors</a>.</blockquote>
      tags:
      - orders
      security:
      - Oauth2:
        - https://uri.paypal.com/services/payments/payment
        - https://uri.paypal.com/services/payments/orders/deprecating-jssdk-migration-for-limited-merchants
      parameters:
      - name: PayPal-Request-Id
        description: The server stores keys for 6 hours. The API callers can request the times to up to
          72 hours by speaking to their Account Manager. It is mandatory for all single-step create order
          calls (E.g. Create Order Request with payment source information like Card, PayPal.vault_id,
