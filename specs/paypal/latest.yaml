      type: object
      properties:
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code'
          - description: The two-character ISO 3166-1 purchase country code.
        name:
          allOf:
          - $ref: '#/components/schemas/crypto_account_holder_name'
          - description: The name of the account holder associated with Crypto wallet.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base'
          - description: Customizes the payer experience during the approval process for the payment.
            not:
              anyOf:
              - required:
                - brand_name
              - required:
                - shipping_preference
    crypto_account_holder_name:
      title: crypto_account_holder_name
      description: Crypto account holder name.
      type: object
      required:
      - given_name
      - surname
      properties:
        prefix:
          description: The prefix, or title, to the account holder's name.
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[\S\s]*$
        given_name:
          description: When the account holder is a person, the account holder's given, or first, name.
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[\S\s]*$
        surname:
          description: When the account holder is a person, the account holder's surname or family name.
            Also known as the last name. Required when the account holder is a person. Use also to store
            multiple surnames including the matronymic, or mother's, surname.
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[\S\s]*$
        middle_name:
          description: When the account holder is a person, the account holder's middle name. Use also
            to store multiple middle names including the patronymic, or father's, middle name.
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[\S\s]*$
    crypto_request:
      title: crypto_request
      description: Crypto payment used to fund the transaction.
      type: object
      required:
      - country_code
      - experience_context
      - name
      properties:
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code'
          - description: The two-character ISO 3166-1 purchase country code.
        name:
          allOf:
          - $ref: '#/components/schemas/crypto_account_holder_name'
          - description: The name of the account holder associated with Crypto wallet.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base_without_brand_shipping'
          - description: Customizes the payer experience during the approval process for the payment.
    currency_code:
      description: The [three-character ISO-4217 currency code](/api/rest/reference/currency-codes/) that
        identifies the currency.
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[\S\s]*$
    customer:
      title: customer
      description: This object represents a merchant’s customer, allowing them to store contact details,
        and track all payments associated with the same customer.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/merchant_partner_customer_id'
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: Email address of the customer as provided to the merchant or on file with the
              merchant. Email Address is required if you are processing the transaction using PayPal Guest
              Processing which is offered to select partners and merchants.
        phone:
          allOf:
          - $ref: '#/components/schemas/phone_with_type'
          - description: The phone number of the customer as provided to the merchant or on file with
              the merchant. The `phone.phone_number` supports only `national_number`.
        name:
          allOf:
          - $ref: '#/components/schemas/name'
          - description: The full name of the customer as provided to the merchant or on file with the
              merchant.
            not:
              anyOf:
              - required:
                - prefix
              - required:
                - middle_name
              - required:
                - suffix
              - required:
                - alternate_full_name
              - required:
                - full_name
    date_no_time:
      description: The stand-alone date, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
        To represent special legal values, such as a date of birth, you should use dates with no associated
        time or time-zone data. Whenever possible, use the standard `date_time` type. This regular expression
        does not validate all dates. For example, February 31 is valid and nothing is known about leap
        years.
      type: string
      minLength: 10
      maxLength: 10
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])$
    date_time:
      description: The date and time, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
        Seconds are required while fractional seconds are optional.<blockquote><strong>Note:</strong>
        The regular expression provides guidance but does not reject all invalid dates.</blockquote>
      type: string
      minLength: 20
      maxLength: 64
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])[T,t]([0-1][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$
    date_year_month:
      description: The year and month, in ISO-8601 `YYYY-MM` date format. See [Internet date and time
        format](https://tools.ietf.org/html/rfc3339#section-5.6).
      type: string
      minLength: 7
      maxLength: 7
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    disbursement_mode:
      title: disbursement_mode
      description: The funds that are held on behalf of the merchant.
      type: string
      enum:
      - INSTANT
      - DELAYED
      default: INSTANT
    discount_with_breakdown:
      title: discount_with_breakdown
      description: The discount amount and currency code. For list of supported currencies and decimal
        precision, see the PayPal REST APIs <a href="/docs/integration/direct/rest/currency-codes/">Currency
        Codes</a>.
      type: object
      allOf:
      - $ref: '#/components/schemas/money'
      - type: object
    eci_flag:
      description: Electronic Commerce Indicator (ECI). The ECI value is part of the 2 data elements that
        indicate the transaction was processed electronically. This should be passed on the authorization
        transaction to the Gateway/Processor.
      type: string
      enum:
      - MASTERCARD_NON_3D_SECURE_TRANSACTION
      - MASTERCARD_ATTEMPTED_AUTHENTICATION_TRANSACTION
      - MASTERCARD_FULLY_AUTHENTICATED_TRANSACTION
      - FULLY_AUTHENTICATED_TRANSACTION
      - ATTEMPTED_AUTHENTICATION_TRANSACTION
      - NON_3D_SECURE_TRANSACTION
    email:
      title: email
      description: The internationalized email address.<blockquote><strong>Note:</strong> Up to 64 characters
        are allowed before and 255 characters are allowed after the <code>@</code> sign. However, the
        generally accepted maximum length for an email address is 254 characters. The pattern verifies
        that an unquoted <code>@</code> sign exists.</blockquote>
      type: string
      minLength: 3
      maxLength: 254
      pattern: ^.*(?:[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*|(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?|\[(?:(?:(2(5[0-5]|[0-4][0-9])|1[0-9][0-9]|[1-9]?[0-9]))\.){3}(?:(2(5[0-5]|[0-4][0-9])|1[0-9][0-9]|[1-9]?[0-9])|[a-zA-Z0-9-]*[a-zA-Z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\]).*$
    email_address:
      description: The internationalized email address.<blockquote><strong>Note:</strong> Up to 64 characters
        are allowed before and 255 characters are allowed after the <code>@</code> sign. However, the
        generally accepted maximum length for an email address is 254 characters. The pattern verifies
        that an unquoted <code>@</code> sign exists.</blockquote>
      type: string
      minLength: 3
      maxLength: 254
      pattern: ^(?:[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[A-Za-z0-9-]*[A-Za-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
    enrolled:
      description: Status of Authentication eligibility.
      type: string
      enum:
      - Y
      - N
      - U
      - B
    eps:
      title: eps
      description: Information used to pay using eps.
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        bic:
          allOf:
          - $ref: '#/components/schemas/bic'
          - description: The bank identification code (BIC).
    eps_request:
      title: eps_request
      description: Information needed to pay using eps.
      type: object
      required:
      - country_code
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base'
          - description: Customizes the payer experience during the approval process for the payment.
    error:
      title: Error
      description: The error details.
      type: object
      required:
      - debug_id
      - message
      - name
      properties:
        name:
          description: The human-readable, unique name of the error.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
        message:
          description: The message that describes the error.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
        debug_id:
          description: The PayPal internal ID. Used for correlation purposes.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
        details:
          description: An array of additional details about the error.
          type: array
          minItems: 0
          maxItems: 32767
          items:
            allOf:
            - $ref: '#/components/schemas/error_details'
            - title: error_details
        links:
          description: An array of request-related [HATEOAS links](/api/rest/responses/#hateoas-links).
          type: array
          minItems: 0
          maxItems: 32767
          readOnly: true
          items:
            allOf:
            - $ref: '#/components/schemas/link_description'
            - title: link_description
              readOnly: true
    error_details:
      title: Error Details
      description: The error details. Required for client-side `4XX` errors.
      type: object
      required:
      - issue
      properties:
        field:
          description: The field that caused the error. If this field is in the body, set this value to
            the field's JSON pointer value. Required for client-side errors.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
        value:
          description: The value of the field that caused the error.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
        location:
          description: The location of the field that caused the error. Value is `body`, `path`, or `query`.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
          default: body
        issue:
          description: The unique, fine-grained application-level error code.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
        links:
          description: An array of request-related [HATEOAS links](/api/rest/responses/#hateoas-links)
            that are either relevant to the issue by providing additional information or offering potential
            resolutions.
          type: array
          minItems: 1
          maxItems: 4
          readOnly: true
          items:
            allOf:
            - $ref: '#/components/schemas/link_description'
            - title: link_description
              readOnly: true
        description:
          description: The human-readable description for an issue. The description can change over the
            lifetime of an API, so clients must not depend on this value.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
    exchange_rate:
      title: exchange_rate
      description: The exchange rate that determines the amount to convert from one currency to another
        currency.
      type: object
      readOnly: true
      properties:
        source_currency:
          allOf:
          - $ref: '#/components/schemas/currency_code'
          - description: The source currency from which to convert an amount.
        target_currency:
          allOf:
          - $ref: '#/components/schemas/currency_code'
          - description: The target currency to which to convert an amount.
        value:
          description: The target currency amount. Equivalent to one unit of the source currency. Formatted
            as integer or decimal value with one to 15 digits to the right of the decimal point.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^[\S\s]*$
    experience_context_base:
      title: experience_context_base
      description: Customizes the payer experience during the approval process for the payment.
      type: object
      properties:
        brand_name:
          description: The label that overrides the business name in the PayPal account on the PayPal
            site. The pattern is defined by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^.*$
        locale:
          allOf:
          - $ref: '#/components/schemas/language'
          - description: The BCP 47-formatted locale of pages that the PayPal payment experience shows.
              PayPal supports a five-character code. For example, `da-DK`, `he-IL`, `id-ID`, `ja-JP`,
              `no-NO`, `pt-BR`, `ru-RU`, `sv-SE`, `th-TH`, `zh-CN`, `zh-HK`, or `zh-TW`.
        shipping_preference:
          description: The location from which the shipping address is derived.
          type: string
          enum:
          - GET_FROM_FILE
          - NO_SHIPPING
          - SET_PROVIDED_ADDRESS
          default: GET_FROM_FILE
        return_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer is redirected after the customer approves the payment.
            format: uri
        cancel_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer is redirected after the customer cancels the payment.
            format: uri
    experience_context_base_without_brand_shipping:
      title: experience_context_base
      description: Customizes the payer experience during the approval process for the payment.
      type: object
      required:
      - cancel_url
      - return_url
      properties:
        locale:
          allOf:
          - $ref: '#/components/schemas/language'
          - description: The BCP 47-formatted locale of pages that the PayPal payment experience shows.
              PayPal supports a five-character code. For example, `da-DK`, `he-IL`, `id-ID`, `ja-JP`,
              `no-NO`, `pt-BR`, `ru-RU`, `sv-SE`, `th-TH`, `zh-CN`, `zh-HK`, or `zh-TW`.
        return_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer is redirected after the customer approves the payment.
            format: uri
        cancel_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer is redirected after the customer cancels the payment.
            format: uri
    full_name:
