      minLength: 2
      maxLength: 10
      pattern: ^[a-z]{2}(?:-[A-Z][a-z]{3})?(?:-(?:[A-Z]{2}|[0-9]{3}))?$
    level_2_card_processing_data:
      title: level_2
      description: The level 2 card processing data collections. If your merchant account has been configured
        for Level 2 processing this field will be passed to the processor on your behalf. Please contact
        your PayPal Technical Account Manager to define level 2 data for your business.
      type: object
      properties:
        invoice_id:
          description: Use this field to pass a purchase identification value of up to 127 ASCII characters.
            The length of this field will be adjusted to meet network specifications (25chars for Visa
            and Mastercard, 17chars for Amex), and the original invoice ID will still be displayed in
            your existing reports.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[\w‘\-.,":;\!?]*$
        tax_total:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: "Use this field to break down the amount of tax included in the total purchase\
              \ amount. The value provided here will not add to the total purchase amount. The value can't\
              \ be negative, and in most cases, it must be greater than zero in order to qualify for lower\
              \ interchange rates. \n Value, by country, is:\n\n    UK. A county.\n    US. A state.\n\
              \    Canada. A province.\n    Japan. A prefecture.\n    Switzerland. A kanton.\n"
    level_3_card_processing_data:
      title: level_3
      description: The level 3 card processing data collections, If your merchant account has been configured
        for Level 3 processing this field will be passed to the processor on your behalf. Please contact
        your PayPal Technical Account Manager to define level 3 data for your business.
      type: object
      properties:
        shipping_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: Use this field to break down the shipping cost included in the total purchase
              amount. The value provided here will not add to the total purchase amount. The value cannot
              be negative.
        duty_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: Use this field to break down the duty amount included in the total purchase amount.
              The value provided here will not add to the total purchase amount. The value cannot be negative.
        discount_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: Use this field to break down the discount amount included in the total purchase
              amount. The value provided here will not add to the total purchase amount. The value cannot
              be negative.
        shipping_address:
          allOf:
          - $ref: '#/components/schemas/address_portable'
          - description: The address of the person to whom to ship the items. Supports only the `address_line_1`,
              `address_line_2`, `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties.
            not:
              anyOf:
              - required:
                - address_line_3
              - required:
                - admin_area_3
              - required:
                - admin_area_4
              - required:
                - address_details
        ships_from_postal_code:
          description: Use this field to specify the postal code of the shipping location.
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[a-zA-Z0-9_'.-]*$
        line_items:
          description: A list of the items that were purchased with this payment. If your merchant account
            has been configured for Level 3 processing this field will be passed to the processor on your
            behalf.
          type: array
          minItems: 1
          maxItems: 100
          items:
            allOf:
            - $ref: '#/components/schemas/line_item'
            - title: line_item
