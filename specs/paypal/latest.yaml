    purchase_unit:
      title: Purchase Unit
      description: The purchase unit details. Used to capture required information for the payment contract.
      type: object
      properties:
        reference_id:
          description: The API caller-provided external ID for the purchase unit. Required for multiple
            purchase units when you must update the order through `PATCH`. If you omit this value and
            the order contains only one purchase unit, PayPal sets this value to `default`. <blockquote><strong>Note:</strong>
            If there are multiple purchase units, <code>reference_id</code> is required for each purchase
            unit.</blockquote>
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[\S\s]*$
        amount:
          $ref: '#/components/schemas/amount_with_breakdown'
        payee:
          allOf:
          - $ref: '#/components/schemas/payee'
          - description: The merchant who receives payment for this transaction.
        payment_instruction:
          $ref: '#/components/schemas/payment_instruction'
        description:
          description: The purchase description.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[\S\s]*$
        custom_id:
          description: The API caller-provided external ID. Used to reconcile API caller-initiated transactions
            with PayPal transactions. Appears in transaction and settlement reports.
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\S\s]*$
        invoice_id:
          description: The API caller-provided external invoice ID for this order.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[\S\s]*$
        id:
          description: The PayPal-generated ID for the purchase unit. This ID appears in both the payer's
            transaction history and the emails that the payer receives. In addition, this ID is available
            in transaction and settlement reports that merchants and API callers can use to reconcile
            transactions. This ID is only available when an order is saved by calling <code>v2/checkout/orders/id/save</code>.
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[\S\s]*$
        soft_descriptor:
          description: The payment descriptor on account transactions on the customer's credit card statement,
            that PayPal sends to processors. The maximum length of the soft descriptor information that
            you can pass in the API field is 22 characters, in the following format:<code>22 - len(PAYPAL
            * (8)) - len(<var>Descriptor in Payment Receiving Preferences of Merchant account</var> +
            1)</code>The PAYPAL prefix uses 8 characters.<br/><br/>The soft descriptor supports the following
            ASCII characters:<ul><li>Alphanumeric characters</li><li>Dashes</li><li>Asterisks</li><li>Periods
            (.)</li><li>Spaces</li></ul>For Wallet payments marketplace integrations:<ul><li>The merchant
            descriptor in the Payment Receiving Preferences must be the marketplace name.</li><li>You
            can't use the remaining space to show the customer service number.</li><li>The remaining spaces
            can be a combination of seller name and country.</li></ul><br/>For unbranded payments (Direct
            Card) marketplace integrations, use a combination of the seller name and phone number.
          type: string
          minLength: 1
          maxLength: 22
          pattern: ^[\S\s]*$
        items:
          description: An array of items that the customer purchases from the merchant.
          type: array
          minItems: 0
          maxItems: 32767
          items:
            allOf:
            - $ref: '#/components/schemas/item'
            - title: item
              description: An item.
        shipping:
          allOf:
          - $ref: '#/components/schemas/shipping_with_tracking_details'
          - description: The shipping address and method.
        supplementary_data:
          allOf:
          - $ref: '#/components/schemas/supplementary_data'
          - description: Supplementary data about this payment. Merchants and partners can add Level 2
              and 3 data to payments to reduce risk and payment processing costs. For more information
              about processing payments, see <a href="https://developer.paypal.com/docs/checkout/advanced/processing/">checkout</a>
              or <a href="https://developer.paypal.com/docs/multiparty/checkout/advanced/processing/">multiparty
              checkout</a>.
        payments:
          allOf:
          - $ref: '#/components/schemas/payment_collection'
          - description: The comprehensive history of payments for the purchase unit.
            readOnly: true
    purchase_unit_request:
      title: Purchase Unit Request
      description: The purchase unit request. Includes required information for the payment contract.
      type: object
      required:
      - amount
      properties:
        reference_id:
          description: The API caller-provided external ID for the purchase unit. Required for multiple
            purchase units when you must update the order through `PATCH`. If you omit this value and
            the order contains only one purchase unit, PayPal sets this value to `default`.
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[\S\s]*$
        amount:
          allOf:
          - $ref: '#/components/schemas/amount_with_breakdown'
          - description: The total order amount with an optional breakdown that provides details, such
              as the total item amount, total tax amount, shipping, handling, insurance, and discounts,
              if any.<br/>If you specify `amount.breakdown`, the amount equals `item_total` plus `tax_total`
              plus `shipping` plus `handling` plus `insurance` minus `shipping_discount` minus discount.<br/>The
              amount must be a positive number. The `amount.value` field supports up to 15 digits preceding
              the decimal. For a list of supported currencies, decimal precision, and maximum charge amount,
              see the PayPal REST APIs <a href="https://developer.paypal.com/api/rest/reference/currency-codes/">Currency
              Codes</a>.
        payee:
          allOf:
          - $ref: '#/components/schemas/payee'
          - description: The merchant who receives payment for this transaction.
        payment_instruction:
          $ref: '#/components/schemas/payment_instruction'
        description:
          description: <blockquote>This field supports up to 3,000 characters, but <strong>any content
            beyond 127 characters (including spaces) will be truncated. The 127 character limit is reflected
            in the response</strong> representation of this field.</blockquote>The purchase description.
            The maximum length of the character is dependent on the type of characters used. The character
            length is specified assuming a US ASCII character. Depending on type of character; (e.g. accented
            character, Japanese characters) the number of characters that that can be specified as input
            might not equal the permissible max length.
          type: string
          minLength: 1
          maxLength: 3000
          pattern: ^[\S\s]*$
        custom_id:
          description: The API caller-provided external ID. Used to reconcile client transactions with
            PayPal transactions. Appears in transaction and settlement reports but is not visible to the
            payer.
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\S\s]*$
        invoice_id:
          description: The API caller-provided external invoice number for this order. Appears in both
            the payer's transaction history and the emails that the payer receives. invoice_id values
            are required to be unique within each merchant account by default. Although the uniqueness
            validation is configurable, disabling this behavior will remove the account's ability to use
            invoice_id in other APIs as an identifier. It is highly recommended to keep a unique invoice_id
            for each Order.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[\S\s]*$
        soft_descriptor:
          description: '<blockquote>This field supports up to 127 characters, but <strong>any content
            beyond 22 characters (including spaces) will be truncated. The 22 character limit is reflected
            in the response</strong> representation of this field.</blockquote>The soft descriptor is
            the dynamic text used to construct the statement descriptor that appears on a payer''s card
            statement.<br><br>If an Order is paid using the "PayPal Wallet", the statement descriptor
            will appear in following format on the payer''s card statement: <code><var>PAYPAL_prefix</var>+(space)+<var>merchant_descriptor</var>+(space)+
            <var>soft_descriptor</var></code><blockquote><strong>Note:</strong> The merchant descriptor
            is the descriptor of the merchant’s payment receiving preferences which can be seen by logging
            into the merchant account https://www.sandbox.paypal.com/businessprofile/settings/info/edit</blockquote>The
            <code>PAYPAL</code> prefix uses 8 characters. Only the first 22 characters will be displayed
            in the statement. <br>For example, if:<ul><li>The PayPal prefix toggle is <code>PAYPAL *</code>.</li><li>The
            merchant descriptor in the profile is <code>Janes Gift</code>.</li><li>The soft descriptor
            is <code>800-123-1234</code>.</li></ul>Then, the statement descriptor on the card is <code>PAYPAL
            * Janes Gift 80</code>.'
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^[\S\s]*$
        items:
          description: An array of items that the customer purchases from the merchant.
          type: array
          minItems: 0
          maxItems: 32767
          items:
            allOf:
            - $ref: '#/components/schemas/item_request'
            - title: item
              description: The item.
        shipping:
          allOf:
          - $ref: '#/components/schemas/shipping_detail'
          - description: The name and address of the person to whom to ship the items.
        supplementary_data:
          allOf:
          - $ref: '#/components/schemas/supplementary_data'
          - description: Contains Supplementary Data.
    refund:
      title: refund
      description: The refund information.
      type: object
      allOf:
      - allOf:
        - $ref: '#/components/schemas/refund_status'
      - title: Refund Properties
        description: The detailed properties of the refund transaction, including identifiers, amounts,
          breakdowns, and associated metadata.
        type: object
        properties:
          id:
            description: The PayPal-generated ID for the refund.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          amount:
            allOf:
            - $ref: '#/components/schemas/money'
            - description: The amount that the payee refunded to the payer.
              readOnly: true
          invoice_id:
            description: The API caller-provided external invoice number for this order. Appears in both
              the payer's transaction history and the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          custom_id:
            description: The API caller-provided external ID. Used to reconcile API caller-initiated transactions
              with PayPal transactions. Appears in transaction and settlement reports.
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[A-Za-z0-9-_.,]*$
          acquirer_reference_number:
            description: Reference ID issued for the card transaction. This ID can be used to track the
              transaction across processors, card brands and issuing banks.
            type: string
            minLength: 1
            maxLength: 36
            pattern: ^[a-zA-Z0-9]+$
          note_to_payer:
            description: The reason for the refund. Appears in both the payer's transaction history and
              the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          seller_payable_breakdown:
            title: Seller Payable Breakdown
            description: The breakdown of the refund.
            type: object
            readOnly: true
            properties:
              gross_amount:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The amount that the payee refunded to the payer.
                  readOnly: true
              paypal_fee:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The PayPal fee that was refunded to the payer in the currency of the transaction.
                    This fee might not match the PayPal fee that the payee paid when the payment was captured.
                  readOnly: true
              paypal_fee_in_receivable_currency:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The PayPal fee that was refunded to the payer in the receivable currency.
                    Returned only in cases when the receivable currency is different from transaction
                    currency. Example 'CNY'.
                  readOnly: true
              net_amount:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The net amount that the payee's account is debited in the transaction currency.
                    The net amount is calculated as <code>gross_amount</code> minus <code>paypal_fee</code>
                    minus <code>platform_fees</code>.
                  readOnly: true
              net_amount_in_receivable_currency:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The net amount that the payee's account is debited in the receivable currency.
                    Returned only in cases when the receivable currency is different from transaction
                    currency. Example 'CNY'.
                  readOnly: true
              platform_fees:
                description: An array of platform or partner fees, commissions, or brokerage fees for
                  the refund.
                type: array
                minItems: 0
                maxItems: 1
                items:
                  allOf:
                  - $ref: '#/components/schemas/platform_fee'
                  - title: platform_fee
              net_amount_breakdown:
                description: An array of breakdown values for the net amount. Returned when the currency
                  of the refund is different from the currency of the PayPal account where the payee holds
                  their funds.
                type: array
                minItems: 0
                maxItems: 32767
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/net_amount_breakdown_item'
                  - title: net_amount_breakdown_item
              total_refunded_amount:
                allOf:
                - $ref: '#/components/schemas/money'
                - description: The total amount refunded from the original capture to date. For example,
                    if a payer makes a $100 purchase and was refunded $20 a week ago and was refunded
                    $30 in this refund, the `gross_amount` is $30 for this refund and the `total_refunded_amount`
                    is $50.
          payer:
            allOf:
            - $ref: '#/components/schemas/payee_base'
            - description: The details associated with the merchant for this transaction.
              readOnly: true
          links:
            description: An array of related [HATEOAS links](/docs/api/reference/api-responses/#hateoas-links).
            type: array
            minItems: 0
            maxItems: 32767
            readOnly: true
            items:
              allOf:
              - $ref: '#/components/schemas/link_description-2'
              - title: link_description
      - allOf:
        - $ref: '#/components/schemas/activity_timestamps'
    refund_status:
      title: refund_status
      description: The refund status with details.
      type: object
      properties:
        status:
          title: Refund Status With Details
          description: The status of the refund.
          type: string
          enum:
          - CANCELLED
          - FAILED
          - PENDING
          - COMPLETED
          readOnly: true
        status_details:
          allOf:
          - $ref: '#/components/schemas/refund_status_details'
          - description: The details of the refund status.
            readOnly: true
    refund_status_details:
      title: refund_status_details
      description: The details of the refund status.
      type: object
      properties:
        reason:
          title: Refund Incomplete Reason
          description: The reason why the refund has the `PENDING` or `FAILED` status.
          type: string
          enum:
          - ECHECK
    risk_supplementary_data:
      title: risk_supplementary_data
      description: Additional information necessary to evaluate the risk profile of a transaction.
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/participant_metadata'
    seller_protection:
      title: seller_protection
      description: The level of protection offered as defined by [PayPal Seller Protection for Merchants](https://www.paypal.com/us/webapps/mpp/security/seller-protection).
      type: object
      properties:
        status:
          title: Seller Protection Status
          description: Indicates whether the transaction is eligible for seller protection. For information,
            see [PayPal Seller Protection for Merchants](https://www.paypal.com/us/webapps/mpp/security/seller-protection).
          type: string
          enum:
          - ELIGIBLE
          - PARTIALLY_ELIGIBLE
          - NOT_ELIGIBLE
          readOnly: true
        dispute_categories:
          description: An array of conditions that are covered for the transaction.
          type: array
          minItems: 0
          maxItems: 32767
          readOnly: true
          items:
            title: dispute_category
            description: The condition that is covered for the transaction.
            type: string
            enum:
            - ITEM_NOT_RECEIVED
            - UNAUTHORIZED_TRANSACTION
    seller_receivable_breakdown:
      title: Seller Receivable Breakdown
      description: The detailed breakdown of the capture activity. This is not available for transactions
        that are in pending state.
      type: object
      required:
      - gross_amount
      properties:
        gross_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The amount for this captured payment in the currency of the transaction.
        paypal_fee:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The applicable fee for this captured payment in the currency of the transaction.
        paypal_fee_in_receivable_currency:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The applicable fee for this captured payment in the receivable currency. Returned
              only in cases the fee is charged in the receivable currency. Example 'CNY'.
        net_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The net amount that the payee receives for this captured payment in their PayPal
              account. The net amount is computed as <code>gross_amount</code> minus the <code>paypal_fee</code>
              minus the <code>platform_fees</code>.
        receivable_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The net amount that is credited to the payee's PayPal account. Returned only
              when the currency of the captured payment is different from the currency of the PayPal account
              where the payee wants to credit the funds. The amount is computed as <code>net_amount</code>
              times <code>exchange_rate</code>.
        exchange_rate:
          allOf:
          - $ref: '#/components/schemas/exchange_rate'
          - description: The exchange rate that determines the amount that is credited to the payee's
              PayPal account. Returned when the currency of the captured payment is different from the
              currency of the PayPal account where the payee wants to credit the funds.
        platform_fees:
          description: An array of platform or partner fees, commissions, or brokerage fees that associated
            with the captured payment.
          type: array
          minItems: 0
          maxItems: 1
          items:
            allOf:
            - $ref: '#/components/schemas/platform_fee'
            - title: platform_fee
    shipping_detail:
      title: shipping_detail
      description: The shipping details.
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/name'
          - description: The name of the person to whom to ship the items. Supports only the `full_name`
              property.
            not:
              anyOf:
              - required:
                - prefix
              - required:
                - given_name
              - required:
                - surname
              - required:
                - middle_name
              - required:
                - suffix
              - required:
                - alternate_full_name
        email_address:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the recipient of the shipped items, which may belong to
              either the payer, or an alternate contact, for delivery.
        phone_number:
          allOf:
          - $ref: '#/components/schemas/phone'
          - description: The phone number of the recipient of the shipped items, which may belong to either
              the payer, or an alternate contact, for delivery. [Format - canonical international [E.164
              numbering plan](https://www.itu.int/rec/T-REC-E.164/en)]
            not:
              required:
              - extension_number
        type:
          title: Fulfillment Type
          description: A classification for the method of purchase fulfillment (e.g shipping, in-store
            pickup, etc). Either `type` or `options` may be present, but not both.
          type: string
          enum:
          - SHIPPING
          - PICKUP_IN_PERSON
          - PICKUP_IN_STORE
          - PICKUP_FROM_PERSON
          default: SHIPPING
        options:
          description: An array of shipping options that the payee or merchant offers to the payer to
            ship or pick up their items.
          type: array
          minItems: 0
          maxItems: 30
          items:
            allOf:
            - $ref: '#/components/schemas/shipping_option'
            - title: shipping_option
              description: The option that the payee or merchant offers to the payer to ship or pick up
                their items.
        address:
          allOf:
          - $ref: '#/components/schemas/address_portable'
          - description: The address of the person to whom to ship the items. Supports only the `address_line_1`,
              `address_line_2`, `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties.
              `admin_area_1` is required for addresses located in Argentina, Brazil, China, Canada, India,
              Indonesia, Japan, Mexico, Thailand, and the United States.
            not:
              anyOf:
              - required:
                - address_line_3
              - required:
                - admin_area_3
              - required:
                - admin_area_4
              - required:
                - address_details
    shipping_option:
      title: shipping_option
      description: The options that the payee or merchant offers to the payer to ship or pick up their
        items.
      type: object
      required:
      - id
      - label
      - selected
      properties:
        id:
          description: A unique ID that identifies a payer-selected shipping option.
          type: string
          minLength: 0
          maxLength: 127
          pattern: ^[\S\s]*$
        label:
          description: A description that the payer sees, which helps them choose an appropriate shipping
            option. For example, `Free Shipping`, `USPS Priority Shipping`, `Expédition prioritaire USPS`,
            or `USPS yōuxiān fā huò`. Localize this description to the payer's locale.
          type: string
          minLength: 0
          maxLength: 127
          pattern: ^[\S\s]*$
        type:
          allOf:
          - $ref: '#/components/schemas/shipping_type'
          - description: A classification for the method of purchase fulfillment.
        amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The shipping cost for the selected option.
        selected:
          description: If the API request sets `selected = true`, it represents the shipping option that
            the payee or merchant expects to be pre-selected for the payer when they first view the `shipping.options`
            in the PayPal Checkout experience. As part of the response if a `shipping.option` contains
            `selected=true`, it represents the shipping option that the payer selected during the course
            of checkout with PayPal. Only one `shipping.option` can be set to `selected=true`.
          type: boolean
    shipping_type:
      title: shipping_type
      description: A classification for the method of purchase fulfillment.
      type: string
      enum:
      - SHIPPING
      - PICKUP
      - PICKUP_IN_STORE
      - PICKUP_FROM_PERSON
      default: SHIPPING
    shipping_with_tracking_details:
      title: shipping_with_tracking_details
      description: The order shipping details.
      type: object
      allOf:
      - $ref: '#/components/schemas/shipping_detail'
      - type: object
        properties:
          phone_number:
            allOf:
            - $ref: '#/components/schemas/phone_with_national_required_and_country_code'
            - description: The phone number of the recipient of the shipped items, which may belong to
                either the payer, or an alternate contact, for delivery.
          trackers:
            description: An array of trackers for a transaction.
            type: array
            minItems: 0
            maxItems: 32767
            items:
              $ref: '#/components/schemas/tracker'
    single_use_token:
      title: single_use_token
      description: The PayPal-generated, short-lived, one-time-use token, used to communicate payment
        information to PayPal for transaction processing.
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[0-9a-zA-Z_-]+$
    sofort:
      title: sofort
      description: Information used to pay using Sofort.
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        bic:
          allOf:
          - $ref: '#/components/schemas/bic'
          - description: The bank identification code (BIC).
        iban_last_chars:
          $ref: '#/components/schemas/iban_last_chars'
    sofort_request:
      title: sofort_request
      description: Information needed to pay using Sofort.
      type: object
      required:
      - country_code
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base'
          - description: Customizes the payer experience during the approval process for the payment.
    standard_header_schema:
      title: Schema Object for standard headers
      description: Standard headers are generally less restrictive in structure due to historical precedent
        across browsers, etc. This is a common schema for use in defining most standard headers.
      type: string
      minLength: 1
      maxLength: 16000
      pattern: ^.*$
    store_in_vault_instruction:
      title: store_in_vault_instruction
      description: Defines how and when the payment source gets vaulted.
      type: string
      enum:
      - ON_SUCCESS
    stored_payment_source:
      title: stored_payment_source
      description: Provides additional details to process a payment using a `payment_source` that has
        been stored or is intended to be stored (also referred to as stored_credential or card-on-file).<br/>Parameter
        compatibility:<br/><ul><li>`payment_type=ONE_TIME` is compatible only with `payment_initiator=CUSTOMER`.</li><li>`usage=FIRST`
        is compatible only with `payment_initiator=CUSTOMER`.</li><li>`previous_transaction_reference`
        or `previous_network_transaction_reference` is compatible only with `payment_initiator=MERCHANT`.</li><li>Only
        one of the parameters - `previous_transaction_reference` and `previous_network_transaction_reference`
        - can be present in the request.</li></ul>
      type: object
      required:
      - payment_initiator
      - payment_type
      properties:
        payment_initiator:
          $ref: '#/components/schemas/payment_initiator'
        payment_type:
          $ref: '#/components/schemas/stored_payment_source_payment_type'
        usage:
          $ref: '#/components/schemas/stored_payment_source_usage_type'
        previous_network_transaction_reference:
          $ref: '#/components/schemas/network_transaction_reference'
    stored_payment_source_payment_type:
      title: stored_payment_source_payment_type
      description: Indicates the type of the stored payment_source payment.
      type: string
      enum:
      - ONE_TIME
      - RECURRING
      - UNSCHEDULED
    stored_payment_source_usage_type:
      title: stored_payment_source_usage_type
      description: Indicates if this is a `first` or `subsequent` payment using a stored payment source
        (also referred to as stored credential or card on file).
      type: string
      enum:
      - FIRST
      - SUBSEQUENT
      - DERIVED
      default: DERIVED
    supplementary_data:
      title: supplementary_data
      description: Supplementary data about a payment. This object passes information that can be used
        to improve risk assessments and processing costs, for example, by providing Level 2 and Level
        3 payment data.
      type: object
      properties:
        card:
          allOf:
          - $ref: '#/components/schemas/card_supplementary_data'
          - description: Merchants and partners can add Level 2 and 3 data to payments to reduce risk
              and payment processing costs. For more information about processing payments, see <a href="https://developer.paypal.com/docs/checkout/advanced/processing/">checkout</a>
              or <a href="https://developer.paypal.com/docs/multiparty/checkout/advanced/processing/">multiparty
              checkout</a>.
        risk:
          allOf:
          - $ref: '#/components/schemas/risk_supplementary_data'
          - description: Merchants and partners can add additional customer parameters that can help with
              better fraud protection and reduced risk for unbranded card payments.
    tax_info:
      title: tax_info
      description: The tax ID of the customer. The customer is also known as the payer. Both `tax_id`
        and `tax_id_type` are required.
      type: object
      required:
      - tax_id
      - tax_id_type
      properties:
        tax_id:
          description: The customer's tax ID value.
          type: string
          minLength: 1
          maxLength: 14
          pattern: ^.*([a-zA-Z0-9]).*$
        tax_id_type:
          description: The customer's tax ID type.
          type: string
          enum:
          - BR_CPF
          - BR_CNPJ
    three_d_secure_authentication_response:
      title: three_d_secure_authentication_response
      description: Results of 3D Secure Authentication.
      type: object
      properties:
        authentication_status:
          allOf:
          - $ref: '#/components/schemas/pares_status'
          - description: The outcome of the issuer's authentication.
        enrollment_status:
          allOf:
          - $ref: '#/components/schemas/enrolled'
          - description: Status of authentication eligibility.
    token:
      title: token
      description: The tokenized payment source to fund a payment.
      type: object
      required:
      - id
      - type
      properties:
        id:
          description: The PayPal-generated ID for the token.
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[0-9a-zA-Z_-]+$
        type:
          description: The tokenization method that generated the ID.
          type: string
          enum:
          - BILLING_AGREEMENT
    tracker:
      title: tracker
      description: The tracking response on creation of tracker.
      type: object
      allOf:
      - type: object
        properties:
          id:
            description: The tracker id.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          status:
            $ref: '#/components/schemas/tracker_status'
          items:
            description: An array of details of items in the shipment.
            type: array
            minItems: 0
            maxItems: 32767
            items:
              allOf:
              - $ref: '#/components/schemas/tracker_item'
              - title: tracker_item
                description: Items in a shipment.
          links:
            description: An array of request-related HATEOAS links.
            type: array
            minItems: 0
            maxItems: 32767
            readOnly: true
            items:
              allOf:
              - $ref: '#/components/schemas/link_description-2'
              - title: link_description
                description: A request-related [HATEOAS link](/api/rest/responses/#hateoas-links).
      - $ref: '#/components/schemas/activity_timestamps'
    tracker_item:
      title: tracker_item
      description: The details of the items in the shipment.
      type: object
      properties:
        name:
          description: The item name or title.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[\S\s]*$
        quantity:
          description: The item quantity. Must be a whole number.
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^[1-9][0-9]{0,9}$
        sku:
          description: The stock keeping unit (SKU) for the item. This can contain unicode characters.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[\S\s]*$
        url:
          description: The URL to the item being purchased. Visible to buyer and used in buyer experiences.
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        image_url:
          description: The URL of the item's image. File type and size restrictions apply. An image that
            violates these restrictions will not be honored.
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        upc:
          allOf:
          - $ref: '#/components/schemas/universal_product_code'
          - description: The Universal Product Code of the item.
    tracker_status:
      title: Tracker Status
      description: The status of the item shipment.
      type: string
      enum:
      - CANCELLED
      - SHIPPED
    trustly:
      title: trustly
      description: Information needed to pay using Trustly.
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        email:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with this payment method.
        bic:
          allOf:
          - $ref: '#/components/schemas/bic'
          - description: The bank identification code (BIC).
        iban_last_chars:
          $ref: '#/components/schemas/iban_last_chars'
    trustly_request:
      title: trustly_request
      description: Information needed to pay using Trustly.
      type: object
      required:
      - country_code
      - email
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        email:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with this payment method.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base'
          - description: Customizes the payer experience during the approval process for the payment.
    universal_product_code:
      title: universal_product_code
      description: The Universal Product Code of the item.
      type: object
      required:
      - code
      - type
      properties:
        type:
          title: Universal Product Code Type
          description: The Universal Product Code type.
          type: string
          enum:
          - UPC-A
          - UPC-B
          - UPC-C
          - UPC-D
          - UPC-E
          - UPC-2
          - UPC-5
        code:
          description: The UPC product code of the item.
          type: string
          minLength: 6
          maxLength: 17
          pattern: ^[0-9]{0,17}$
    url:
      description: Describes the URL.
      type: string
      minLength: 0
      maxLength: 2147483647
      format: uri
    v3_vault_instruction_base:
      title: v3_vault_instruction_base
      description: Base vaulting specification. The object can be extended for specific use cases within
        each payment_source that supports vaulting.
      type: object
      required:
      - store_in_vault
      properties:
        store_in_vault:
          $ref: '#/components/schemas/store_in_vault_instruction'
    vault_id:
      title: vault_id
      description: The PayPal-generated ID for the vaulted payment source. This ID should be stored on
        the merchant's server so the saved payment source can be used for future transactions.
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[0-9a-zA-Z_-]+$
    vault_instruction_base:
      title: vault_instruction_base
      description: Basic vault instruction specification that can be extended by specific payment sources
        that supports vaulting.
      type: object
      properties:
        store_in_vault:
          $ref: '#/components/schemas/store_in_vault_instruction'
    vault_paypal_wallet_base:
      title: vault_paypal_wallet_base
      description: Resource consolidating common request and response attributes for vaulting PayPal Wallet.
      type: object
      required:
      - usage_type
      allOf:
      - $ref: '#/components/schemas/vault_instruction_base'
      - type: object
        properties:
          description:
            description: The description displayed to PayPal consumer on the approval flow for PayPal,
              as well as on the PayPal payment token management experience on PayPal.com.
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[\S\s]*$
          usage_pattern:
            title: PayPal Payment Token Usage Pattern
            description: Expected business/pricing model for the billing agreement.
            type: string
            enum:
            - IMMEDIATE
            - DEFERRED
            - RECURRING_PREPAID
            - RECURRING_POSTPAID
            - THRESHOLD_PREPAID
            - THRESHOLD_POSTPAID
            - SUBSCRIPTION_PREPAID
            - SUBSCRIPTION_POSTPAID
            - UNSCHEDULED_PREPAID
            - UNSCHEDULED_POSTPAID
            - INSTALLMENT_PREPAID
            - INSTALLMENT_POSTPAID
          shipping:
            allOf:
            - $ref: '#/components/schemas/shipping_detail'
            - description: The shipping address for the Payer.
              not:
                required:
                - options
          usage_type:
            title: PayPal Payment Token Usage Type
            description: The usage type associated with the PayPal payment token.
            type: string
            enum:
            - MERCHANT
            - PLATFORM
          customer_type:
            title: PayPal Payment Token Customer Type
            description: The customer type associated with the PayPal payment token. This is to indicate
              whether the customer acting on the merchant / platform is either a business or a consumer.
            type: string
            enum:
            - CONSUMER
            - BUSINESS
            default: CONSUMER
          permit_multiple_payment_tokens:
            description: Create multiple payment tokens for the same payer, merchant/platform combination.
              Use this when the customer has not logged in at merchant/platform. The payment token thus
              generated, can then also be used to create the customer account at merchant/platform. Use
              this also when multiple payment tokens are required for the same payer, different customer
              at merchant/platform. This helps to identify customers distinctly even though they may share
              the same PayPal account. This only applies to PayPal payment source.
            type: boolean
            default: false
    vault_response:
      title: vault_response
      description: The details about a saved payment source.
      type: object
      properties:
        id:
          description: The PayPal-generated ID for the saved payment source.
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\S\s]*$
        status:
          title: Vault Status
          description: The vault status.
          type: string
          enum:
          - VAULTED
          - CREATED
          - APPROVED
        customer:
          allOf:
          - $ref: '#/components/schemas/customer'
          - not:
              anyOf:
              - required:
                - email_address
              - required:
                - phone
        links:
          description: An array of request-related HATEOAS links.
          type: array
          minItems: 1
          maxItems: 10
          readOnly: true
          items:
            allOf:
            - $ref: '#/components/schemas/link_description'
            - title: link_description
              description: A request-related [HATEOAS link](/docs/api/reference/api-responses/#hateoas-links).
    vault_venmo_wallet_base:
      title: vault_Venmo_wallet_base
      description: Resource consolidating common request and response attirbutes for vaulting Venmo Wallet.
      type: object
      required:
      - usage_type
      allOf:
      - $ref: '#/components/schemas/v3_vault_instruction_base'
      - type: object
        properties:
          description:
            description: The description displayed to Venmo consumer on the approval flow for Venmo, as
              well as on the Venmo payment token management experience on Venmo.com.
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-zA-Z0-9_'\-., :;\!?"]*$
          usage_pattern:
            title: Venmo Payment Token Usage Pattern
            description: Expected business/pricing model for the billing agreement.
            type: string
            enum:
            - IMMEDIATE
            - DEFERRED
            - RECURRING_PREPAID
            - RECURRING_POSTPAID
            - THRESHOLD_PREPAID
            - THRESHOLD_POSTPAID
          usage_type:
            title: Venmo Payment Token Usage Type
            description: The usage type associated with the Venmo payment token.
            type: string
            enum:
            - MERCHANT
            - PLATFORM
          customer_type:
            title: Venmo Payment Token Customer Type
            description: The customer type associated with the Venmo payment token. This is to indicate
              whether the customer acting on the merchant / platform is either a business or a consumer.
            type: string
            enum:
            - CONSUMER
            - BUSINESS
            default: CONSUMER
          permit_multiple_payment_tokens:
            description: Create multiple payment tokens for the same payer, merchant/platform combination.
              Use this when the customer has not logged in at merchant/platform. The payment token thus
              generated, can then also be used to create the customer account at merchant/platform. Use
              this also when multiple payment tokens are required for the same payer, different customer
              at merchant/platform. This helps to identify customers distinctly even though they may share
              the same Venmo account.
            type: boolean
            default: false
    venmo_vault_response:
      title: venmo_vault_response
      description: The details about a saved venmo payment source.
      type: object
      allOf:
      - allOf:
        - $ref: '#/components/schemas/vault_response'
        - not:
            required:
            - customer
      - type: object
        properties:
          customer:
            allOf:
            - $ref: '#/components/schemas/venmo_wallet_customer'
    venmo_wallet_attributes:
      title: venmo_wallet_attributes
      description: Additional attributes associated with the use of this Venmo Wallet.
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/venmo_wallet_customer'
        vault:
          allOf:
          - $ref: '#/components/schemas/vault_venmo_wallet_base'
          - description: Attributes used to provide the instructions during vaulting of the Venmo Wallet.
    venmo_wallet_attributes_response:
      title: venmo_wallet_attributes_response
      description: Additional attributes associated with the use of a Venmo Wallet.
      type: object
      properties:
        vault:
          $ref: '#/components/schemas/venmo_vault_response'
    venmo_wallet_customer:
      title: venmo_wallet_customer
      description: This object represents a merchant’s customer, allowing them to store contact details,
        and track all payments associated with the same customer.
      type: object
      allOf:
      - $ref: '#/components/schemas/customer'
      - type: object
    venmo_wallet_experience_context:
      title: venmo_wallet_experience_context
      description: Customizes the buyer experience during the approval process for payment with Venmo.<blockquote><strong>Note:</strong>
        Partners and Marketplaces might configure <code>shipping_preference</code> during partner account
        setup, which overrides the request values.</blockquote>
      type: object
      properties:
        brand_name:
          description: The business name of the merchant. The pattern is defined by an external party
            and supports Unicode.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^.*$
        shipping_preference:
          description: The location from which the shipping address is derived.
          type: string
          enum:
          - GET_FROM_FILE
          - NO_SHIPPING
          - SET_PROVIDED_ADDRESS
          default: GET_FROM_FILE
        order_update_callback_config:
          allOf:
          - $ref: '#/components/schemas/callback_configuration'
          - description: Merchant provided Order Update callback configuration for Venmo Wallet.Venmo
              will call back merchant when the specified event occurs.we recommend merchants to pass both
              the shipping_options and shipping_address callback events. Not supported when `shipping.type`
              is specified or when 'application_context.shipping_preference' is set as 'NO_SHIPPING' or
              'SET_PROVIDED_ADDRESS'.
        user_action:
          description: Configures a <strong>Continue</strong> or <strong>Pay Now</strong> checkout flow.
          type: string
          enum:
          - CONTINUE
          - PAY_NOW
          default: CONTINUE
    venmo_wallet_request:
      title: venmo_wallet_request
      description: Information needed to pay using Venmo.
      type: object
      properties:
        vault_id:
          allOf:
          - $ref: '#/components/schemas/vault_id'
          - description: The PayPal-generated ID for the saved Venmo wallet payment_source. This ID should
              be stored on the merchant's server so the saved payment source can be used for future transactions.
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: The email address of the payer.
        experience_context:
          $ref: '#/components/schemas/venmo_wallet_experience_context'
        attributes:
          allOf:
          - $ref: '#/components/schemas/venmo_wallet_attributes'
          - description: Additional attributes associated with the use of this wallet.
    venmo_wallet_response:
      title: venmo_wallet_response
      description: Venmo wallet response.
      type: object
      properties:
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: The email address of the payer.
        account_id:
          allOf:
          - $ref: '#/components/schemas/account_id-2'
          - description: This is an immutable system-generated id for a user's Venmo account.
            readOnly: true
        user_name:
          description: The Venmo user name chosen by the user, also know as a Venmo handle.
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]*$
        name:
          allOf:
          - $ref: '#/components/schemas/name'
          - description: The name associated with the Venmo account. Supports only the `given_name` and
              `surname` properties.
            not:
              anyOf:
              - required:
                - prefix
              - required:
                - middle_name
              - required:
                - suffix
              - required:
                - alternate_full_name
              - required:
                - full_name
        phone_number:
          allOf:
          - $ref: '#/components/schemas/phone-3'
          - description: The phone number associated with the Venmo account, in its canonical international
              [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en). Supports only the
              `national_number` property.
        address:
          allOf:
          - $ref: '#/components/schemas/address_portable'
          - description: The address of the payer. Supports only the `address_line_1`, `address_line_2`,
              `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties. Also referred
              to as the billing address of the customer.
            not:
              anyOf:
              - required:
                - address_line_3
              - required:
                - admin_area_3
              - required:
                - admin_area_4
              - required:
                - address_details
        return_flow:
          description: Merchant preference on how the buyer can navigate back to merchant website post
            approving the transaction on the Venmo App.
          type: string
          enum:
          - AUTO
          - MANUAL
          default: AUTO
          readOnly: true
        attributes:
          $ref: '#/components/schemas/venmo_wallet_attributes_response'
