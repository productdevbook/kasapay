            type: string
            minLength: 10
            maxLength: 4000
            format: uri
        cancel_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer will be redirected upon cancelling the 3DS challenge.
            type: string
            minLength: 10
            maxLength: 4000
            format: uri
    card_from_request:
      title: card_from_request
      description: Representation of card details as received in the request.
      type: object
      properties:
        expiry:
          allOf:
          - $ref: '#/components/schemas/date_year_month'
          - description: The card expiration year and month, in [Internet date format](https://tools.ietf.org/html/rfc3339#section-5.6).
        last_digits:
          description: The last digits of the payment card.
          type: string
          minLength: 2
          maxLength: 4
          pattern: ^.*[0-9]{2,}.*$
          readOnly: true
    card_request:
      title: card_request
      description: The payment card to use to fund a payment. Can be a credit or debit card.<blockquote><strong>Note:</strong>
        Passing card number, cvv and expiry directly via the API requires <a href="https://www.pcisecuritystandards.org/pci_security/completing_self_assessment">
        PCI SAQ D compliance</a>. <br>*PayPal offers a mechanism by which you do not have to take on the
        <strong>PCI SAQ D</strong> burden by using hosted fields - refer to <a href="https://developer.paypal.com/docs/checkout/advanced/integrate/">this
        Integration Guide</a>*.</blockquote>
      type: object
      allOf:
      - allOf:
        - $ref: '#/components/schemas/card'
        - not:
            anyOf:
            - required:
              - id
            - required:
              - last_digits
            - required:
              - card_type
            - required:
              - type
            - required:
              - brand
      - type: object
        properties:
          vault_id:
            allOf:
            - $ref: '#/components/schemas/vault_id'
            - description: The PayPal-generated ID for the saved card payment source. Typically stored
                on the merchant's server.
          single_use_token:
            allOf:
            - $ref: '#/components/schemas/single_use_token'
            - description: The PayPal-generated, short-lived, one-time-use token, used to communicate
                payment information to PayPal for transaction processing.
          stored_credential:
            $ref: '#/components/schemas/card_stored_credential'
          network_token:
            allOf:
            - $ref: '#/components/schemas/network_token_request'
            - description: A 3rd party network token refers to a network token that the merchant provisions
                from and vaults with an external TSP (Token Service Provider) other than PayPal.
          experience_context:
            allOf:
            - $ref: '#/components/schemas/card_experience_context'
            - {}
    card_response:
      title: card_response
      description: The payment card to use to fund a payment. Card can be a credit or debit card.
      type: object
      properties:
        name:
          description: The card holder's name as it appears on the card.
          type: string
          minLength: 2
          maxLength: 300
          pattern: ^[\S\s]*$
        last_digits:
          description: The last digits of the payment card.
          type: string
          minLength: 0
          maxLength: 2147483647
          pattern: ^.*[0-9]{2,}.*$
          readOnly: true
        brand:
          allOf:
          - $ref: '#/components/schemas/card_brand'
          - description: The card brand or network. Typically used in the response.
            readOnly: true
        available_networks:
          description: Array of brands or networks associated with the card.
          type: array
          minItems: 1
          maxItems: 256
          readOnly: true
          items:
            allOf:
            - $ref: '#/components/schemas/card_brand'
            - title: card_brand
        type:
          allOf:
          - $ref: '#/components/schemas/card_type'
          - description: The payment card type.
        authentication_result:
          $ref: '#/components/schemas/authentication_response'
        attributes:
          $ref: '#/components/schemas/card_attributes_response'
        from_request:
          $ref: '#/components/schemas/card_from_request'
        expiry:
          allOf:
          - $ref: '#/components/schemas/date_year_month'
          - description: The card expiration year and month, in [Internet date format](https://tools.ietf.org/html/rfc3339#section-5.6).
        bin_details:
          allOf:
          - $ref: '#/components/schemas/bin_details'
          - description: Bank Identification Number (BIN) details used to fund a payment.
        stored_credential:
          $ref: '#/components/schemas/card_stored_credential'
    card_stored_credential:
      title: card_stored_credential
      description: Provides additional details to process a payment using a `card` that has been stored
        or is intended to be stored (also referred to as stored_credential or card-on-file).<br/>Parameter
        compatibility:<br/><ul><li>`payment_type=ONE_TIME` is compatible only with `payment_initiator=CUSTOMER`.</li><li>`usage=FIRST`
        is compatible only with `payment_initiator=CUSTOMER`.</li><li>`previous_transaction_reference`
        or `previous_network_transaction_reference` is compatible only with `payment_initiator=MERCHANT`.</li><li>Only
        one of the parameters - `previous_transaction_reference` and `previous_network_transaction_reference`
        - can be present in the request.</li></ul>
      type: object
      required:
      - payment_initiator
      - payment_type
      properties:
        payment_initiator:
          $ref: '#/components/schemas/payment_initiator'
        payment_type:
          $ref: '#/components/schemas/stored_payment_source_payment_type'
        usage:
          $ref: '#/components/schemas/stored_payment_source_usage_type'
        previous_network_transaction_reference:
          $ref: '#/components/schemas/network_transaction_reference'
    card_supplementary_data:
