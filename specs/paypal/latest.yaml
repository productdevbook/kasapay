                items. <code>tax.value</code> can not be a negative number.
          commodity_code:
            description: Code used to classify items purchased and track the total amount spent across
              various categories of products and services. Different corporate purchasing organizations
              may use different standards, but the United Nations Standard Products and Services Code
              (UNSPSC) is frequently used.
            type: string
            minLength: 1
            maxLength: 12
            pattern: ^[a-zA-Z0-9_'.-]*$
          discount_amount:
            allOf:
            - $ref: '#/components/schemas/money'
            - description: Use this field to break down the discount amount included in the total purchase
                amount. The value provided here will not add to the total purchase amount. The value cannot
                be negative.
          total_amount:
            allOf:
            - $ref: '#/components/schemas/money'
            - description: The subtotal for all items. Must equal the sum of (items[].unit_amount * items[].quantity)
                for all items. item_total.value can not be a negative number.
          unit_of_measure:
            description: 'Unit of measure is a standard used to express the magnitude of a quantity in
              international trade. Most commonly used (but not limited to) examples are: Acre (ACR), Ampere
              (AMP), Centigram (CGM), Centimetre (CMT), Cubic inch (INQ), Cubic metre (MTQ), Fluid ounce
              (OZA), Foot (FOT), Hour (HUR), Item (ITM), Kilogram (KGM), Kilometre (KMT), Kilowatt (KWT),
              Liquid gallon (GLL), Liter (LTR), Pounds (LBS), Square foot (FTK).'
            type: string
            minLength: 1
            maxLength: 12
            pattern: ^[a-zA-Z0-9_'.-]*$
