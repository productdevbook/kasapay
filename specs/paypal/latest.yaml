            - $ref: '#/components/schemas/purchase_unit_request'
            - title: purchase_unit
              description: The purchase unit. Establishes a contract between a payer and the payee.
        payment_source:
          $ref: '#/components/schemas/payment_source'
        application_context:
          allOf:
          - $ref: '#/components/schemas/order_application_context'
          - title: application_context
            description: Customize the payer experience during the approval process for the payment with
              PayPal.
    order_status:
      title: Order Status
      description: The order status.
      type: string
      enum:
      - CREATED
      - SAVED
      - APPROVED
      - VOIDED
      - COMPLETED
      - PAYER_ACTION_REQUIRED
    p24:
      title: p24
      description: Information used to pay using P24(Przelewy24).
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        email:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - title: name
            description: The two-character ISO 3166-1 country code.
        payment_descriptor:
          description: P24 generated payment description.
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[\S\s]*$
        method_id:
          description: Numeric identifier of the payment scheme or bank used for the payment.
          type: string
          minLength: 1
          maxLength: 300
          pattern: ^[\S\s]*$
        method_description:
          description: Friendly name of the payment scheme or bank used for the payment.
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^[\S\s]*$
    p24_request:
      title: p24_request
      description: Information needed to pay using P24 (Przelewy24).
      type: object
      required:
      - country_code
      - email
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        email:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base'
          - description: Customizes the payer experience during the approval process for the payment.
    pares_status:
      description: Transactions status result identifier. The outcome of the issuer's authentication.
      type: string
      enum:
      - Y
      - N
      - U
      - A
      - C
      - R
      - D
      - I
    participant_metadata:
      title: participant_metadata
      description: Profile information of the sender or receiver.
      type: object
      properties:
        ip_address:
          allOf:
          - $ref: '#/components/schemas/ip_address'
          - description: The consumer's IP address, which can be represented in either IPv4 or IPv6 format.
    payee:
      title: payee
      description: The merchant who receives the funds and fulfills the order. The merchant is also known
        as the payee.
      type: object
      allOf:
      - $ref: '#/components/schemas/payee_base'
      - type: object
    payee_base:
      title: payee_base
      description: The details for the merchant who receives the funds and fulfills the order. The merchant
        is also known as the payee.
      type: object
      properties:
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: The email address of merchant.
        merchant_id:
          allOf:
          - $ref: '#/components/schemas/account_id'
          - description: The encrypted PayPal account ID of the merchant.
    payee_payment_method_preference:
      title: payee_payment_method_preference
      description: The merchant-preferred payment methods.
      type: string
      enum:
      - UNRESTRICTED
      - IMMEDIATE_PAYMENT_REQUIRED
      default: UNRESTRICTED
    payer:
      title: payer
      description: The customer who approves and pays for the order. The customer is also known as the
        payer.
      type: object
      allOf:
      - $ref: '#/components/schemas/payer_base'
      - type: object
        properties:
          name:
            allOf:
            - $ref: '#/components/schemas/name'
            - description: The name of the payer. Supports only the `given_name` and `surname` properties.
              not:
                anyOf:
                - required:
                  - prefix
                - required:
                  - middle_name
                - required:
                  - suffix
                - required:
                  - alternate_full_name
                - required:
                  - full_name
          phone:
            allOf:
            - $ref: '#/components/schemas/phone_with_type'
            - description: The phone number of the customer. Available only when you enable the **Contact
                Telephone Number** option in the <a href="https://www.paypal.com/cgi-bin/customerprofileweb?cmd=_profile-website-payments">**Profile
                & Settings**</a> for the merchant's PayPal account. The `phone.phone_number` supports
                only `national_number`.
          birth_date:
            allOf:
            - $ref: '#/components/schemas/date_no_time'
            - description: The birth date of the payer in `YYYY-MM-DD` format.
          tax_info:
            allOf:
            - $ref: '#/components/schemas/tax_info'
            - description: The tax information of the payer. Required only for Brazilian payer's. Both
                `tax_id` and `tax_id_type` are required.
          address:
            allOf:
            - $ref: '#/components/schemas/address_portable'
            - description: The address of the payer. Supports only the `address_line_1`, `address_line_2`,
                `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties. Also referred
                to as the billing address of the customer.
              not:
                anyOf:
                - required:
                  - address_line_3
                - required:
                  - admin_area_3
                - required:
                  - admin_area_4
                - required:
                  - address_details
    payer_base:
      title: payer_base
      description: The customer who approves and pays for the order. The customer is also known as the
        payer.
      type: object
      properties:
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: The email address of the payer.
        payer_id:
          allOf:
          - $ref: '#/components/schemas/account_id'
          - description: The PayPal-assigned ID for the payer.
            readOnly: true
    payment_collection:
      title: Payment Collection
      description: The collection of payments, or transactions, for a purchase unit in an order. For example,
        authorized payments, captured payments, and refunds.
      type: object
      properties:
        authorizations:
          description: An array of authorized payments for a purchase unit. A purchase unit can have zero
            or more authorized payments.
          type: array
          minItems: 0
          maxItems: 32767
          items:
            allOf:
            - $ref: '#/components/schemas/authorization_with_additional_data'
            - title: authorizations
              description: The authorized payment for a purchase unit.
        captures:
          description: An array of captured payments for a purchase unit. A purchase unit can have zero
            or more captured payments.
          type: array
          minItems: 0
          maxItems: 32767
          items:
            allOf:
            - $ref: '#/components/schemas/capture'
            - title: capture
              description: The captured payment for a purchase unit.
        refunds:
          description: An array of refunds for a purchase unit. A purchase unit can have zero or more
            refunds.
          type: array
          minItems: 0
          maxItems: 32767
          items:
            allOf:
            - $ref: '#/components/schemas/refund'
            - title: refund
              description: A refund for a purchase unit.
    payment_initiator:
      title: payment_initiator
      description: The person or party who initiated or triggered the payment.
      type: string
      enum:
      - CUSTOMER
      - MERCHANT
    payment_instruction:
      title: payment_instruction
      description: Any additional payment instructions to be consider during payment processing. This
        processing instruction is applicable for Capturing an order or Authorizing an Order.
      type: object
      properties:
        platform_fees:
          description: An array of various fees, commissions, tips, or donations. This field is only applicable
            to merchants that been enabled for PayPal Complete Payments Platform for Marketplaces and
            Platforms capability.
          type: array
          minItems: 0
          maxItems: 1
          items:
            allOf:
            - $ref: '#/components/schemas/platform_fee'
            - title: platform_fee
        disbursement_mode:
          allOf:
          - $ref: '#/components/schemas/disbursement_mode'
          - description: The funds that are held payee by the marketplace/platform. This field is only
              applicable to merchants that been enabled for PayPal Complete Payments Platform for Marketplaces
              and Platforms capability.
        payee_pricing_tier_id:
          description: This field is only enabled for selected merchants/partners to use and provides
            the ability to trigger a specific pricing rate/plan for a payment transaction. The list of
            eligible 'payee_pricing_tier_id' would be provided to you by your Account Manager. Specifying
            values other than the one provided to you by your account manager would result in an error.
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^.*$
        payee_receivable_fx_rate_id:
          description: FX identifier generated returned by PayPal to be used for payment processing in
            order to honor FX rate (for eligible integrations) to be used when amount is settled/received
            into the payee account.
          type: string
          minLength: 1
          maxLength: 4000
          pattern: ^.*$
    payment_method:
      title: payment_method
      description: The customer and merchant payment preferences.
      type: object
      properties:
        payee_preferred:
          $ref: '#/components/schemas/payee_payment_method_preference'
        standard_entry_class_code:
          description: NACHA (the regulatory body governing the ACH network) requires that API callers
            (merchants, partners) obtain the consumer’s explicit authorization before initiating a transaction.
            To stay compliant, you’ll need to make sure that you retain a compliant authorization for
            each transaction that you originate to the ACH Network using this API. ACH transactions are
            categorized (using SEC codes) by how you capture authorization from the Receiver (the person
            whose bank account is being debited or credited). PayPal supports the following SEC codes.
          type: string
          enum:
          - TEL
          - WEB
          - CCD
          - PPD
          default: WEB
    payment_source:
      title: payment_source
      description: The payment source definition.
      type: object
      properties:
        card:
          $ref: '#/components/schemas/card_request'
        token:
          $ref: '#/components/schemas/token'
        paypal:
          allOf:
          - $ref: '#/components/schemas/paypal_wallet'
          - description: Indicates that PayPal Wallet is the payment source. Main use of this selection
              is to provide additional instructions associated with this choice like vaulting.
        bancontact:
          allOf:
          - $ref: '#/components/schemas/bancontact_request'
          - title: bancontact
            description: Bancontact is the most popular online payment in Belgium. [More Details](https://www.bancontact.com/).
        blik:
          allOf:
          - $ref: '#/components/schemas/blik_request'
          - title: blik
            description: BLIK is a mobile payment system, created by Polish Payment Standard in order
              to allow millions of users to pay in shops, payout cash in ATMs and make online purchases
              and payments. [More Details](https://blikmobile.pl/).
        eps:
          allOf:
          - $ref: '#/components/schemas/eps_request'
          - title: eps
            description: The eps transfer is an online payment method developed by many Austrian banks.
              [More Details](https://www.eps-ueberweisung.at/).
        giropay:
          allOf:
          - $ref: '#/components/schemas/giropay_request'
          - title: giropay
            description: Giropay is an Internet payment System in Germany, based on online banking. [More
              Details](https://giropay.de/).
        ideal:
          allOf:
          - $ref: '#/components/schemas/ideal_request'
          - title: ideal
            description: The Dutch payment method iDEAL is an online payment method that enables consumers
              to pay online through their own bank. [More Details](https://www.ideal.nl/).
        mybank:
          allOf:
          - $ref: '#/components/schemas/mybank_request'
          - title: mybank
            description: MyBank is an e-authorisation solution which enables safe digital payments and
              identity authentication through a consumer’s own online banking portal or mobile application.
              [More Details](https://www.mybank.eu/).
        p24:
          allOf:
          - $ref: '#/components/schemas/p24_request'
          - title: p24
            description: P24 (Przelewy24) is a secure and fast online bank transfer service linked to
              all the major banks in Poland. [More Details](https://www.przelewy24.pl/).
        sofort:
          allOf:
          - $ref: '#/components/schemas/sofort_request'
          - title: sofort
            description: SOFORT Banking is a real-time bank transfer payment method that buyers use to
              transfer funds directly to merchants from their bank accounts. [More Details](https://www.klarna.com/sofort/).
        trustly:
          allOf:
          - $ref: '#/components/schemas/trustly_request'
          - title: trustly
            description: Trustly is a payment method that allows customers to shop and pay from their
              bank account. [More Details](https://www.trustly.net/).
        apple_pay:
          allOf:
          - $ref: '#/components/schemas/apple_pay_request'
          - title: applepay
            description: ApplePay payment source, allows buyer to pay using ApplePay, both on Web as well
              as on Native.
        google_pay:
          allOf:
          - $ref: '#/components/schemas/google_pay_request'
          - title: googlepay
            description: Google Pay payment source, allows buyer to pay using Google Pay.
        venmo:
          allOf:
          - $ref: '#/components/schemas/venmo_wallet_request'
          - title: venmo
            description: Information needed to indicate that Venmo is being used to fund the payment.
        crypto:
          allOf:
          - $ref: '#/components/schemas/crypto_request'
          - title: crypto
            description: Indicates that Crypto Wallet is the payment source.
    payment_source_response:
      title: payment_source_response
      description: The payment source used to fund the payment.
      type: object
      properties:
        card:
          $ref: '#/components/schemas/card_response'
        paypal:
          $ref: '#/components/schemas/paypal_wallet_response'
        bancontact:
          $ref: '#/components/schemas/bancontact'
        blik:
          $ref: '#/components/schemas/blik'
        eps:
          $ref: '#/components/schemas/eps'
        giropay:
          $ref: '#/components/schemas/giropay'
        ideal:
          $ref: '#/components/schemas/ideal'
        mybank:
          $ref: '#/components/schemas/mybank'
        p24:
          $ref: '#/components/schemas/p24'
        sofort:
          $ref: '#/components/schemas/sofort'
        trustly:
          $ref: '#/components/schemas/trustly'
        apple_pay:
          $ref: '#/components/schemas/apple_pay'
        google_pay:
          $ref: '#/components/schemas/google_pay'
        venmo:
          $ref: '#/components/schemas/venmo_wallet_response'
        crypto:
          $ref: '#/components/schemas/crypto'
    paypal_wallet:
      title: paypal_wallet
      description: A resource that identifies a PayPal Wallet is used for payment.
      type: object
      properties:
        vault_id:
          allOf:
          - $ref: '#/components/schemas/vault_id'
          - description: The PayPal-generated ID for the payment_source stored within the Vault.
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: The email address of the PayPal account holder.
        name:
          allOf:
          - $ref: '#/components/schemas/name'
          - description: The name of the PayPal account holder. Supports only the `given_name` and `surname`
              properties.
            not:
              anyOf:
              - required:
                - prefix
              - required:
                - middle_name
              - required:
                - suffix
              - required:
                - alternate_full_name
              - required:
                - full_name
        phone:
          allOf:
          - $ref: '#/components/schemas/phone_with_type'
          - description: The phone number of the customer. Available only when you enable the **Contact
              Telephone Number** option in the <a href="https://www.paypal.com/cgi-bin/customerprofileweb?cmd=_profile-website-payments">**Profile
              & Settings**</a> for the merchant's PayPal account. The `phone.phone_number` supports only
              `national_number`.
        birth_date:
          allOf:
          - $ref: '#/components/schemas/date_no_time'
          - description: The birth date of the PayPal account holder in `YYYY-MM-DD` format.
        tax_info:
          allOf:
          - $ref: '#/components/schemas/tax_info'
          - description: The tax information of the PayPal account holder. Required only for Brazilian
              PayPal account holder's. Both `tax_id` and `tax_id_type` are required.
        address:
          allOf:
          - $ref: '#/components/schemas/address_portable'
          - description: The address of the PayPal account holder. Supports only the `address_line_1`,
              `address_line_2`, `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties.
              Also referred to as the billing address of the customer.
            not:
              anyOf:
              - required:
                - address_line_3
              - required:
                - admin_area_3
              - required:
                - admin_area_4
              - required:
                - address_details
        attributes:
          allOf:
          - $ref: '#/components/schemas/paypal_wallet_attributes'
          - title: paypal_wallet_attributes
            description: Additional attributes associated with the use of this wallet.
        experience_context:
          $ref: '#/components/schemas/paypal_wallet_experience_context'
        billing_agreement_id:
          $ref: '#/components/schemas/billing_agreement_id'
        stored_credential:
          $ref: '#/components/schemas/paypal_wallet_stored_credential'
    paypal_wallet_attributes:
      title: paypal_wallet_attributes
      description: Additional attributes associated with the use of this PayPal Wallet.
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/paypal_wallet_customer'
        vault:
          allOf:
          - $ref: '#/components/schemas/vault_paypal_wallet_base'
          - description: Attributes used to provide the instructions during vaulting of the PayPal Wallet.
            not:
              required:
              - shipping
    paypal_wallet_attributes_response:
      title: paypal_wallet_attributes_response
      description: Additional attributes associated with the use of a PayPal Wallet.
      type: object
      properties:
        vault:
          $ref: '#/components/schemas/paypal_wallet_vault_response'
        cobranded_cards:
          description: An array of merchant cobranded cards used by buyer to complete an order. This array
            will be present if a merchant has onboarded their cobranded card with PayPal and provided
            corresponding label(s).
          type: array
          minItems: 0
          maxItems: 25
          items:
            allOf:
            - $ref: '#/components/schemas/cobranded_card'
            - title: cobranded_card
    paypal_wallet_customer:
      title: paypal_wallet_customer
      description: The details about a customer in PayPal's system of record.
      type: object
      allOf:
      - $ref: '#/components/schemas/customer'
      - type: object
        properties:
          merchant_customer_id:
            description: Merchants and partners may already have a data-store where their customer information
              is persisted. Use merchant_customer_id to associate the PayPal-generated customer.id to
              your representation of a customer.
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[0-9a-zA-Z-_.^*$@#]+$
    paypal_wallet_experience_context:
      title: paypal_wallet_experience_context
      description: Customizes the payer experience during the approval process for payment with PayPal.<blockquote><strong>Note:</strong>
        Partners and Marketplaces might configure <code>brand_name</code> and <code>shipping_preference</code>
        during partner account setup, which overrides the request values.</blockquote>
      type: object
      properties:
        brand_name:
          description: The label that overrides the business name in the PayPal account on the PayPal
            site. The pattern is defined by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^.*$
        locale:
          allOf:
          - $ref: '#/components/schemas/language'
          - description: The BCP 47-formatted locale of pages that the PayPal payment experience shows.
              PayPal supports a five-character code. For example, `da-DK`, `he-IL`, `id-ID`, `ja-JP`,
              `no-NO`, `pt-BR`, `ru-RU`, `sv-SE`, `th-TH`, `zh-CN`, `zh-HK`, or `zh-TW`.
        shipping_preference:
          description: The location from which the shipping address is derived.
          type: string
          enum:
          - GET_FROM_FILE
          - NO_SHIPPING
          - SET_PROVIDED_ADDRESS
          default: GET_FROM_FILE
        contact_preference:
          description: The preference to display the contact information (buyer’s shipping email & phone
            number) on PayPal's checkout for easy merchant-buyer communication.
          type: string
          enum:
          - NO_CONTACT_INFO
          - UPDATE_CONTACT_INFO
          - RETAIN_CONTACT_INFO
          default: NO_CONTACT_INFO
        return_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer will be redirected upon approving a payment.
            format: uri
        cancel_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer will be redirected upon cancelling the payment approval.
            format: uri
        app_switch_context:
          allOf:
          - $ref: '#/components/schemas/app_switch_context'
          - description: Merchants can use this to switch buyers from their website/application to the
              PayPal consumer app to review and approve the transaction.
        landing_page:
          description: The type of landing page to show on the PayPal site for customer checkout.
          type: string
          enum:
          - LOGIN
          - GUEST_CHECKOUT
          - NO_PREFERENCE
          - BILLING
          default: NO_PREFERENCE
        user_action:
          description: Configures a <strong>Continue</strong> or <strong>Pay Now</strong> checkout flow.
          type: string
          enum:
          - CONTINUE
          - PAY_NOW
          default: CONTINUE
        payment_method_preference:
          description: The merchant-preferred payment methods.
          type: string
          enum:
          - UNRESTRICTED
          - IMMEDIATE_PAYMENT_REQUIRED
          default: UNRESTRICTED
        order_update_callback_config:
          allOf:
          - $ref: '#/components/schemas/callback_configuration'
          - description: Merchant provided Order Update callback configuration for PayPal Wallet.PayPal
              will call back merchant when the specified event occurs.we recommend merchants to pass both
              the shipping_options and shipping_address callback events. Not supported when `shipping.type`
              is specified or when 'application_context.shipping_preference' is set as 'NO_SHIPPING' or
              'SET_PROVIDED_ADDRESS'.
    paypal_wallet_response:
      title: paypal_wallet_response
      description: The PayPal Wallet response.
      type: object
      properties:
        email_address:
          allOf:
          - $ref: '#/components/schemas/email'
          - description: The email address of the PayPal account holder.
        account_id:
          allOf:
          - $ref: '#/components/schemas/account_id-2'
          - description: The PayPal-assigned ID for the PayPal account holder.
            readOnly: true
        account_status:
          description: The account status indicates whether the buyer has verified the financial details
            associated with their PayPal account.
          type: string
          enum:
          - VERIFIED
          - UNVERIFIED
          readOnly: true
        name:
          allOf:
          - $ref: '#/components/schemas/name'
          - description: The name of the PayPal account holder. Supports only the `given_name` and `surname`
              properties.
            not:
              anyOf:
              - required:
                - prefix
              - required:
                - middle_name
              - required:
                - suffix
              - required:
                - alternate_full_name
              - required:
                - full_name
        phone_type:
          $ref: '#/components/schemas/phone_type'
        phone_number:
          allOf:
          - $ref: '#/components/schemas/phone-3'
          - description: The phone number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en).
              Available only when you enable the **Contact Telephone Number** option in the <a href="https://www.paypal.com/cgi-bin/customerprofileweb?cmd=_profile-website-payments">**Profile
              & Settings**</a> for the merchant's PayPal account. Supports only the `national_number`
              property.
        birth_date:
          allOf:
          - $ref: '#/components/schemas/date_no_time'
          - description: The birth date of the PayPal account holder in `YYYY-MM-DD` format.
        business_name:
          description: The business name of the PayPal account holder (populated for business accounts
            only)
          type: string
          minLength: 0
          maxLength: 300
          pattern: ^.*$
        tax_info:
          allOf:
          - $ref: '#/components/schemas/tax_info'
          - description: The tax information of the PayPal account holder. Required only for Brazilian
              PayPal account holder's. Both `tax_id` and `tax_id_type` are required.
        address:
          allOf:
          - $ref: '#/components/schemas/address_portable'
          - description: The address of the PayPal account holder. Supports only the `address_line_1`,
              `address_line_2`, `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties.
              Also referred to as the billing address of the customer.
            not:
              anyOf:
              - required:
                - address_line_3
              - required:
                - admin_area_3
              - required:
                - admin_area_4
              - required:
                - address_details
        attributes:
          $ref: '#/components/schemas/paypal_wallet_attributes_response'
        stored_credential:
