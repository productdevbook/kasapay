      description: The [language tag](https://tools.ietf.org/html/bcp47#section-2) for the language in
        which to localize the error-related strings, such as messages, issues, and suggested actions.
        The tag is made up of the [ISO 639-2 language code](https://www.loc.gov/standards/iso639-2/php/code_list.php),
        the optional [ISO-15924 script tag](https://www.unicode.org/iso15924/codelists.html), and the
