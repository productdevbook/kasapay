      enum:
      - 'NO'
      - POSSIBLE
      - UNKNOWN
    line_item:
      title: line_item
      description: The line items for this purchase. If your merchant account has been configured for
        Level 3 processing this field will be passed to the processor on your behalf.
      type: object
      allOf:
      - $ref: '#/components/schemas/item_without_category_tax_or_amount'
      - type: object
        properties:
