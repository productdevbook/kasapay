      title: PayPal Account Identifier
      description: The account identifier for a PayPal account.
      type: string
      minLength: 13
      maxLength: 13
      pattern: ^[2-9A-HJ-NP-Z]{13}$
    account_id-2:
      description: The PayPal payer ID, which is a masked version of the PayPal account number intended
        for use with third parties. The account number is reversibly encrypted and a proprietary variant
        of Base32 is used to encode the result.
      type: string
      minLength: 13
      maxLength: 13
      pattern: ^[2-9A-HJ-NP-Z]{13}$
    activity_timestamps:
      title: activity_timestamps
      description: The date and time stamps that are common to authorized payment, captured payment, and
        refund transactions.
      type: object
      properties:
        create_time:
          allOf:
          - $ref: '#/components/schemas/date_time'
          - description: The date and time when the transaction occurred, in [Internet date and time format](https://tools.ietf.org/html/rfc3339#section-5.6).
            readOnly: true
        update_time:
          allOf:
          - $ref: '#/components/schemas/date_time'
          - description: The date and time when the transaction was last updated, in [Internet date and
              time format](https://tools.ietf.org/html/rfc3339#section-5.6).
            readOnly: true
    address_portable:
      title: Portable Postal Address (Medium-Grained)
      description: 'The portable international postal address. Maps to [AddressValidationMetadata](https://github.com/googlei18n/libaddressinput/wiki/AddressValidationMetadata)
        and HTML 5.1 [Autofilling form controls: the autocomplete attribute](https://www.w3.org/TR/html51/sec-forms.html#autofilling-form-controls-the-autocomplete-attribute).'
      type: object
      required:
      - country_code
      properties:
        address_line_1:
          description: The first line of the address, such as number and street, for example, `173 Drury
            Lane`. Needed for data entry, and Compliance and Risk checks. This field needs to pass the
            full address.
          type: string
          minLength: 0
          maxLength: 300
          pattern: ^[\S\s]*$
        address_line_2:
          description: The second line of the address, for example, a suite or apartment number.
          type: string
          minLength: 0
          maxLength: 300
          pattern: ^[\S\s]*$
        address_line_3:
          description: The third line of the address, if needed. Examples include a street complement
            for Brazil, direction text, such as `next to Walmart`, or a landmark in an Indian address.
          type: string
          minLength: 0
          maxLength: 100
          pattern: ^[\S\s]*$
        admin_area_4:
          description: The neighborhood, ward, or district. This is smaller than `admin_area_level_3`
            or `sub_locality`. Value is:<ul><li>The postal sorting code that is used in Guernsey and many
            French territories, such as French Guiana.</li><li>The fine-grained administrative levels
            in China.</li></ul>
          type: string
          minLength: 0
          maxLength: 100
          pattern: ^[\S\s]*$
        admin_area_3:
          description: The sub-locality, suburb, neighborhood, or district. This is smaller than `admin_area_level_2`.
            Value is:<ul><li>Brazil. Suburb, *bairro*, or neighborhood.</li><li>India. Sub-locality or
            district. Street name information isn't always available, but a sub-locality or district can
            be a very small area.</li></ul>
          type: string
          minLength: 0
          maxLength: 100
          pattern: ^[\S\s]*$
        admin_area_2:
          description: A city, town, or village. Smaller than `admin_area_level_1`.
          type: string
          minLength: 0
          maxLength: 120
          pattern: ^[\S\s]*$
        admin_area_1:
          description: The highest-level sub-division in a country, which is usually a province, state,
            or ISO-3166-2 subdivision. This data is formatted for postal delivery, for example, `CA` and
            not `California`. Value, by country, is:<ul><li>UK. A county.</li><li>US. A state.</li><li>Canada.
            A province.</li><li>Japan. A prefecture.</li><li>Switzerland. A *kanton*.</li></ul>
          type: string
          minLength: 0
          maxLength: 300
          pattern: ^[\S\s]*$
        postal_code:
          description: The postal code, which is the ZIP code or equivalent. Typically required for countries
            with a postal code or an equivalent. See [postal code](https://en.wikipedia.org/wiki/Postal_code).
          type: string
          minLength: 0
          maxLength: 60
          pattern: ^[\S\s]*$
        country_code:
          $ref: '#/components/schemas/country_code'
        address_details:
          title: Address Details
          description: The non-portable additional address details include fine-grain address information
            for Compliance, Risk, and other scenarios. This isn't portable with common third-party and
            open source applications. This can include data that is redundant with core fields. For example,
            `address_portable.address_line_1` is usually a combination of `address_details.street_number`,
            `street_name`, and `street_type`.
          type: object
          properties:
            street_number:
              description: The street number.
              type: string
              minLength: 0
              maxLength: 100
              pattern: ^[\S\s]*$
            street_name:
              description: The street name. Just `Drury` in `Drury Lane`.
              type: string
              minLength: 0
              maxLength: 100
              pattern: ^[\S\s]*$
            street_type:
              description: The street type. For example, avenue, boulevard, road, or expressway.
              type: string
              minLength: 0
              maxLength: 100
              pattern: ^[\S\s]*$
            delivery_service:
              description: The delivery service. Post office box, bag number, or post office name.
              type: string
              minLength: 0
              maxLength: 100
              pattern: ^[\S\s]*$
            building_name:
              description: A named locations that represents the premise. Usually a building name or number
                or collection of buildings with a common name or number. For example, <code>Craven House</code>.
              type: string
              minLength: 0
              maxLength: 100
              pattern: ^[\S\s]*$
            sub_building:
              description: The first-order entity below a named building or location that represents the
                sub-premise. Usually a single building within a collection of buildings with a common
                name. Can be a flat, story, floor, room, or apartment.
              type: string
              minLength: 0
              maxLength: 100
              pattern: ^[\S\s]*$
    amount_breakdown:
      title: amount_breakdown
      description: The breakdown of the amount. Breakdown provides details such as total item amount,
        total tax amount, shipping, handling, insurance, and discounts, if any.
      type: object
      properties:
        item_total:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The subtotal for all items. Required if the request includes `purchase_units[].items[].unit_amount`.
              Must equal the sum of `(items[].unit_amount * items[].quantity)` for all items. <code>item_total.value</code>
              can not be a negative number.
        shipping:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The shipping fee for all items within a given `purchase_unit`. <code>shipping.value</code>
              can not be a negative number.
        handling:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The handling fee for all items within a given `purchase_unit`. <code>handling.value</code>
              can not be a negative number.
        tax_total:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The total tax for all items. Required if the request includes `purchase_units.items.tax`.
              Must equal the sum of `(items[].tax * items[].quantity)` for all items. <code>tax_total.value</code>
              can not be a negative number.
        insurance:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The insurance fee for all items within a given `purchase_unit`. <code>insurance.value</code>
              can not be a negative number.
        shipping_discount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The shipping discount for all items within a given `purchase_unit`. <code>shipping_discount.value</code>
              can not be a negative number.
        discount:
          allOf:
          - $ref: '#/components/schemas/discount_with_breakdown'
          - description: The discount for all items within a given `purchase_unit`. <code>discount.value</code>
              can not be a negative number.
    amount_with_breakdown:
      title: amount_with_breakdown
      description: The total order amount with an optional breakdown that provides details, such as the
        total item amount, total tax amount, shipping, handling, insurance, and discounts, if any.<br/>If
        you specify `amount.breakdown`, the amount equals `item_total` plus `tax_total` plus `shipping`
        plus `handling` plus `insurance` minus `shipping_discount` minus discount.<br/>The amount must
        be a positive number. For listed of supported currencies and decimal precision, see the PayPal
        REST APIs <a href="/docs/integration/direct/rest/currency-codes/">Currency Codes</a>.
      type: object
      allOf:
      - $ref: '#/components/schemas/money'
      - type: object
        properties:
          breakdown:
            $ref: '#/components/schemas/amount_breakdown'
    app_switch_context:
      title: Merchant App Switch Details & Preferences
      description: Merchant provided details of the native app or mobile web browser to facilitate buyer's
        app switch to the PayPal consumer app.
      type: object
      properties:
        native_app:
          $ref: '#/components/schemas/native_app_context'
        mobile_web:
          $ref: '#/components/schemas/mobile_web_context'
    apple_pay:
      title: apple_pay
      description: Information needed to pay using ApplePay.
      type: object
      properties:
        id:
          description: ApplePay transaction identifier, this will be the unique identifier for this transaction
            provided by Apple. The pattern is defined by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 250
          pattern: ^.*$
        token:
          description: Encrypted ApplePay token, containing card information. This token would be base64encoded.
            The pattern is defined by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 10000
          pattern: ^.*$
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - description: Name on the wallet.
        email_address:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with this payment method.
        phone_number:
          allOf:
          - $ref: '#/components/schemas/phone'
          - description: The phone number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en).
              Supports only the `national_number` property.
            not:
              anyOf:
              - required:
                - country_code
              - required:
                - extension_number
        card:
          allOf:
          - $ref: '#/components/schemas/apple_pay_card_response'
          - description: The payment card information.
        attributes:
          allOf:
          - $ref: '#/components/schemas/apple_pay_attributes_response'
          - description: Additional attributes associated with apple pay.
        stored_credential:
          $ref: '#/components/schemas/card_stored_credential'
    apple_pay_attributes:
      title: apple_pay_attributes
      description: Additional attributes associated with apple pay.
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/customer'
        vault:
          $ref: '#/components/schemas/v3_vault_instruction_base'
    apple_pay_attributes_response:
      title: apple_pay_attributes_response
      description: Additional attributes associated with the use of Apple Pay.
      type: object
      properties:
        vault:
          $ref: '#/components/schemas/vault_response'
    apple_pay_card_response:
      title: apple_pay_card_response
      description: The Card from Apple Pay Wallet used to fund the payment.
      type: object
      allOf:
      - allOf:
        - $ref: '#/components/schemas/card_response'
        - not:
            anyOf:
            - required:
              - id
            - required:
              - last_n_chars
            - required:
              - issuer
      - type: object
        properties:
          name:
            description: The card holder's name as it appears on the card.
            type: string
            minLength: 0
            maxLength: 300
            pattern: ^[\S\s]*$
          billing_address:
            allOf:
            - $ref: '#/components/schemas/address_portable'
            - description: The billing address for this card. Supports only the `address_line_1`, `address_line_2`,
                `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties.
              not:
                anyOf:
                - required:
                  - address_line_3
                - required:
                  - admin_area_3
                - required:
                  - admin_area_4
                - required:
                  - address_details
          country_code:
            allOf:
            - $ref: '#/components/schemas/country_code-2'
            - description: The country where the card is issued.
    apple_pay_decrypted_token_data:
      title: apple_pay_decrypted_token_data
      description: Information about the Payment data obtained by decrypting Apple Pay token.
      type: object
      required:
      - tokenized_card
      properties:
        transaction_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The transaction amount for the payment that the payer has approved on apple platform.
        tokenized_card:
          allOf:
          - $ref: '#/components/schemas/card'
          - description: Apple Pay tokenized credit card used to pay.
            not:
              anyOf:
              - required:
                - id
              - required:
                - security_code
              - required:
                - last_digits
              - required:
                - authentication_results
              - required:
                - attributes
        device_manufacturer_id:
          description: Apple Pay Hex-encoded device manufacturer identifier. The pattern is defined by
            an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^.*$
        payment_data_type:
          description: Indicates the type of payment data passed, in case of Non China the payment data
            is 3DSECURE and for China it is EMV.
          type: string
          enum:
          - 3DSECURE
          - EMV
        payment_data:
          allOf:
          - $ref: '#/components/schemas/apple_pay_payment_data'
          - description: Apple Pay payment data object which contains the cryptogram, eci_indicator and
              other data.
    apple_pay_experience_context:
      title: apple_pay_experience_context
      description: Customizes the payer experience during the approval process for the payment.
      type: object
      required:
      - cancel_url
      - return_url
      properties:
        return_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer is redirected after the customer approves the payment.
            format: uri
        cancel_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer is redirected after the customer cancels the payment.
            format: uri
    apple_pay_payment_data:
      title: apple_pay_payment_data
      description: Information about the decrypted apple pay payment data for the token like cryptogram,
        eci indicator.
      type: object
      properties:
        cryptogram:
          description: Online payment cryptogram, as defined by 3D Secure. The pattern is defined by an
            external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^.*$
        eci_indicator:
          description: ECI indicator, as defined by 3- Secure. The pattern is defined by an external party
            and supports Unicode.
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^.*$
        emv_data:
          description: Encoded Apple Pay EMV Payment Structure used for payments in China. The pattern
            is defined by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^.*$
        pin:
          description: Bank Key encrypted Apple Pay PIN. The pattern is defined by an external party and
            supports Unicode.
          type: string
          minLength: 1
          maxLength: 2000
          pattern: ^.*$
    apple_pay_request:
      title: apple_pay_request
      description: Information needed to pay using ApplePay.
      type: object
      properties:
        id:
          description: ApplePay transaction identifier, this will be the unique identifier for this transaction
            provided by Apple. The pattern is defined by an external party and supports Unicode.
          type: string
          minLength: 1
          maxLength: 250
          pattern: ^.*$
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - description: Name on the account holder associated with apple pay.
        email_address:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with apple pay.
        phone_number:
          allOf:
          - $ref: '#/components/schemas/phone_number_without_country_code'
          - description: The phone number, in its canonical international [E.164 numbering plan format](https://www.itu.int/rec/T-REC-E.164/en).
              Supports only the `national_number` property.
        decrypted_token:
          allOf:
          - $ref: '#/components/schemas/apple_pay_decrypted_token_data'
          - description: The decrypted payload details for the apple pay token.
        stored_credential:
          $ref: '#/components/schemas/card_stored_credential'
        vault_id:
          allOf:
          - $ref: '#/components/schemas/vault_id'
          - description: The PayPal-generated ID for the saved apple pay payment_source. This ID should
              be stored on the merchant's server so the saved payment source can be used for future transactions.
        attributes:
          $ref: '#/components/schemas/apple_pay_attributes'
        experience_context:
          $ref: '#/components/schemas/apple_pay_experience_context'
    assurance_details:
      title: assurance_details
      description: Information about cardholder possession validation and cardholder identification and
        verifications (ID&V).
      type: object
      properties:
        account_verified:
          description: If true, indicates that Cardholder possession validation has been performed on
            returned payment credential.
          type: boolean
          default: false
        card_holder_authenticated:
          description: If true, indicates that identification and verifications (ID&V) was performed on
            the returned payment credential.If false, the same risk-based authentication can be performed
            as you would for card transactions. This risk-based authentication can include, but not limited
            to, step-up with 3D Secure protocol if applicable.
          type: boolean
          default: false
    authentication_response:
      title: authentication_response
      description: Results of Authentication such as 3D Secure.
      type: object
      properties:
        liability_shift:
          $ref: '#/components/schemas/liability_shift'
        three_d_secure:
          $ref: '#/components/schemas/three_d_secure_authentication_response'
    authorization:
      title: authorization
      description: The authorized payment transaction.
      type: object
      allOf:
      - $ref: '#/components/schemas/authorization_status'
      - type: object
        properties:
          id:
            description: The PayPal-generated ID for the authorized payment.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          amount:
            allOf:
            - $ref: '#/components/schemas/amount_with_breakdown'
            - description: The amount for this authorized payment.
              readOnly: true
          invoice_id:
            description: The API caller-provided external invoice number for this order. Appears in both
              the payer's transaction history and the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          custom_id:
            description: The API caller-provided external ID. Used to reconcile API caller-initiated transactions
              with PayPal transactions. Appears in transaction and settlement reports.
            type: string
            minLength: 0
            maxLength: 255
            pattern: ^[\S\s]*$
          network_transaction_reference:
            allOf:
            - $ref: '#/components/schemas/network_transaction'
          seller_protection:
            allOf:
            - $ref: '#/components/schemas/seller_protection'
            - readOnly: true
          expiration_time:
            allOf:
            - $ref: '#/components/schemas/date_time'
            - description: The date and time when the authorized payment expires, in [Internet date and
                time format](https://tools.ietf.org/html/rfc3339#section-5.6).
              readOnly: true
          links:
            description: An array of related [HATEOAS links](/docs/api/reference/api-responses/#hateoas-links).
            type: array
            minItems: 0
            maxItems: 32767
            readOnly: true
            items:
              allOf:
              - $ref: '#/components/schemas/link_description-2'
              - title: link_description
      - $ref: '#/components/schemas/activity_timestamps'
    authorization_status:
      title: authorization_status
      description: The status fields and status details for an authorized payment.
      type: object
      properties:
        status:
          title: Authorization Status
          description: The status for the authorized payment.
          type: string
          enum:
          - CREATED
          - CAPTURED
          - DENIED
          - PARTIALLY_CAPTURED
          - VOIDED
          - PENDING
          readOnly: true
        status_details:
          allOf:
          - $ref: '#/components/schemas/authorization_status_details'
          - description: The details of the authorized order pending status.
            readOnly: true
    authorization_status_details:
      title: authorization_status_details
      description: The details of the authorized payment status.
      type: object
      properties:
        reason:
          title: Authorization Incomplete Reason
          description: The reason why the authorized status is `PENDING`.
          type: string
          enum:
          - PENDING_REVIEW
          - DECLINED_BY_RISK_FRAUD_FILTERS
    authorization_with_additional_data:
      title: authorization_with_additional_data
      description: The authorization with additional payment details, such as risk assessment and processor
        response. These details are populated only for certain payment methods.
      type: object
      allOf:
      - $ref: '#/components/schemas/authorization'
      - type: object
        properties:
          processor_response:
            allOf:
            - $ref: '#/components/schemas/processor_response'
            - description: The processor response for card transactions.
              readOnly: true
    bancontact:
      title: bancontact
      description: Information used to pay Bancontact.
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        bic:
          allOf:
          - $ref: '#/components/schemas/bic'
          - description: The bank identification code (BIC).
        iban_last_chars:
          $ref: '#/components/schemas/iban_last_chars'
        card_last_digits:
          description: The last digits of the card used to fund the Bancontact payment.
          type: string
          minLength: 4
          maxLength: 4
          pattern: ^[0-9]{4}$
    bancontact_request:
      title: bancontact_request
      description: Information needed to pay using Bancontact.
      type: object
      required:
      - country_code
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base'
          - description: Customizes the payer experience during the approval process for the payment.
    bic:
      title: BIC
      description: The business identification code (BIC). In payments systems, a BIC is used to identify
        a specific business, most commonly a bank.
      type: string
      minLength: 8
      maxLength: 11
      pattern: ^[A-Z-a-z0-9]{4}[A-Z-a-z]{2}[A-Z-a-z0-9]{2}([A-Z-a-z0-9]{3})?$
    billing_agreement_id:
      title: billing_agreement_id
      description: The PayPal billing agreement ID. References an approved recurring payment for goods
        or services.
      type: string
      minLength: 2
      maxLength: 128
      pattern: ^[a-zA-Z0-9-]+$
    billing_cycle:
      title: billing_cycle
      description: The billing cycle providing details of the billing frequency, amount, duration and
        if the billing cycle is a free, discounted or regular billing cycle. The sequence of the billing
        cycle will be in the following order - free trial billing cycle(s), discounted trial billing cycle(s),
        regular billing cycle(s).
      type: object
      required:
      - tenure_type
      properties:
        tenure_type:
          description: The tenure type of the billing cycle identifies if the billing cycle is a trial(free
            or discounted) or regular billing cycle.
          type: string
          enum:
          - REGULAR
          - TRIAL
        pricing_scheme:
          allOf:
          - $ref: '#/components/schemas/pricing_scheme'
          - description: The active pricing scheme for this billing cycle. A free trial billing cycle
              does not require a pricing scheme.
        total_cycles:
          description: The number of times this billing cycle gets executed. Trial billing cycles can
            only be executed a finite number of times (value between <code>1</code> and <code>999</code>
            for <code>total_cycles</code>). Regular billing cycles can be executed infinite times (value
            of <code>0</code> for <code>total_cycles</code>) or a finite number of times (value between
            <code>1</code> and <code>999</code> for <code>total_cycles</code>).
          type: integer
          minimum: 0
          maximum: 999
          default: 1
        sequence:
          description: The order in which this cycle is to run among other billing cycles. For example,
            a trial billing cycle has a `sequence` of `1` while a regular billing cycle has a `sequence`
            of `2`, so that trial cycle runs before the regular cycle.
          type: integer
          minimum: 1
          maximum: 3
          default: 1
        start_date:
          allOf:
          - $ref: '#/components/schemas/date_no_time'
          - description: The start date for the billing cycle, in YYYY-MM-DD. This field should be not
              be provided if the billing cycle starts at the time of checkout. When this field is not
              provided, the billing cycle amount will be included in any data validations confirming that
              the total provided by the merchant match the sum of individual items due at the time of
              checkout. Only one billing cycle (with sequence equal to 1) can have a no start date.
    bin_details:
      title: bin_details
      description: Bank Identification Number (BIN) details used to fund a payment.
      type: object
      properties:
        bin:
          description: The Bank Identification Number (BIN) signifies the number that is being used to
            identify the granular level details (except the PII information) of the card.
          type: string
          minLength: 1
          maxLength: 25
          pattern: ^[0-9]+$
        issuing_bank:
          description: The issuer of the card instrument.
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\S\s]*$
        bin_country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The [two-character ISO-3166-1 country code](/docs/integration/direct/rest/country-codes/)
              of the bank.
        products:
          description: 'The type of card product assigned to the BIN by the issuer. These values are defined
            by the issuer and may change over time. Some examples include: PREPAID_GIFT, CONSUMER, CORPORATE.'
          type: array
          minItems: 1
          maxItems: 256
          items:
            title: products
            description: This value provides the category of the BIN.
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\S\s]*$
    blik:
      title: blik
      description: Information used to pay using BLIK.
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        email:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with this payment method.
        one_click:
          allOf:
          - $ref: '#/components/schemas/blik_one_click_response'
          - description: The one-click integration flow object.
    blik_experience_context:
      title: blik_experience_context
      description: Customizes the payer experience during the approval process for the BLIK payment.
      type: object
      allOf:
      - $ref: '#/components/schemas/experience_context_base'
      - type: object
        properties:
          consumer_ip:
            allOf:
            - $ref: '#/components/schemas/ip_address'
            - description: The IP address of the consumer. It could be either IPv4 or IPv6.
          consumer_user_agent:
            description: The payer's User Agent. For example, Mozilla/5.0 (Macintosh; Intel Mac OS X x.y;
              rv:42.0).
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^.*$
    blik_one_click:
      title: blik_one_click
      description: Information used to pay using BLIK one-click flow.
      type: object
      required:
      - consumer_reference
      properties:
        auth_code:
          description: The 6-digit code used to authenticate a consumer within BLIK.
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
        consumer_reference:
          description: The merchant generated, unique reference serving as a primary identifier for accounts
            connected between Blik and a merchant.
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[ -~]{3,64}$
        alias_label:
          description: A bank defined identifier used as a display name to allow the payer to differentiate
            between multiple registered bank accounts.
          type: string
          minLength: 8
          maxLength: 35
          pattern: ^[ -~]{8,35}$
        alias_key:
          description: A Blik-defined identifier for a specific Blik-enabled bank account that is associated
            with a given merchant. Used only in conjunction with a Consumer Reference.
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[0-9]+$
    blik_one_click_response:
      title: blik_one_click_response
      description: Information used to pay using BLIK one-click flow.
      type: object
      properties:
        consumer_reference:
          description: The merchant generated, unique reference serving as a primary identifier for accounts
            connected between Blik and a merchant.
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[ -~]{3,64}$
    blik_request:
      title: blik_request
      description: Information needed to pay using BLIK.
      type: object
      required:
      - country_code
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        email:
          allOf:
          - $ref: '#/components/schemas/email_address'
          - description: The email address of the account holder associated with this payment method.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/blik_experience_context'
          - description: Customizes the payer experience during the approval process for the payment.
        level_0:
          allOf:
          - $ref: '#/components/schemas/blik_seamless'
          - description: The level_0 integration flow object.
        one_click:
          allOf:
          - $ref: '#/components/schemas/blik_one_click'
          - description: The one-click integration flow object.
    blik_seamless:
      title: blik_level_0
      description: Information used to pay using BLIK level_0 flow.
      type: object
      required:
      - auth_code
      properties:
        auth_code:
          description: The 6-digit code used to authenticate a consumer within BLIK.
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
    callback_configuration:
      title: callback_configuration
      description: CallBack Configuration that the merchant can provide to PayPal/Venmo.
      type: object
      required:
      - callback_events
      - callback_url
      properties:
        callback_events:
          description: An array of callback events merchant can subscribe to for the corresponding callback
            url.
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            title: callback events
            description: CallBack event.
            type: string
            enum:
            - SHIPPING_ADDRESS
            - SHIPPING_OPTIONS
        callback_url:
          description: Merchant provided CallBack url.PayPal/Venmo will use this url to call the merchant
            back when the events occur .PayPal/Venmo expects a secured url usually in the https format.merchant
            can append the cart id or other params part of the url as query or path params.
          type: string
          minLength: 10
          maxLength: 2040
          format: uri
    capture:
      title: capture
      description: A captured payment.
      type: object
      allOf:
      - $ref: '#/components/schemas/capture_status'
      - type: object
        properties:
          id:
            description: The PayPal-generated ID for the captured payment.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          amount:
            allOf:
            - $ref: '#/components/schemas/amount_with_breakdown'
            - description: The amount for this captured payment.
              readOnly: true
          invoice_id:
            description: The API caller-provided external invoice number for this order. Appears in both
              the payer's transaction history and the emails that the payer receives.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          custom_id:
            description: The API caller-provided external ID. Used to reconcile API caller-initiated transactions
              with PayPal transactions. Appears in transaction and settlement reports.
            type: string
            minLength: 0
            maxLength: 255
            pattern: ^[\S\s]*$
          network_transaction_reference:
            allOf:
            - $ref: '#/components/schemas/network_transaction'
          seller_protection:
            allOf:
            - $ref: '#/components/schemas/seller_protection'
            - readOnly: true
          final_capture:
            description: Indicates whether you can make additional captures against the authorized payment.
              Set to `true` if you do not intend to capture additional payments against the authorization.
              Set to `false` if you intend to capture additional payments against the authorization.
            type: boolean
            default: false
            readOnly: true
          seller_receivable_breakdown:
            allOf:
            - $ref: '#/components/schemas/seller_receivable_breakdown'
            - readOnly: true
          disbursement_mode:
            allOf:
            - $ref: '#/components/schemas/disbursement_mode'
          links:
            description: An array of related [HATEOAS links](/docs/api/reference/api-responses/#hateoas-links).
            type: array
            minItems: 0
            maxItems: 32767
            readOnly: true
            items:
              allOf:
              - $ref: '#/components/schemas/link_description-2'
              - title: link_description
          processor_response:
            allOf:
            - $ref: '#/components/schemas/processor_response'
            - description: An object that provides additional processor information for a direct credit
                card transaction.
      - allOf:
        - $ref: '#/components/schemas/activity_timestamps'
    capture_status:
      title: capture_status
      description: The status and status details of a captured payment.
      type: object
      properties:
        status:
          title: Capture Status
          description: The status of the captured payment.
          type: string
          enum:
          - COMPLETED
          - DECLINED
          - PARTIALLY_REFUNDED
          - PENDING
          - REFUNDED
          - FAILED
          readOnly: true
        status_details:
          allOf:
          - $ref: '#/components/schemas/capture_status_details'
          - description: The details of the captured payment status.
            readOnly: true
    capture_status_details:
      title: capture_status_details
      description: The details of the captured payment status.
      type: object
      properties:
        reason:
          title: Capture Incomplete Reason
          description: The reason why the captured payment status is `PENDING` or `DENIED`.
          type: string
          enum:
          - BUYER_COMPLAINT
          - CHARGEBACK
          - ECHECK
          - INTERNATIONAL_WITHDRAWAL
          - OTHER
          - PENDING_REVIEW
          - RECEIVING_PREFERENCE_MANDATES_MANUAL_ACTION
          - REFUNDED
          - TRANSACTION_APPROVED_AWAITING_FUNDING
          - UNILATERAL
          - VERIFICATION_REQUIRED
          - DECLINED_BY_RISK_FRAUD_FILTERS
    card:
      title: card
      description: The payment card to use to fund a payment. Can be a credit or debit card.
      type: object
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/instrument_id'
          - description: The PayPal-generated ID for the card.
            readOnly: true
        name:
          description: The card holder's name as it appears on the card.
          type: string
          minLength: 1
          maxLength: 300
          pattern: ^.{1,300}$
        number:
          description: The primary account number (PAN) for the payment card.
          type: string
          minLength: 13
          maxLength: 19
          pattern: ^[0-9]{13,19}$
        expiry:
          allOf:
          - $ref: '#/components/schemas/date_year_month'
          - description: 'The card expiration year and month, in [Internet date format](https://tools.ietf.org/html/rfc3339#section-5.6)
              For example: 2028-04'
        security_code:
          description: The three- or four-digit security code of the card. Also known as the CVV, CVC,
            CVN, CVE, or CID. This parameter cannot be present in the request when `payment_initiator=MERCHANT`.
          type: string
          minLength: 3
          maxLength: 4
          pattern: ^[0-9]{3,4}$
        last_digits:
          description: The last digits of the payment card.
          type: string
          minLength: 2
          maxLength: 4
          pattern: ^[0-9]{2,4}$
          readOnly: true
        card_type:
          allOf:
          - $ref: '#/components/schemas/card_brand'
          - description: The card brand or network. Typically used in the response. <b>DEPRECATED</b><br><table><tr><th>See</th></tr><tr><td>type</td></tr></table>
            deprecated: true
            readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/card_type'
          - description: The payment card type.
        brand:
          allOf:
          - $ref: '#/components/schemas/card_brand'
          - description: The card brand or network. Typically used in the response.
        billing_address:
          allOf:
          - $ref: '#/components/schemas/address_portable'
          - description: The billing address for this card. Supports only the `address_line_1`, `address_line_2`,
              `admin_area_1`, `admin_area_2`, `postal_code`, and `country_code` properties.
            not:
              anyOf:
              - required:
                - address_line_3
              - required:
                - admin_area_3
              - required:
                - admin_area_4
              - required:
                - address_details
        attributes:
          allOf:
          - $ref: '#/components/schemas/card_attributes'
          - title: card_attributes
            description: Additional attributes associated with the use of this card.
    card_attributes:
      title: card_attributes
      description: Additional attributes associated with the use of this card.
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/card_customer'
        vault:
          allOf:
          - $ref: '#/components/schemas/vault_instruction_base'
          - description: Instruction to vault the card based on the specified strategy.
        verification:
          allOf:
          - $ref: '#/components/schemas/card_verification'
          - description: Instruction to optionally verify the card based on the specified strategy.
    card_attributes_response:
      title: card_attributes_response
      description: Additional attributes associated with the use of this card.
      type: object
      properties:
        vault:
          $ref: '#/components/schemas/card_vault_response'
    card_brand:
      title: card_brand
      description: The card network or brand. Applies to credit, debit, gift, and payment cards.
      type: string
      enum:
      - VISA
      - MASTERCARD
      - DISCOVER
      - AMEX
      - SOLO
      - JCB
      - STAR
      - DELTA
      - SWITCH
      - MAESTRO
      - CB_NATIONALE
      - CONFIGOGA
      - CONFIDIS
      - ELECTRON
      - CETELEM
      - CHINA_UNION_PAY
      - DINERS
      - ELO
      - HIPER
      - HIPERCARD
      - RUPAY
      - GE
      - SYNCHRONY
      - EFTPOS
      - CARTE_BANCAIRE
      - STAR_ACCESS
      - PULSE
      - NYCE
      - ACCEL
      - UNKNOWN
    card_customer:
      title: card_customer
