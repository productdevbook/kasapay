              your representation of a customer.
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[0-9a-zA-Z-_.^*$@#]+$
    card_experience_context:
      title: card_experience_context
      description: Customizes the payer experience during the 3DS Approval for payment.
      type: object
      properties:
        return_url:
          allOf:
          - $ref: '#/components/schemas/url'
          - description: The URL where the customer will be redirected upon successfully completing the
