    merchant_partner_customer_id:
      title: merchant_partner_customer_id
      description: The unique ID for a customer generated by PayPal.
      type: string
      minLength: 1
      maxLength: 22
      pattern: ^[0-9a-zA-Z_-]+$
    mobile_web_context:
      title: Mobile Web App Switch Context
      description: Buyer's mobile web browser context to app switch to the PayPal consumer app.
      type: object
      properties:
        return_flow:
          description: Merchant preference on how the buyer can navigate back to merchant website post
            approving the transaction on the PayPal App.
          type: string
          enum:
          - AUTO
          - MANUAL
          default: AUTO
          readOnly: true
        buyer_user_agent:
          description: 'User agent from the request originating from the buyer''s device. This will be
            used to identify the buyer''s operating system and browser versions. NOTE: Merchants must
            not alter or modify the buyer''s device user agent.'
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^.*$
    money:
      title: Money
      description: The currency and amount for a financial transaction, such as a balance or payment due.
      type: object
      required:
      - currency_code
      - value
      properties:
        currency_code:
          $ref: '#/components/schemas/currency_code'
        value:
          description: The value, which might be:<ul><li>An integer for currencies like `JPY` that are
            not typically fractional.</li><li>A decimal fraction for currencies like `TND` that are subdivided
            into thousandths.</li></ul>For the required number of decimal places for a currency code,
            see [Currency Codes](/api/rest/reference/currency-codes/).
          type: string
          minLength: 0
          maxLength: 32
          pattern: ^((-?[0-9]+)|(-?([0-9]+)?[.][0-9]+))$
    mybank:
      title: mybank
      description: Information used to pay using MyBank.
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        bic:
          allOf:
          - $ref: '#/components/schemas/bic'
          - description: The bank identification code (BIC).
        iban_last_chars:
          $ref: '#/components/schemas/iban_last_chars'
    mybank_request:
      title: mybank_request
      description: Information needed to pay using MyBank.
      type: object
      required:
      - country_code
      - name
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/full_name'
          - title: name
            description: The name of the account holder associated with this payment method.
        country_code:
          allOf:
          - $ref: '#/components/schemas/country_code-2'
          - description: The two-character ISO 3166-1 country code.
        experience_context:
          allOf:
          - $ref: '#/components/schemas/experience_context_base'
          - description: Customizes the payer experience during the approval process for the payment.
    name:
      title: Name
      description: The name of the party.
      type: object
      properties:
        prefix:
          description: The prefix, or title, to the party's name.
          type: string
          minLength: 0
          maxLength: 140
          pattern: ^[\S\s]*$
        given_name:
          description: When the party is a person, the party's given, or first, name.
          type: string
          minLength: 0
          maxLength: 140
          pattern: ^[\S\s]*$
        surname:
          description: When the party is a person, the party's surname or family name. Also known as the
            last name. Required when the party is a person. Use also to store multiple surnames including
            the matronymic, or mother's, surname.
          type: string
          minLength: 0
          maxLength: 140
          pattern: ^[\S\s]*$
        middle_name:
          description: When the party is a person, the party's middle name. Use also to store multiple
            middle names including the patronymic, or father's, middle name.
          type: string
          minLength: 0
          maxLength: 140
          pattern: ^[\S\s]*$
        suffix:
          description: The suffix for the party's name.
          type: string
          minLength: 0
          maxLength: 140
          pattern: ^[\S\s]*$
        full_name:
          description: When the party is a person, the party's full name.
          type: string
          minLength: 0
          maxLength: 300
          pattern: ^[\S\s]*$
    native_app_context:
      title: App Switch Preferences on Native App
      description: Merchant provided, buyer's native app preferences to app switch to the PayPal consumer
        app.
      type: object
      properties:
        os_type:
          description: Operating System type of the device that the buyer is using.
          type: string
          enum:
          - ANDROID
          - IOS
          - OTHER
          readOnly: true
        os_version:
          description: Operating System version of the device that the buyer is using.
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^.*$
          readOnly: true
    net_amount_breakdown_item:
      title: net_amount_breakdown
      description: The net amount. Returned when the currency of the refund is different from the currency
        of the PayPal account where the merchant holds their funds.
      type: object
      properties:
        payable_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The net amount debited from the merchant's PayPal account.
            readOnly: true
        converted_amount:
          allOf:
          - $ref: '#/components/schemas/money'
          - description: The converted payable amount.
            readOnly: true
        exchange_rate:
          allOf:
          - $ref: '#/components/schemas/exchange_rate'
          - description: The exchange rate that determines the amount that was debited from the merchant's
              PayPal account.
            readOnly: true
    network_token_request:
      title: network_token
      description: The Third Party Network token used to fund a payment.
      type: object
      required:
      - expiry
      - number
      properties:
        number:
          description: Third party network token number.
          type: string
          minLength: 13
          maxLength: 19
          pattern: ^[0-9]{13,19}$
        expiry:
          allOf:
          - $ref: '#/components/schemas/date_year_month'
          - description: The card expiration year and month, in [Internet date format](https://tools.ietf.org/html/rfc3339#section-5.6).
        cryptogram:
          description: An Encrypted one-time use value that's sent along with Network Token. This field
            is not required to be present for recurring transactions.
          type: string
          minLength: 28
          maxLength: 32
          pattern: ^.*$
        eci_flag:
          $ref: '#/components/schemas/eci_flag'
        token_requestor_id:
          description: A TRID, or a Token Requestor ID, is an identifier used by merchants to request
            network tokens from card networks. A TRID is a precursor to obtaining a network token for
            a credit card primary account number (PAN), and will aid in enabling secure card on file (COF)
            payments and reducing fraud.
          type: string
          minLength: 1
          maxLength: 11
          pattern: ^[0-9A-Z_]+$
    network_transaction:
      title: network_transaction
      description: Reference values used by the card network to identify a transaction.
      type: object
      properties:
        id:
          description: Transaction reference id returned by the scheme. For Visa and Amex, this is the
            "Tran id" field in response. For MasterCard, this is the "BankNet reference id" field in response.
            For Discover, this is the "NRID" field in response. The pattern we expect for this field from
            Visa/Amex/CB/Discover is numeric, Mastercard/BNPP is alphanumeric and Paysecure is alphanumeric
            with special character -.
          type: string
          minLength: 9
          maxLength: 36
          pattern: ^[a-zA-Z0-9-_@.:&+=*^'~#!$%()]+$
        date:
          description: The date that the transaction was authorized by the scheme. This field may not
            be returned for all networks. MasterCard refers to this field as "BankNet reference date".
            For some specific networks, such as MasterCard and Discover, this date field is mandatory
            when the `previous_network_transaction_reference_id` is passed.
          type: string
          minLength: 4
          maxLength: 4
          pattern: ^[0-9]+$
        network:
          allOf:
          - $ref: '#/components/schemas/card_brand'
          - description: Name of the card network through which the transaction was routed.
        acquirer_reference_number:
          description: Reference ID issued for the card transaction. This ID can be used to track the
            transaction across processors, card brands and issuing banks.
          type: string
          minLength: 1
          maxLength: 36
          pattern: ^[a-zA-Z0-9]+$
    network_transaction_reference:
      title: network_transaction_reference
      description: Reference values used by the card network to identify a transaction.
      type: object
      required:
      - id
      allOf:
      - $ref: '#/components/schemas/network_transaction'
    order:
      title: Order
      description: The order details.
      type: object
      allOf:
      - allOf:
        - $ref: '#/components/schemas/activity_timestamps'
        - title: activity_timestamps
      - type: object
        title: Order
        description: The order details.
        properties:
          id:
            description: The ID of the order.
            type: string
            minLength: 0
            maxLength: 2147483647
            pattern: ^[\S\s]*$
            readOnly: true
          payment_source:
            allOf:
            - $ref: '#/components/schemas/payment_source_response'
          intent:
            allOf:
            - $ref: '#/components/schemas/checkout_payment_intent'
          payer:
            allOf:
            - $ref: '#/components/schemas/payer'
            - description: DEPRECATED. The customer is also known as the payer. The Payer object was intended
                to only be used with the `payment_source.paypal` object. In order to make this design
                more clear, the details in the `payer` object are now available under `payment_source.paypal`.
                Please use `payment_source.paypal`. <b>DEPRECATED</b><br><table><tr><th>See</th><th>Since
                Version</th></tr><tr><td>payment_source.paypal</td><td>2.9</td></tr></table>
              deprecated: true
          purchase_units:
            description: An array of purchase units. Each purchase unit establishes a contract between
              a customer and merchant. Each purchase unit represents either a full or partial order that
              the customer intends to purchase from the merchant.
            type: array
            minItems: 1
            maxItems: 10
            items:
              allOf:
              - $ref: '#/components/schemas/purchase_unit'
              - title: purchase_unit
                description: A purchase unit. Establishes a contract between a customer and merchant.
          status:
            allOf:
            - $ref: '#/components/schemas/order_status'
            - readOnly: true
          links:
            description: An array of request-related HATEOAS links. To complete payer approval, use the
              `approve` link to redirect the payer. The API caller has 6 hours (default setting, this
              which can be changed by your account manager to 24/48/72 hours to accommodate your use case)
              from the time the order is created, to redirect your payer. Once redirected, the API caller
              has 6 hours for the payer to approve the order and either authorize or capture the order.
              If you are not using the PayPal JavaScript SDK to initiate PayPal Checkout (in context)
              ensure that you include `application_context.return_url` is specified or you will get "We're
              sorry, Things don't appear to be working at the moment" after the payer approves the payment.
            type: array
            minItems: 0
            maxItems: 32767
            readOnly: true
            items:
              allOf:
              - $ref: '#/components/schemas/link_description-2'
              - title: link_description
                description: A request-related [HATEOAS link](/api/rest/responses/#hateoas-links). To
                  complete payer approval, use the `approve` link with the `GET` method.
    order_application_context:
      title: application_context
      description: Customizes the payer experience during the approval process for the payment with PayPal.<blockquote><strong>Note:</strong>
        Partners and Marketplaces might configure <code>brand_name</code> and <code>shipping_preference</code>
        during partner account setup, which overrides the request values.</blockquote>
      type: object
      properties:
        brand_name:
          description: DEPRECATED. The label that overrides the business name in the PayPal account on
            the PayPal site. The fields in `application_context` are now available in the `experience_context`
            object under the `payment_source` which supports them (eg. `payment_source.paypal.experience_context.brand_name`).
            Please specify this field in the `experience_context` object instead of the `application_context`
            object.
          type: string
          minLength: 1
          maxLength: 127
          pattern: ^[\S\s]*$
        locale:
          allOf:
          - $ref: '#/components/schemas/language'
          - description: DEPRECATED. The BCP 47-formatted locale of pages that the PayPal payment experience
              shows. PayPal supports a five-character code. For example, `da-DK`, `he-IL`, `id-ID`, `ja-JP`,
              `no-NO`, `pt-BR`, `ru-RU`, `sv-SE`, `th-TH`, `zh-CN`, `zh-HK`, or `zh-TW`.  The fields in
              `application_context` are now available in the `experience_context` object under the `payment_source`
              which supports them (eg. `payment_source.paypal.experience_context.locale`). Please specify
              this field in the `experience_context` object instead of the `application_context` object.
        landing_page:
          title: Order Application Context Landing Page
          description: DEPRECATED. DEPRECATED. The type of landing page to show on the PayPal site for
            customer checkout.  The fields in `application_context` are now available in the `experience_context`
            object under the `payment_source` which supports them (eg. `payment_source.paypal.experience_context.landing_page`).
            Please specify this field in the `experience_context` object instead of the `application_context`
            object. <b>DEPRECATED</b><br><table><tr><th>See</th><th>Since Version</th></tr><tr><td>payment_source.paypal.experience_context.landing_page</td><td>2.9</td></tr></table>
          type: string
          enum:
          - LOGIN
          - BILLING
          - NO_PREFERENCE
          default: NO_PREFERENCE
          deprecated: true
        shipping_preference:
          title: Order Application Context Shipping Preference
          description: DEPRECATED. DEPRECATED. The shipping preference:<ul><li>Displays the shipping address
            to the customer.</li><li>Enables the customer to choose an address on the PayPal site.</li><li>Restricts
            the customer from changing the address during the payment-approval process.</li></ul>.  The
            fields in `application_context` are now available in the `experience_context` object under
            the `payment_source` which supports them (eg. `payment_source.paypal.experience_context.shipping_preference`).
            Please specify this field in the `experience_context` object instead of the `application_context`
            object. <b>DEPRECATED</b><br><table><tr><th>See</th><th>Since Version</th></tr><tr><td>payment_source.paypal.experience_context.shipping_preference</td><td>2.9</td></tr></table>
          type: string
          enum:
          - GET_FROM_FILE
          - NO_SHIPPING
          - SET_PROVIDED_ADDRESS
          default: GET_FROM_FILE
          deprecated: true
        user_action:
          description: DEPRECATED. Configures a <strong>Continue</strong> or <strong>Pay Now</strong>
            checkout flow.  The fields in `application_context` are now available in the `experience_context`
            object under the `payment_source` which supports them (eg. `payment_source.paypal.experience_context.user_action`).
            Please specify this field in the `experience_context` object instead of the `application_context`
            object.
          type: string
          enum:
          - CONTINUE
          - PAY_NOW
          default: CONTINUE
        payment_method:
          allOf:
          - $ref: '#/components/schemas/payment_method'
          - description: DEPRECATED. The customer and merchant payment preferences. The fields in `application_context`
              are now available in the `experience_context` object under the `payment_source` which supports
              them (eg. `payment_source.paypal.experience_context.payment_method_selected`). Please specify
              this field in the `experience_context` object instead of the `application_context` object..
        return_url:
          description: DEPRECATED. The URL where the customer is redirected after the customer approves
            the payment. The fields in `application_context` are now available in the `experience_context`
            object under the `payment_source` which supports them (eg. `payment_source.paypal.experience_context.return_url`).
            Please specify this field in the `experience_context` object instead of the `application_context`
            object.
          type: string
          minLength: 0
          maxLength: 2147483647
          format: uri
        cancel_url:
          description: DEPRECATED. The URL where the customer is redirected after the customer cancels
            the payment. The fields in `application_context` are now available in the `experience_context`
            object under the `payment_source` which supports them (eg. `payment_source.paypal.experience_context.cancel_url`).
            Please specify this field in the `experience_context` object instead of the `application_context`
            object.
          type: string
          minLength: 0
          maxLength: 2147483647
          format: uri
        stored_payment_source:
          allOf:
          - $ref: '#/components/schemas/stored_payment_source'
          - description: DEPRECATED. Provides additional details to process a payment using a `payment_source`
              that has been stored or is intended to be stored (also referred to as stored_credential
              or card-on-file).<br/>Parameter compatibility:<br/><ul><li>`payment_type=ONE_TIME` is compatible
              only with `payment_initiator=CUSTOMER`.</li><li>`usage=FIRST` is compatible only with `payment_initiator=CUSTOMER`.</li><li>`previous_transaction_reference`
              or `previous_network_transaction_reference` is compatible only with `payment_initiator=MERCHANT`.</li><li>Only
              one of the parameters - `previous_transaction_reference` and `previous_network_transaction_reference`
              - can be present in the request.</li></ul>.  The fields in `stored_payment_source` are now
              available in the `stored_credential` object under the `payment_source` which supports them
              (eg. `payment_source.card.stored_credential.payment_initiator`). Please specify this field
              in the `payment_source` object instead of the `application_context` object. <b>DEPRECATED</b><br><table><tr><th>See</th><th>Since
              Version</th></tr><tr><td>payment_source.card.stored_credential</td><td>2.9</td></tr></table>
            deprecated: true
