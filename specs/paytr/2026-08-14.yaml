      - 'Status: Sorgulama sonucu'
    - - cardType (string)
      - credit / debit
      - 'Kart Türü: Kartın tipi'
    - - businessCard (string)
      - y / n
      - 'Şirket Kartı: Kartın şirket kartı olup olmadığı bilgisi'
