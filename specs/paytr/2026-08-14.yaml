- path: link-api/linkle-api-callback
  url: https://dev.paytr.com/link-api/linkle-api-callback
  language: tr
  digest: 7214d0ea75cd02e3
  tables:
  - under: Link API Callback Servisi
    columns:
    - Alan Adı
    - Açıklama
    rows:
    - - hash
      - PayTR sisteminden gönderilen değerlerin doğruluğunu kontrol etmeniz için güvenlik amaçlı oluşturulan
        hash değeri (Hesaplama ile ilgili olarak örnek kodlara bakmalısınız)
    - - merchant_oid
      - PayTR tarafından oluşturulan sipariş referans numarası.
    - - status
      - Başarılı ödeme sonucunda success değeri döner (Link API'de başarısız ödemeler için bildirim yapılmaz).
    - - total_amount
      - 'Müşteriden tahsil edilen toplam tutar. (100 ile çarpılmış hali gönderilir. 34.56 => 3456) (Not:
        Müşteri vade farklı taksit seçtiği vb. durumlarda, 1. ADIM’da gönderdiğiniz “payment_amount” değerinden
        daha yüksek olabilir)'
    - - payment_amount
      - 'Sipariş tutarı: 1. ADIM’da gönderdiğiniz “payment_amount” değeridir. (100 ile çarpılmış hali
        gönderilir. 34.56 => 3456)'
    - - payment_type
      - Müşterinin hangi ödeme şekli ile ödemesini tamamladığını belirtir. Örn. card, bex vb. değerleri
        alır.
    - - currency
      - 'Para birimi: Ödemenin hangi para birimi üzerinden yapıldığını belirtir. TL, USD, EUR, GBP, RUB
        değerlerinden birini alır.'
    - - callback_id
      - Link oluşturmada (create) ilettiğiniz callbak_id bilgisi.
    - - merchant_id
      - PayTR mağaza numaranız.
    - - test_mode
      - Mağazanız test modunda iken veya canlı modda yapılan test işlemlerde 1 olarak gönderilir
