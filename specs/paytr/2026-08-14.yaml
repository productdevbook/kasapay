      - Müşteri, kendisine tanınmış olan işlem süresinde (1. ADIM’da tanımlanan timeout_limit değeri)
        işlemini tamamlamadı veya müşteri ödeme sayfasını kapatarak işlemi sonlandırdı.
    - - '7'
      - Bildiriminiz alınmadı, lütfen önceki bildiriminizin kontrolünün sonuçlanmasını bekleyin.
      - Müşteri henüz kontrolü sonuçlanmamış bir ödeme bildirimi bulunurken, tekrar bildirim yaptı.
    - - '41'
      - Havale/EFT ödemesi ile bildirimdeki Ad Soyadı uyuşmuyor.
      - Müşterinin bildirim yaparken girdiği Ad Soyadı ile banka kayıtlarındaki Ad Soyadı uyuşmadı.
    - - '42'
      - Havale/EFT ödemesi ile bildirimdeki TCKN uyuşmuyor.
      - Müşterinin bildirim yaparken girdiği TCKN ile banka kayıtlarındaki TCKN uyuşmadı.
    - - '43'
      - Bu Havale/EFT ödemesi daha önce onaylanmış.
      - Müşterinin bildirimi sonrası yapılan kontrolde, bu ödemenin daha önce bildirilip onay aldığı görüldü.
    - - '44'
      - Bu Havale/EFT ödemesi iade edilmiş.
      - Müşterinin bildirimi sonrası yapılan kontrolde, bu ödemenin daha önce iade edildiği görüldü.
    - - '45'
      - Dekonttaki iki farklı Ad-Soyadından yalnızca birisi yazılmış
      - Müşterinin bildirimi sonrası yapılan kontrolde,dekontta yazan iki Ad Soyadı bilgisinden yalnızca
        birisinin girildiği görüldü
