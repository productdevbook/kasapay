  - under: iFrame API Step 2
    columns:
    - failed_reason_code
    - failed_reason_msg
    - Description
    rows:
    - - '0'
      - VARIOUS (READ DESCRIPTION)
      - 'Detailed error message on why the payment was not approved (For example: Card limit / balance
        is insufficient)'
    - - '1'
      - Authentication not performed. Please try again and complete the process
      - The customer did not enter the mobile number in the authentication step
    - - '2'
      - The customer did not enter the mobile number in the authentication step
      - The customer did not enter the correct password for authentication
    - - '3'
      - Not approved after the security checks
      - The customer's transaction failed to pass security checks
    - - '6'
      - The customer refused to pay and left the checkout page.
      - The customer did not complete the transaction in the processing time (timeout_limit value defined
        in STEP 1) or the customer closed the payment page and ended the transaction.
    - - '8'
      - Installment payment cannot be made by this card
      - The installment payment method selected by the customer is not allowed with the card used
    - - '9'
      - There is no authorization to process this card
      - Your store does not have transaction authorization for the card the customer is using
    - - '10'
      - 3D Secure must be used for this transaction
      - The customer must pay with 3D Secure for this type of transaction
    - - '11'
      - Security alert. Check your trading customer
      - There is fraud detection in the customer's transaction. For your safety, check the customer's
        transactions
    - - '99'
      - 'Operation failed: Technical integration error'
      - Response to return if there is a technical integration error. (if debug_on value is 0)
