kind: documentation record, not an API description
provider: paytr
source: https://dev.paytr.com/sitemap.xml
fetched: '2026-08-14'
note: 'PayTR publishes no machine-readable description. These are the field tables from their documentation,
  kept so that a change to one is visible in a diff. The column saying whether a field enters the token
  hash is the one that matters most: the hash signs the request, and a field silently entering or leaving
  it is a signing failure that looks like bad credentials.'
warning: The order of the rows is not the order of the hash. On the iFrame API the table lists currency
  fifth and PayTR's own sample code signs it ninth. The table says which fields are signed; only their
  sample code says in what order.
