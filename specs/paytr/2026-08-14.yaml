    - - schema (string)
      - VISA, MASTERCARD, AMEX, TROY, OTHER
      - Kartın hangi şemaya ait olduğu. (Kartın hangi şemaya ait olduğu bilinmiyorsa OTHER döner.)
    - - bankCode (int)
      - 'Örnek: 0010'
      - 'Banka Kodu: Kart bankasının kodu'
    - - allow_non3d (string)
      - Y(yes) ve N(no)
      - Non-3D işlem izni sonucu
