  - under: Direkt API Entegrasyonu 2. Adım
    columns:
    - failed_reason_code
    - failed_reason_msg
    - Açıklama
    rows:
    - - '0'
      - DEĞİŞKEN (AÇIKLAMAYI OKUYUN)
      - 'Ödemenin neden onaylanmadığına ilişkin,detaylı hata mesajı (Örneğin: Kartın limiti /bakiyesi
        yetersiz).'
    - - '1'
      - Kimlik Doğrulama yapılmadı. Lütfen tekrar deneyin ve işlemi tamamlayın.
      - Müşteri, kimlik doğrulama adımında cep telefonu numarasını girmedi.
    - - '2'
      - Kimlik Doğrulama başarısız. Lütfen tekrar deneyin ve şifreyi doğru girin.
      - Müşteri, cep telefonuna gelen şifreyi doğru girmedi.
    - - '3'
      - Güvenlik kontrolü sonrası onay verilmedi veya kontrol yapılamadı.
      - Müşterinin işlemi PayTR tarafından güvenlik kontrolünden geçemedi veya kontrol yapılamadı.
    - - '6'
      - Müşteri ödeme yapmaktan vazgeçti ve ödeme sayfasından ayrıldı.
      - Müşteri, kendisine tanınmış olan işlem süresinde(1. ADIM’da tanımlanan request_exp_date değeri)
        işlemini tamamlamadı veya müşteri ödeme sayfasını kapatarak işlemi sonlandırdı.
    - - '8'
      - Bu karta taksit yapılamamaktadır.
      - Müşterinin kullanmakta olduğu kart ile seçmiş olduğu taksitli ödeme yöntemi kullanılamaz.
    - - '9'
      - Bu kart ile işlem yetkisi bulunmamaktadır.
      - Müşterinin kullanmakta olduğu kart için mağazanızın işlem yetkisi bulunmuyor.
    - - '10'
      - Bu işlemde 3D Secure kullanılmalıdır.
      - Müşteri, yapmış olduğu işlemde 3D Secure ile ödeme yapmalıdır.
    - - '11'
      - Güvenlik uyarısı. İşlem yapan müşterinizi kontrol edin.
      - Müşterinin işleminde fraud tespiti bulunuyor. Güvenliğiniz için müşterinin işlemlerini kontrol
        edin.
    - - '99'
      - 'İşlem başarısız: Teknik entegrasyon hatası.'
      - Teknik entegrasyon hatası varsa dönülecektir. (debug_on değeri 0 ise)
