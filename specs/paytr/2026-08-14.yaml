- path: en/havale-eft-iframe-api/havale-eft-iframe-api-2-adim
  url: https://dev.paytr.com/en/havale-eft-iframe-api/havale-eft-iframe-api-2-adim
  language: en
  digest: 3bac90260ebdfe88
  tables:
  - under: Transfer/EFT iFrame API Step 2
    columns:
    - failed_reason_code
    - failed_reason_msg
    - Description
    rows:
    - - '4'
      - Transfer/EFT payment could not be detected
      - The payment could not be reached with the information specified by the customer in the payment
        notification form
    - - '5'
      - Transfer/EFT payment amount is insufficient.Please notify as much as the amount you send
      - Since the amount sent by the customer to the bank is less than the shopping amount (payment_amount),
        approval has not been given.
    - - '6'
      - The customer refused to pay and left the checkout page.
      - The customer did not complete the transaction in the processing time (timeout_limit value defined
        in STEP 1) or the customer closed the payment page and ended the transaction.
    - - '7'
      - Your notification has not been received, please wait for your previous notification to be checked.
      - While the Customer had a payment notification that had not yet been checked, made a notification
        again
    - - '41'
      - The first name and last name in the notification do not match the Transfer/EFT Payment
      - The Name and Surname entered by the customer while making the notification did not match the Name
        and Surname in the bank records
    - - '42'
      - The transfer / EFT payment does not match the TCKN in the notification
      - The TCKN entered by the customer while making the notification did not match the TCKN in the bank
        records
    - - '43'
      - This Transfer/EFT payment has been previously approved
      - A check made after the customer's notification showed that this payment was previously reported
        and approved
    - - '44'
      - This Transfer/EFT payment has been refunded
      - A check after the customer's notification showed that this payment had been refunded earlier
    - - '45'
      - Only one of the two different Name-Surnames on the receipt is written
      - A check made after the customer's notification showed that only one of the two first and last
        names written on the receipt was entered
