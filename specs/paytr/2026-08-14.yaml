      - Hayır
      - 0 veya 1(Entegrasyon ve test sürecinde hataları tespit etmek için mutlaka 1
    - - sync_mode (int)
      - 'Sync Mode: Ödeme isteğinin gönderilmesi ardından işlem sonucuna göre başarılı veya başarısız
        sayfasına yönlendirme yapılmadan, JSON formatında olan yanıt direkt olarak istek sonucuna döner.
        Ek olarak; işleme ait detaylar tanımlı olan Bildirim URL adresine gönderilir. Sync mode sonucunda
        dönen status alanının alabileceği değerler “failed”, “wait_callback” ve “success” şeklindedir.Not:
