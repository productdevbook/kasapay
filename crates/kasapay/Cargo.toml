[package]
name = "kasapay"
description = "One payment API in Rust over any payment provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kasapay-core.workspace = true
kasapay-iyzico = { workspace = true, optional = true }
kasapay-paytr = { workspace = true, optional = true }
kasapay-stripe = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = []
# Every feature adds a provider and nothing else; enabling all of them is valid.
iyzico = ["dep:kasapay-iyzico"]
paytr = ["dep:kasapay-paytr"]
stripe = ["dep:kasapay-stripe"]

[[example]]
name = "stripe_charge"
required-features = ["stripe"]

[[example]]
name = "iyzico_checkout"
required-features = ["iyzico"]

[[example]]
name = "iyzico_link"
required-features = ["iyzico"]

[[example]]
name = "paytr_payment"
required-features = ["paytr"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
