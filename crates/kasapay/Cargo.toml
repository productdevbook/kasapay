[package]
name = "kasapay"
description = "One payment API in Rust over any payment provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kasapay-core.workspace = true
kasapay-iyzico = { workspace = true, optional = true }
kasapay-stripe = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[features]
default = []
# Every feature adds a provider and nothing else; enabling all of them is valid.
iyzico = ["dep:kasapay-iyzico"]
stripe = ["dep:kasapay-stripe"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
